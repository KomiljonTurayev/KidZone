plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.kidzone.app'
    compileSdk 35 // Stable version for production

    defaultConfig {
        applicationId "uz.kidzone.app"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // Optimization for production
            ndk {
                debugSymbolLevel 'FULL'
            }
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Modern Android App Bundle configuration
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0' // Use KTX for better extensions even in Java
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // WebView and Browser
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'

    // Google Services
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Splash Screen API
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
