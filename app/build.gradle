plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-kapt'
}

android {
    namespace 'uz.kidzone.app'
    compileSdk 35 // Stable version for production

    // Signing from environment (CI) or local keystore.properties
    def keystoreProps = new Properties()
    def keystoreFile = file('keystore.properties')
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_FILE")
            if (envKeystore) {
                storeFile     file(envKeystore)
                storePassword System.getenv("STORE_PASSWORD") ?: ""
                keyAlias      System.getenv("KEY_ALIAS")      ?: ""
                keyPassword   System.getenv("KEY_PASSWORD")   ?: ""
            } else if (keystoreProps['storeFile']) {
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "uz.kidzone.app"
        minSdk 26
        targetSdk 35
        // CI passes -PversionCode=<calculated>; local default = 14
        versionCode  project.hasProperty('versionCode')  ? project.versionCode.toInteger()  : 14
        versionName  project.hasProperty('versionName')  ? project.versionName               : "1.4.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${project.findProperty('GEMINI_API_KEY') ?: ''}\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'FULL' }
        }

        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Allow Android stubs (Log, etc.) to return defaults in JVM unit tests
                // instead of throwing "not mocked" exceptions
                systemProperty 'robolectric.logging.enabled', 'false'
            }
            returnDefaultValues = true
        }
    }

    // Modern Android App Bundle configuration
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.13'
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // WebView and Browser
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Splash Screen API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Google Generative AI (Gemini)
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'

    // Guava for ListenableFuture support (often needed with Gemini in Java)
    implementation 'com.google.guava:guava:33.0.0-android'

    // Jetpack Compose
    implementation platform('androidx.compose:compose-bom:2024.04.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.9.0'

    // Compose Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.7'

    // ViewModel + Compose
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    // OkHttp (backend token registration)
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Room
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    kapt "androidx.room:room-compiler:2.6.1"

    // Coil (avatar image loading)
    implementation "io.coil-kt:coil-compose:2.6.0"

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.13'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3'
}

// Apply the Google Services plugin only when a real config file is present,
// so the project still builds for contributors without Firebase credentials.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
