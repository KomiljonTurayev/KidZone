plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.kidzone.app'
    compileSdk 35 // Stable version for production

    // Signing from environment (CI) or local keystore.properties
    def keystoreProps = new Properties()
    def keystoreFile = file('keystore.properties')
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    signingConfigs {
        release {
            def envKeystore = System.getenv("KEYSTORE_FILE")
            if (envKeystore) {
                storeFile     file(envKeystore)
                storePassword System.getenv("STORE_PASSWORD") ?: ""
                keyAlias      System.getenv("KEY_ALIAS")      ?: ""
                keyPassword   System.getenv("KEY_PASSWORD")   ?: ""
            } else if (keystoreProps['storeFile']) {
                storeFile     file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias      keystoreProps['keyAlias']
                keyPassword   keystoreProps['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "uz.kidzone.app"
        minSdk 26
        targetSdk 35
        // CI passes -PversionCode=<run_number>; local default = 9
        versionCode  project.hasProperty('versionCode')  ? project.versionCode.toInteger()  : 9
        versionName  project.hasProperty('versionName')  ? project.versionName               : "1.0.3"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "GEMINI_API_KEY", "\"${project.findProperty('GEMINI_API_KEY') ?: ''}\""
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk { debugSymbolLevel 'FULL' }
        }

        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    // Modern Android App Bundle configuration
    bundle {
        language { enableSplit = true }
        density { enableSplit = true }
        abi { enableSplit = true }
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.15.0' // Use KTX for better extensions even in Java
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // WebView and Browser
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.browser:browser:1.8.0'

    // Google Services
    implementation 'com.google.android.gms:play-services-ads:23.6.0'

    // Firebase (CRM Block 1 — Auth foundation)
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-auth'

    // Material Design 3
    implementation 'com.google.android.material:material:1.12.0'

    // Splash Screen API
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // Google Generative AI (Gemini)
    implementation 'com.google.ai.client.generativeai:generativeai:0.9.0'

    // Guava for ListenableFuture support (often needed with Gemini in Java)
    implementation 'com.google.guava:guava:33.0.0-android'

    // RecyclerView (KidzoCardAdapter uchun)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Test dependencies
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.4.0'
    testImplementation 'org.json:json:20231013'
    testImplementation 'org.robolectric:robolectric:4.13'
}

// Apply the Google Services plugin only when a real config file is present,
// so the project still builds for contributors without Firebase credentials.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
