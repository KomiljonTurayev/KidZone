<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Futbol ⚽</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height:100vh; background:#2ecc71;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:15px; display:flex; justify-content:space-between; color:white; z-index:10; }
.pill { background:rgba(0,0,0,0.2); border-radius:20px; padding:8px 16px; font-weight:bold; }

#field {
  flex:1; width:100%; position:relative; overflow:hidden;
  border:4px solid white; border-bottom:none; margin-top:10px;
  background: repeating-linear-gradient(to bottom, #2ecc71, #2ecc71 50px, #27ae60 50px, #27ae60 100px);
}
#goal {
  width:150px; height:60px; border:4px solid white; border-top:none;
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,0.1);
}
#ball {
  width:50px; height:50px; position:absolute; bottom:50px; left:50%;
  transform:translateX(-50%); cursor:pointer;
  font-size:40px; display:flex; align-items:center; justify-content:center;
  filter:drop-shadow(0 4px 4px rgba(0,0,0,0.3));
}
#keeper {
  width:80px; height:40px; position:absolute; top:70px; left:50%;
  transform:translateX(-50%); font-size:30px; display:flex; align-items:center; justify-content:center;
  transition:left 0.2s linear;
}

#feedback {
  position:fixed; top:40%; font-size:50px; font-weight:bold; color:white;
  text-shadow:0 4px 10px rgba(0,0,0,0.3); opacity:0; pointer-events:none;
}
.pop { animation:popAnim 0.6s ease-out forwards; }
@keyframes popAnim { 0%{transform:scale(0.5);opacity:0} 50%{transform:scale(1.2);opacity:1} 100%{transform:scale(1);opacity:0} }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">⚽ GOLLAR: <span id="goals">0</span></div>
  <div class="pill">REKORD: <span id="best">0</span></div>
</div>

<div id="field">
  <div id="goal"></div>
  <div id="keeper">🧤</div>
  <div id="ball" onclick="kick()">⚽</div>
</div>

<div id="feedback">GOOOL! 🎉</div>

<script>
let goals = 0;
let best = parseInt(localStorage.getItem('soccerBest') || '0');
let ballMoving = false;
let keeperSpeed = 2;
let keeperDir = 1;
let keeperX = 50;

document.getElementById('best').textContent = best;

function moveKeeper() {
  keeperX += keeperSpeed * keeperDir;
  if (keeperX > 80 || keeperX < 20) keeperDir *= -1;
  document.getElementById('keeper').style.left = keeperX + '%';
  requestAnimationFrame(moveKeeper);
}
moveKeeper();

function kick() {
  if (ballMoving) return;
  ballMoving = true;
  const ball = document.getElementById('ball');
  ball.style.transition = 'all 0.6s cubic-bezier(0.17, 0.67, 0.83, 0.67)';
  ball.style.bottom = 'calc(100% - 100px)';

  setTimeout(() => {
    const ballRect = ball.getBoundingClientRect();
    const keeperRect = document.getElementById('keeper').getBoundingClientRect();
    const goalRect = document.getElementById('goal').getBoundingClientRect();

    if (ballRect.left < keeperRect.right && ballRect.right > keeperRect.left && ballRect.top < keeperRect.bottom && ballRect.bottom > keeperRect.top) {
      // SAVE
      showFeedback('QAYTARILDI! 🧤', '#e67e22');
      resetBall();
    } else if (ballRect.left > goalRect.left && ballRect.right < goalRect.right) {
      // GOAL
      goals++;
      document.getElementById('goals').textContent = goals;
      showFeedback('GOOOL! ⚽', '#f1c40f');
      if (goals > best) {
        best = goals;
        localStorage.setItem('soccerBest', best);
        document.getElementById('best').textContent = best;
      }
      keeperSpeed += 0.2;
      resetBall();
    } else {
      // MISS
      showFeedback('YONGA! 💨', '#95a5a6');
      resetBall();
    }
  }, 600);
}

function resetBall() {
  setTimeout(() => {
    const ball = document.getElementById('ball');
    ball.style.transition = 'none';
    ball.style.bottom = '50px';
    ballMoving = false;
  }, 500);
}

function showFeedback(text, color) {
  const fb = document.getElementById('feedback');
  fb.textContent = text;
  fb.style.color = color;
  fb.className = 'pop';
  setTimeout(() => fb.className = '', 600);
}

window.addEventListener('beforeunload', () => {
  const currentPts = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentPts + Math.floor(goals * 2));
  localStorage.setItem('kz-prog-soccer', '100');
});
</script>
</body>
</html>
