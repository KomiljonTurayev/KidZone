<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Tana A'zolari 👁️</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background:#FCE4EC;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:20px; display:flex; justify-content:space-between; align-items:center; }
.pill { background:white; border-radius:20px; padding:8px 16px; font-weight:900; color:#E91E63; box-shadow:0 4px 10px rgba(0,0,0,0.05); }

#game-card {
  background:white; border-radius:32px; padding:30px 20px; width:90%; max-width:400px;
  text-align:center; margin-top:20px; box-shadow:0 15px 35px rgba(0,0,0,0.1);
}
#target-text { font-size:28px; font-weight:900; color:#333; margin-bottom:20px; }

#body-viz {
  position:relative; width:100%; height:300px; margin-bottom:20px;
  display:flex; justify-content:center; align-items:center;
  font-size:150px;
}

#choices { display:grid; grid-template-columns:1fr 1fr; gap:15px; width:90%; max-width:400px; }
.ans-btn {
  background:white; border:none; border-radius:22px; padding:20px;
  font-size:20px; font-weight:900; color:#333; cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,0.08); transition:transform 0.1s;
}
.ans-btn:active { transform:scale(0.92); }
.correct { background:#10B981 !important; color:white; }
.wrong { background:#EF4444 !important; color:white; }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">👁️ TANA A'ZOLARI</div>
  <div class="pill">BALL: <span id="score">0</span></div>
</div>

<div id="game-card">
  <div id="target-text">Ko'z qayerda?</div>
  <div id="body-viz">👦</div>
</div>

<div id="choices"></div>

<script>
const DATA = [
  {n:"Ko'z", e:"👁️"}, {n:"Quloq", e:"👂"}, {n:"Burun", e:"👃"},
  {e:"👄", n:"Og'iz"}, {e:"✋", n:"Qo'l"}, {e:"🦶", n:"Oyoq"},
  {e:"🦷", n:"Tish"}, {e:"👅", n:"Til"}, {e:"💇", n:"Soch"},
  {e:"💪", n:"Mushak"}
];

let score = 0;

function next() {
  const q = DATA[Math.floor(Math.random() * DATA.length)];
  document.getElementById('target-text').textContent = `${q.n} qayerda?`;

  const options = [q];
  while(options.length < 4) {
    const r = DATA[Math.floor(Math.random() * DATA.length)];
    if(!options.find(o => o.n === r.n)) options.push(r);
  }

  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = opt.e + " " + opt.n;
    btn.onclick = () => {
      if(opt.n === q.n) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        setTimeout(next, 800);
      } else {
        btn.classList.add('wrong');
      }
    };
    grid.appendChild(btn);
  });
}

next();

window.addEventListener('beforeunload', () => {
  const currentPts = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentPts + Math.floor(score/2));
  localStorage.setItem('kz-prog-body', '100');
});
</script>
</body>
</html>
