<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Labirint 🌀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height:100vh; background:#2c3e50;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:15px; display:flex; justify-content:space-between; color:white; }
.pill { background:rgba(255,255,255,0.1); border-radius:20px; padding:8px 16px; font-weight:bold; }

#maze-container {
  position:relative; background:#ecf0f1; border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3); margin-top:10px;
}
.cell { position:absolute; border:2px solid #bdc3c7; }
.wall { background:#34495e; border:none; }
#player {
  position:absolute; font-size:24px; display:flex; align-items:center; justify-content:center;
  transition:all 0.1s ease; z-index:5;
}
#goal {
  position:absolute; font-size:24px; display:flex; align-items:center; justify-content:center;
  z-index:4;
}

#controls {
  margin-top:20px; display:grid; grid-template-columns:repeat(3, 70px); gap:10px;
}
.btn {
  width:70px; height:70px; background:white; border:none; border-radius:15px;
  font-size:30px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 #ddd; cursor:pointer;
}
.btn:active { transform:translateY(4px); box-shadow:none; }
#btn-up { grid-column:2; }
#btn-left { grid-column:1; }
#btn-down { grid-column:2; }
#btn-right { grid-column:3; }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">🌀 LABIRINT</div>
  <div class="pill">DARAJA: <span id="lvl">1</span></div>
</div>

<div id="maze-container">
  <div id="goal">🧀</div>
  <div id="player">🐭</div>
</div>

<div id="controls">
  <button class="btn" id="btn-up" onclick="move(0,-1)">🔼</button>
  <button class="btn" id="btn-left" onclick="move(-1,0)">◀️</button>
  <button class="btn" id="btn-down" onclick="move(0,1)">🔽</button>
  <button class="btn" id="btn-right" onclick="move(1,0)">▶️</button>
</div>

<script>
const size = 10;
const cellSize = Math.min(window.innerWidth - 40, 400) / size;
let playerPos = {x:0, y:0};
let goalPos = {x:size-1, y:size-1};
let walls = [];
let level = 1;

function init() {
  const container = document.getElementById('maze-container');
  container.style.width = (size * cellSize) + 'px';
  container.style.height = (size * cellSize) + 'px';

  generateMaze();
  draw();
}

function generateMaze() {
  walls = [];
  for(let i=0; i<size*size*0.3; i++) {
    let wx = Math.floor(Math.random()*size);
    let wy = Math.floor(Math.random()*size);
    if((wx===0 && wy===0) || (wx===size-1 && wy===size-1)) continue;
    walls.push({x:wx, y:wy});
  }
}

function draw() {
  const container = document.getElementById('maze-container');
  container.querySelectorAll('.wall').forEach(w => w.remove());

  walls.forEach(w => {
    const wall = document.createElement('div');
    wall.className = 'cell wall';
    wall.style.width = cellSize + 'px';
    wall.style.height = cellSize + 'px';
    wall.style.left = (w.x * cellSize) + 'px';
    wall.style.top = (w.y * cellSize) + 'px';
    container.appendChild(wall);
  });

  const p = document.getElementById('player');
  p.style.width = cellSize + 'px'; p.style.height = cellSize + 'px';
  p.style.left = (playerPos.x * cellSize) + 'px';
  p.style.top = (playerPos.y * cellSize) + 'px';

  const g = document.getElementById('goal');
  g.style.width = cellSize + 'px'; g.style.height = cellSize + 'px';
  g.style.left = (goalPos.x * cellSize) + 'px';
  g.style.top = (goalPos.y * cellSize) + 'px';
}

function move(dx, dy) {
  let nx = playerPos.x + dx;
  let ny = playerPos.y + dy;

  if(nx >= 0 && nx < size && ny >= 0 && ny < size) {
    if(!walls.find(w => w.x === nx && w.y === ny)) {
      playerPos.x = nx;
      playerPos.y = ny;
      draw();
      if(nx === goalPos.x && ny === goalPos.y) {
        level++;
        document.getElementById('lvl').textContent = level;
        alert("Barakalla! Keyingi daraja! 🏆");
        playerPos = {x:0, y:0};
        generateMaze();
        draw();
      }
    }
  }
}

init();

window.addEventListener('beforeunload', () => {
  const currentPts = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentPts + (level * 5));
  localStorage.setItem('kz-prog-maze', '100');
});
</script>
</body>
</html>
