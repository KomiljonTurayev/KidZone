<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>English ABC 🔡</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background: linear-gradient(135deg, #FF6B6B 0%, #FF9F43 100%);
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden; display: flex; flex-direction: column; align-items: center; color: white;
}
#topbar { width:100%; padding:20px; display:flex; justify-content:space-between; align-items:center; }
.pill { background:rgba(255,255,255,0.2); border-radius:20px; padding:8px 16px; font-weight:900; }

#q-card {
  background:white; border-radius:32px; padding:40px 20px; width:90%; max-width:400px;
  text-align:center; margin-top:20px; box-shadow:0 15px 35px rgba(0,0,0,0.15);
}
#q-emoji { font-size:100px; line-height:1; margin-bottom:15px; animation:bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
#q-word { font-size:32px; font-weight:900; color:#333; letter-spacing:2px; }

#answers { display:grid; grid-template-columns:1fr 1fr; gap:15px; width:90%; max-width:400px; margin-top:30px; }
.ans-btn {
  background:white; border:none; border-radius:22px; padding:20px;
  font-size:36px; font-weight:900; color:#333; cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,0.1); transition:transform 0.1s;
}
.ans-btn:active { transform:scale(0.92); }
.correct { background:#10B981 !important; color:white; }
.wrong { background:#EF4444 !important; color:white; }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">🔡 ABC GAME</div>
  <div class="pill">SCORE: <span id="score">0</span></div>
</div>

<div id="q-card">
  <div id="q-emoji">🍎</div>
  <div id="q-word">A is for...?</div>
</div>

<div id="answers"></div>

<script>
const DATA = [
  {e:"🍎", w:"APPLE", l:"A"}, {e:"🐻", w:"BEAR", l:"B"}, {e:"🐱", w:"CAT", l:"C"},
  {e:"🐶", w:"DOG", l:"D"}, {e:"🐘", w:"ELEPHANT", l:"E"}, {e:"🐟", w:"FISH", l:"F"},
  {e:"🦒", w:"GIRAFFE", l:"G"}, {e:"🏠", w:"HOUSE", l:"H"}, {e:"🍦", w:"ICE CREAM", l:"I"},
  {e:"🃏", w:"JOKER", l:"J"}, {e:"🪁", w:"KITE", l:"K"}, {e:"🦁", w:"LION", l:"L"},
  {e:"🐵", w:"MONKEY", l:"M"}, {e:"🌙", w:"MOON", l:"N"}, {e:"🍊", w:"ORANGE", l:"O"},
  {e:"🐼", w:"PANDA", l:"P"}, {e:"👑", w:"QUEEN", l:"Q"}, {e:"🌈", w:"RAINBOW", l:"R"},
  {e:"☀️", w:"SUN", l:"S"}, {e:"🐢", w:"TURTLE", l:"T"}, {e:"☂️", w:"UMBRELLA", l:"U"},
  {e:"🎻", w:"VIOLIN", l:"V"}, {e:"⌚", w:"WATCH", l:"W"}, {e:"❌", w:"XYLOPHONE", l:"X"},
  {e:"⛵", w:"YACHT", l:"Y"}, {e:"🦓", w:"ZEBRA", l:"Z"}
];

let score = 0;

function nextQ() {
  const q = DATA[Math.floor(Math.random() * DATA.length)];
  document.getElementById('q-emoji').textContent = q.e;
  document.getElementById('q-word').textContent = `${q.l} is for...`;

  const options = [q.l];
  while(options.length < 4) {
    const randomL = String.fromCharCode(65 + Math.floor(Math.random() * 26));
    if(!options.includes(randomL)) options.push(randomL);
  }

  const grid = document.getElementById('answers');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      if(opt === q.l) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        setTimeout(nextQ, 800);
      } else {
        btn.classList.add('wrong');
      }
    };
    grid.appendChild(btn);
  });
}

window.onload = nextQ;

window.addEventListener('beforeunload', () => {
  const currentPts = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentPts + Math.floor(score/2));
  localStorage.setItem('kz-prog-abc-en', '100');
});
</script>
</body>
</html>
