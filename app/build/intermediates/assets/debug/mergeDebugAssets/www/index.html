<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no,viewport-fit=cover">
  <title>KidZone Super App 40+ 🌈</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #FF6B6B; --secondary: #4ECDC4; --accent: #FFE66D;
      --bg: #F7F9FC; --text: #2D3436; --card-bg: #FFFFFF;
      --m-gradient: linear-gradient(135deg, #FF6B6B 0%, #FF8E8E 100%);
      --shadow: 0 10px 25px rgba(255,107,107,0.15);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; min-height: 100vh; }

    /* HEADER */
    #hdr {
      background: var(--card-bg); height: 75px; display: flex; align-items: center; padding: 0 20px;
      position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border-radius: 0 0 25px 25px;
    }
    #user-profile { display: flex; align-items: center; gap: 10px; }
    #avatar { width: 45px; height: 45px; background: var(--accent); border-radius: 15px; display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid white; box-shadow: var(--shadow); }
    #stats-pill { background: #F0F2F5; padding: 6px 15px; border-radius: 20px; display: flex; align-items: center; gap: 8px; font-weight: 900; color: #FF9F43; }

    .hdr-actions { flex: 1; display: flex; justify-content: flex-end; gap: 10px; }
    .action-btn { width: 42px; height: 42px; border-radius: 12px; border: none; background: #F0F2F5; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
    .action-btn.active { background: #1a1a2e; color: white; }

    /* CATEGORIES SCROLL */
    #cat-row { display: flex; gap: 12px; padding: 20px; overflow-x: auto; scrollbar-width: none; }
    #cat-row::-webkit-scrollbar { display: none; }
    .cat-btn { background: white; padding: 12px 22px; border-radius: 22px; white-space: nowrap; font-weight: 800; box-shadow: 0 5px 10px rgba(0,0,0,0.02); border: 2px solid transparent; }
    .cat-btn.active { border-color: var(--primary); color: var(--primary); background: #FFF5F5; }

    /* GAME GRID */
    .sec-title { padding: 0 20px 15px; font-family: 'Fredoka One'; font-size: 20px; }
    #game-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 0 20px 100px; }
    .game-card { background: white; border-radius: 26px; padding: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.04); border: 1px solid #F0F2F5; transition: 0.3s; position: relative; }
    .game-card:active { transform: scale(0.96); }
    .gc-img { aspect-ratio: 1; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 55px; margin-bottom: 10px; }
    .gc-name { font-family: 'Fredoka One'; font-size: 14px; text-align: center; color: var(--text); line-height: 1.2; }
    .gc-tag { font-size: 9px; font-weight: 800; color: #A0AEC0; text-align: center; display: block; margin-top: 4px; }
    .gc-lock { position: absolute; inset: 0; background: rgba(255,255,255,0.7); display: none; align-items: center; justify-content: center; font-size: 30px; border-radius: 26px; }

    /* SYSTEM UI */
    #gv { position: fixed; inset: 0; background: white; z-index: 1000; display: none; flex-direction: column; }
    #gv.active { display: flex; }
    #gv-header { height: 65px; display: flex; align-items: center; padding: 0 15px; border-bottom: 1px solid #F0F2F5; }
    #gv-back { background: #F0F2F5; border: none; width: 45px; height: 45px; border-radius: 15px; font-size: 22px; cursor: pointer; }
    #gv-title { flex: 1; text-align: center; font-family: 'Fredoka One'; font-size: 18px; }

    #reward-pop { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
    #reward-pop.active { display: flex; }
    .pop-card { background: white; border-radius: 35px; padding: 40px; text-align: center; width: 85%; animation: popIn 0.5s; }
    @keyframes popIn { from { transform: scale(0.5); opacity: 0; } }
  </style>
</head>
<body>

  <div id="reward-pop">
    <div class="pop-card">
      <h1 style="font-size: 60px;">🏆</h1>
      <h2 style="font-family: 'Fredoka One'; margin-top: 15px;">Barakalla!</h2>
      <p id="reward-text" style="font-weight: 800; color: #718096; margin-top: 10px;">+50 Yulduz</p>
      <button onclick="closeReward()" style="margin-top: 25px; width: 100%; padding: 15px; border-radius: 20px; border: none; background: var(--m-gradient); color: white; font-weight: 900;">DAVOM ETISH ✨</button>
    </div>
  </div>

  <div id="gv">
    <div id="gv-header">
      <button id="gv-back" onclick="closeGame()">🔙</button>
      <div id="gv-title">O'yin</div>
      <div style="width: 45px;"></div>
    </div>
    <iframe id="gv-frame" style="flex: 1; border: none;"></iframe>
  </div>

  <div id="hdr">
    <div id="user-profile">
      <div id="avatar">🦁</div>
      <div id="stats-pill">⭐ <span id="star-count">0</span></div>
    </div>
    <div class="hdr-actions">
      <button class="action-btn" onclick="toggleSleep()" id="sleep-btn">🌙</button>
      <button class="action-btn" onclick="toggleMusic()">🔊</button>
    </div>
  </div>

  <div id="cat-row">
    <div class="cat-btn active" onclick="filterCat('all', this)">Barchasi</div>
    <div class="cat-btn" onclick="filterCat('logic', this)">Mantiq 🧩</div>
    <div class="cat-btn" onclick="filterCat('math', this)">Hisob 🔢</div>
    <div class="cat-btn" onclick="filterCat('learn', this)">Bilim 📚</div>
    <div class="cat-btn" onclick="filterCat('creative', this)">Ijod 🎨</div>
    <div class="cat-btn" onclick="filterCat('nature', this)">Tabiat 🌿</div>
  </div>

  <div class="sec-title">40+ Yangi O'yinlar 🔥</div>
  <div id="game-grid"></div>

  <script>
    const GAMES = [
      // 🧩 LOGIC (10 Games)
      { id:"p1", name:"Hayvonlar Puzzle", em:"🐶", cat:"logic", tag:"PUZZLE", bg:"#FFE8E8", file:"puzzle-slider.html" },
      { id:"p2", name:"Shakllar Puzzle", em:"⭐", cat:"logic", tag:"PUZZLE", bg:"#FFF9C4", file:"puzzle-slider.html?mode=shapes" },
      { id:"p3", name:"Mevalar Puzzle", em:"🍎", cat:"logic", tag:"PUZZLE", bg:"#F1F8E9", file:"puzzle-slider.html?mode=fruits" },
      { id:"p4", name:"Xotira: Hayvonlar", em:"🧠", cat:"logic", tag:"MEMO", bg:"#E3F2FD", file:"game-engine.html?type=memo&data=animals" },
      { id:"p5", name:"Xotira: Mevalar", em:"🍉", cat:"logic", tag:"MEMO", bg:"#FCE4EC", file:"game-engine.html?type=memo&data=fruits" },
      { id:"p6", name:"Soya Top", em:"👤", cat:"logic", tag:"MATCH", bg:"#EFEBE9", file:"game-engine.html?type=shadow" },
      { id:"p7", name:"Farqini Top", em:"🔍", cat:"logic", tag:"FIND", bg:"#E0F2F1", file:"game-engine.html?type=diff" },
      { id:"p8", name:"Mantiqiy Zanjir", em:"🔗", cat:"logic", tag:"LOGIC", bg:"#F3E5F5", file:"game-engine.html?type=chain" },
      { id:"p9", name:"Labirint", em:"🌀", cat:"logic", tag:"MAZE", bg:"#E8EAF6", file:"game-engine.html?type=maze" },
      { id:"p10", name:"Ranglarni Juftla", em:"🎨", cat:"logic", tag:"MATCH", bg:"#FFFDE7", file:"game-engine.html?type=color-match" },

      // 🔢 MATH (8 Games)
      { id:"m1", name:"Dino Sanoq", em:"🦖", cat:"math", tag:"COUNT", bg:"#E8F5E9", file:"game-engine.html?type=count&data=dino" },
      { id:"m2", name:"Meva Hisob", em:"🍓", cat:"math", tag:"MATH", bg:"#FFEBEE", file:"game-engine.html?type=math&op=plus" },
      { id:"m3", name:"Ayirish O'yini", em:"➖", cat:"math", tag:"MATH", bg:"#E1F5FE", file:"game-engine.html?type=math&op=minus" },
      { id:"m4", name:"Katta-Kichik", em:"⚖️", cat:"math", tag:"LOGIC", bg:"#F9FBE7", file:"game-engine.html?type=compare" },
      { id:"m5", name:"Geometriya", em:"🔷", cat:"math", tag:"SHAPES", bg:"#E0F7FA", file:"game-engine.html?type=shapes" },
      { id:"m6", name:"Raqamlar Ketma-ket", em:"1️⃣", cat:"math", tag:"ORDER", bg:"#FFF3E0", file:"game-engine.html?type=order" },
      { id:"m7", name:"Vaqtni O'rgan", em:"⏰", cat:"math", tag:"TIME", bg:"#F3E5F5", file:"game-engine.html?type=clock" },
      { id:"m8", name:"Tanga Sanoq", em:"💰", cat:"math", tag:"MONEY", bg:"#FFF9C4", file:"game-engine.html?type=money" },

      // 📚 LEARN (8 Games)
      { id:"l1", name:"Dino Sort", em:"🦕", cat:"learn", tag:"SORT", bg:"#E0F2F1", file:"dino-match.html" },
      { id:"l2", name:"Alifbo: UZ", em:"🔤", cat:"learn", tag:"ABC", bg:"#E8EAF6", file:"game-engine.html?type=abc&lang=uz" },
      { id:"l3", name:"Alifbo: RU", em:"А", cat:"learn", tag:"ABC", bg:"#FFEBEE", file:"game-engine.html?type=abc&lang=ru" },
      { id:"l4", name:"English ABC", em:"🔡", cat:"learn", tag:"ABC", bg:"#E3F2FD", file:"game-engine.html?type=abc&lang=en" },
      { id:"l5", name:"Ranglar Dunyosi", em:"🌈", cat:"learn", tag:"COLORS", bg:"#FCE4EC", file:"game-engine.html?type=colors" },
      { id:"l6", name:"Tana A'zolari", em:"👁️", cat:"learn", tag:"BODY", bg:"#EFEBE9", file:"game-engine.html?type=body" },
      { id:"l7", name:"Kasblar", em:"👨‍⚕️", cat:"learn", tag:"JOBS", bg:"#F1F8E9", file:"game-engine.html?type=jobs" },
      { id:"l8", name:"Transport", em:"🚀", cat:"learn", tag:"TRANSPORT", bg:"#E1F5FE", file:"game-engine.html?type=transport" },

      // 🎨 CREATIVE (8 Games)
      { id:"c1", name:"Sehrli Mo'yqalam", em:"🖌️", cat:"creative", tag:"PAINT", bg:"#FCE4EC", file:"paint.html" },
      { id:"c2", name:"Musiqa Lab", em:"🎹", cat:"creative", tag:"MUSIC", bg:"#FFF3E0", file:"piano.html" },
      { id:"c3", name:"Drums & Ritm", em:"🥁", cat:"creative", tag:"MUSIC", bg:"#E8EAF6", file:"game-engine.html?type=drums" },
      { id:"c4", name:"Sing & Play", em:"🎤", cat:"creative", tag:"SING", bg:"#F3E5F5", file:"game-engine.html?type=sing" },
      { id:"c5", name:"Bo'yash: Hayvonlar", em:"🖍️", cat:"creative", tag:"COLOR", bg:"#E8F5E9", file:"paint.html?mode=animals" },
      { id:"c6", name:"Bo'yash: Mashinalar", em:"🏎️", cat:"creative", tag:"COLOR", bg:"#E1F5FE", file:"paint.html?mode=cars" },
      { id:"c7", name:"Stikerlar", em:"🦄", cat:"creative", tag:"STICKER", bg:"#FCE4EC", file:"game-engine.html?type=stickers" },
      { id:"c8", name:"Ertaklar", em:"📖", cat:"creative", tag:"STORY", bg:"#FFF9C4", file:"game-engine.html?type=stories" },

      // 🌿 NATURE (6 Games)
      { id:"n1", name:"Bog'bon", em:"🌱", cat:"nature", tag:"GARDEN", bg:"#E8F5E9", file:"game-engine.html?type=garden" },
      { id:"n2", name:"Dengiz Olami", em:"🐬", cat:"nature", tag:"SEA", bg:"#E1F5FE", file:"game-engine.html?type=sea" },
      { id:"n3", name:"Kosmos", em:"👩‍🚀", cat:"nature", tag:"SPACE", bg:"#1A1A2E", file:"game-engine.html?type=space" },
      { id:"n4", name:"Ob-Havo", em:"🌤️", cat:"nature", tag:"WEATHER", bg:"#E3F2FD", file:"game-engine.html?type=weather" },
      { id:"n5", name:"Fermadagi Kun", em:"🐄", cat:"nature", tag:"FARM", bg:"#F1F8E9", file:"game-engine.html?type=farm" },
      { id:"n6", name:"Hasharotlar", em:"🐞", cat:"nature", tag:"BUGS", bg:"#FFFDE7", file:"game-engine.html?type=bugs" }
    ];

    let stars = parseInt(localStorage.getItem('kz-stars') || '0');

    function init() {
      document.getElementById('star-count').textContent = stars;
      renderGrid('all');
    }

    function renderGrid(cat) {
      const grid = document.getElementById('game-grid');
      grid.innerHTML = '';
      const list = cat === 'all' ? GAMES : GAMES.filter(g => g.cat === cat);
      list.forEach(g => {
        const div = document.createElement('div');
        div.className = 'game-card';
        div.onclick = () => openGame(g);
        div.innerHTML = `<div class="gc-img" style="background:${g.bg}">${g.em}</div><div class="gc-name">${g.name}</div><span class="gc-tag">${g.tag}</span>`;
        grid.appendChild(div);
      });
    }

    function filterCat(cat, el) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      renderGrid(cat);
    }

    function openGame(g) {
      document.getElementById('gv-title').textContent = g.name;
      document.getElementById('gv-frame').src = g.file;
      document.getElementById('gv').classList.add('active');
      if (window.AndroidAdMob) window.AndroidAdMob.showInterstitial();
    }

    function closeGame() {
      document.getElementById('gv').classList.remove('active');
      document.getElementById('gv-frame').src = '';
    }

    window.onRewardGranted = function(amount) {
      const reward = amount || 50;
      stars += reward;
      localStorage.setItem('kz-stars', stars);
      document.getElementById('star-count').textContent = stars;
      document.getElementById('reward-text').textContent = "+" + reward + " Yulduz";
      document.getElementById('reward-pop').classList.add('active');
    };

    function closeReward() { document.getElementById('reward-pop').classList.remove('active'); }
    function toggleSleep() { alert("Sleep Mode: Tinchlantiruvchi musiqa yoqildi 🌙"); }
    function toggleMusic() { alert("Musiqa sozlamasi o'zgartirildi 🔊"); }

    window.onload = init;
  </script>
</body>
</html>
