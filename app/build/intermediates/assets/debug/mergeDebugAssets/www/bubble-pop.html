<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }

  /* TOP BAR */
  #topbar {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 8px;
  }

  #score-box {
    background: rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 8px 20px;
    text-align: center;
  }
  #score-label { color: #aaa; font-size: 11px; letter-spacing: 1px; }
  #score { color: #fff; font-size: 28px; font-weight: bold; }

  #best-box {
    background: rgba(255,215,0,0.15);
    border-radius: 16px;
    padding: 8px 20px;
    text-align: center;
  }
  #best-label { color: #ffd700aa; font-size: 11px; letter-spacing: 1px; }
  #best { color: #ffd700; font-size: 22px; font-weight: bold; }

  #level-box {
    background: rgba(100,255,180,0.12);
    border-radius: 16px;
    padding: 8px 16px;
    text-align: center;
  }
  #level-label { color: #aaa; font-size: 11px; }
  #level { color: #64ffb4; font-size: 22px; font-weight: bold; }

  /* GAME CANVAS */
  #game-area {
    position: relative;
    width: 100%;
    max-width: 420px;
    flex: 1;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* TIMER BAR */
  #timer-wrap {
    width: 90%;
    max-width: 380px;
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    margin: 8px auto;
    overflow: hidden;
  }
  #timer-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #64ffb4, #00cfff);
    border-radius: 10px;
    transition: width 0.1s linear, background 0.3s;
  }

  /* ADMOB BANNER PLACEHOLDER */
  #admob-banner {
    width: 100%;
    max-width: 420px;
    height: 60px;
    background: rgba(255,255,255,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid rgba(255,255,255,0.08);
  }
  #admob-banner span { color: rgba(255,255,255,0.2); font-size: 12px; }

  /* SCREENS */
  .screen {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 8, 30, 0.92);
    z-index: 100;
    gap: 16px;
    padding: 30px;
  }

  .screen h1 { color: #fff; font-size: 36px; text-align: center; }
  .screen h2 { color: #64ffb4; font-size: 22px; text-align: center; }
  .screen p  { color: #aaa; font-size: 14px; text-align: center; line-height: 1.6; }

  .big-emoji { font-size: 72px; }

  .btn {
    padding: 16px 40px;
    border-radius: 50px;
    border: none;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.1s;
    letter-spacing: 1px;
  }
  .btn:active { transform: scale(0.95); }
  .btn-primary {
    background: linear-gradient(135deg, #64ffb4, #00cfff);
    color: #0f0c29;
  }
  .btn-secondary {
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }

  .score-result {
    background: rgba(255,255,255,0.07);
    border-radius: 20px;
    padding: 16px 40px;
    text-align: center;
  }
  .score-result .num { color: #fff; font-size: 52px; font-weight: bold; }
  .score-result .lbl { color: #aaa; font-size: 13px; }

  .hidden { display: none !important; }

  /* COMBO */
  #combo-display {
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 50;
    text-align: center;
  }
  .combo-text {
    font-size: 42px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0 0 20px #ffd700;
    animation: comboAnim 0.6s ease-out forwards;
  }
  @keyframes comboAnim {
    0%   { transform: scale(0.5); opacity: 1; }
    60%  { transform: scale(1.2); opacity: 1; }
    100% { transform: scale(1); opacity: 0; translateY(-30px); }
  }

  /* PARTICLES */
  .particle {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    animation: particleFly 0.5s ease-out forwards;
  }
  @keyframes particleFly {
    0%   { transform: translate(0,0) scale(1); opacity: 1; }
    100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
  }
</style>
<script src="admob.js"></script>

</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="score-box">
    <div id="score-label">BALL</div>
    <div id="score">0</div>
  </div>
  <div id="level-box">
    <div id="level-label">DARAJA</div>
    <div id="level">1</div>
  </div>
  <div id="best-box">
    <div id="best-label">REKORD</div>
    <div id="best">0</div>
  </div>
</div>

<!-- TIMER -->
<div id="timer-wrap"><div id="timer-bar"></div></div>

<!-- GAME AREA -->
<div id="game-area">
  <canvas id="canvas"></canvas>
  <div id="combo-display"></div>

  <!-- START SCREEN -->
  <div class="screen" id="start-screen">
    <div class="big-emoji">🫧</div>
    <h1>Bubble Pop!</h1>
    <p>Pufaklarni tez bosing!<br>Vaqt tugashidan oldin ko'proq ball yig'ing 🎯</p>
    <button class="btn btn-primary" onclick="startGame()">🚀 BOSHLASH</button>
  </div>

  <!-- GAME OVER SCREEN -->
  <div class="screen hidden" id="gameover-screen">
    <div class="big-emoji" id="result-emoji">⭐</div>
    <h1 id="result-title">Zo'r!</h1>
    <div class="score-result">
      <div class="lbl">BALL</div>
      <div class="num" id="final-score">0</div>
    </div>
    <div class="score-result" id="new-best-box" style="background:rgba(255,215,0,0.1); display:none">
      <div class="lbl" style="color:#ffd700">🏆 YANGI REKORD!</div>
    </div>
    <button class="btn btn-primary" onclick="startGame()">🔄 QAYTA</button>
    <button class="btn btn-secondary" onclick="showStart()">🏠 BOSH SAHIFA</button>
  </div>
</div>

<!-- ADMOB BANNER (TAYYOR - faqat ID ni almashtiring) -->
<div id="admob-banner">
  <!-- 
    ✅ ADMOB BANNER SHU YERDA CHIQADI
    Android da: ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX
  -->
  <span>📢 REKLAMA JOYI (AdMob Banner)</span>
</div>

<script>
// =============================================
// ADMOB INTEGRATION — Android Capacitor uchun
// =============================================
/*
  1. npm install @capacitor-community/admob
  2. capacitor.config.ts ga qo'shing:
     AdMob: { appId: "ca-app-pub-XXXXXXXXXXXXXXXX~XXXXXXXXXX" }
  
  3. Quyidagi kod Android da ishlaydi:
  
  import { AdMob, BannerAdOptions, BannerAdSize, BannerAdPosition } from '@capacitor-community/admob';
  
  async function showBanner() {
    await AdMob.initialize();
    const options: BannerAdOptions = {
      adId: 'ca-app-pub-XXXXXXXXXXXXXXXX/XXXXXXXXXX', // SHU YERNI O'ZGARTIRING
      adSize: BannerAdSize.BANNER,
      position: BannerAdPosition.BOTTOM_CENTER,
      isTesting: true // Test uchun true, chiqarish vaqti false
    };
    await AdMob.showBanner(options);
  }
  
  async function showInterstitial() {
    await AdMob.prepareInterstitial({ adId: 'ca-app-pub-XXXXXXXX/XXXXXXXX', isTesting: true });
    await AdMob.showInterstitial();
  }
*/

// =============================================
// O'YIN KODI
// =============================================

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const gameArea = document.getElementById('game-area');

let bubbles = [];
let score = 0;
let bestScore = parseInt(localStorage.getItem('bubbleBest') || '0');
let timeLeft = 30;
let gameRunning = false;
let animFrame;
let timerInterval;
let combo = 0;
let lastPopTime = 0;
let level = 1;
let spawnRate = 1200;
let spawnTimer;

document.getElementById('best').textContent = bestScore;

const COLORS = [
  { fill: '#ff6b9d', glow: '#ff6b9d' },
  { fill: '#64ffb4', glow: '#64ffb4' },
  { fill: '#00cfff', glow: '#00cfff' },
  { fill: '#ffd700', glow: '#ffd700' },
  { fill: '#ff9500', glow: '#ff9500' },
  { fill: '#bf5af2', glow: '#bf5af2' },
  { fill: '#ff453a', glow: '#ff453a' },
];

function resize() {
  canvas.width = gameArea.clientWidth;
  canvas.height = gameArea.clientHeight;
}

window.addEventListener('resize', resize);
resize();

class Bubble {
  constructor() {
    this.r = 28 + Math.random() * 28;
    this.x = this.r + Math.random() * (canvas.width - this.r * 2);
    this.y = canvas.height + this.r;
    this.speed = 0.8 + Math.random() * 1.2 + level * 0.1;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alive = true;
    this.popping = false;
    this.popProgress = 0;
    this.points = Math.max(1, Math.round(20 - this.r / 3));
    this.wobble = Math.random() * Math.PI * 2;
    this.wobbleSpeed = 0.04 + Math.random() * 0.02;
    this.shimmer = Math.random();
  }

  update() {
    if (this.popping) {
      this.popProgress += 0.12;
      if (this.popProgress >= 1) this.alive = false;
      return;
    }
    this.y -= this.speed;
    this.wobble += this.wobbleSpeed;
    this.x += Math.sin(this.wobble) * 0.5;
    if (this.y + this.r < 0) this.alive = false;
  }

  draw() {
    ctx.save();

    if (this.popping) {
      const p = this.popProgress;
      ctx.globalAlpha = 1 - p;
      const scale = 1 + p * 0.5;
      ctx.translate(this.x, this.y);
      ctx.scale(scale, scale);
      ctx.translate(-this.x, -this.y);
    }

    // Glow
    ctx.shadowColor = this.color.glow;
    ctx.shadowBlur = 20;

    // Main circle
    const grad = ctx.createRadialGradient(
      this.x - this.r * 0.3, this.y - this.r * 0.3, this.r * 0.1,
      this.x, this.y, this.r
    );
    grad.addColorStop(0, 'rgba(255,255,255,0.8)');
    grad.addColorStop(0.3, this.color.fill + 'cc');
    grad.addColorStop(1, this.color.fill + '44');

    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Rim
    ctx.strokeStyle = this.color.fill + 'aa';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Shine
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.arc(this.x - this.r * 0.28, this.y - this.r * 0.28, this.r * 0.18, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.fill();

    // Points text
    if (!this.popping) {
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = `bold ${Math.round(this.r * 0.55)}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('+' + this.points, this.x, this.y);
    }

    ctx.restore();
  }

  isClicked(tx, ty) {
    const dx = tx - this.x, dy = ty - this.y;
    return Math.sqrt(dx*dx + dy*dy) < this.r;
  }
}

function spawnBubble() {
  if (!gameRunning) return;
  bubbles.push(new Bubble());
  // Max 3 ta bir vaqtda
  if (bubbles.filter(b => b.alive && !b.popping).length > 10 + level * 2) {
    bubbles[0].alive = false;
  }
  spawnTimer = setTimeout(spawnBubble, spawnRate - level * 60);
}

function gameLoop() {
  if (!gameRunning) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background dots
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 20; i++) {
    ctx.beginPath();
    ctx.arc(
      (Math.sin(i * 137.5 + Date.now() * 0.0002) * 0.5 + 0.5) * canvas.width,
      (Math.cos(i * 97.3 + Date.now() * 0.0001) * 0.5 + 0.5) * canvas.height,
      2, 0, Math.PI * 2
    );
    ctx.fill();
  }

  bubbles = bubbles.filter(b => b.alive);
  bubbles.forEach(b => { b.update(); b.draw(); });

  animFrame = requestAnimationFrame(gameLoop);
}

function handleTap(e) {
  if (!gameRunning) return;
  e.preventDefault();

  const rect = canvas.getBoundingClientRect();
  const touches = e.touches || [e];
  
  for (let t of touches) {
    const tx = (t.clientX - rect.left) * (canvas.width / rect.width);
    const ty = (t.clientY - rect.top) * (canvas.height / rect.height);

    let popped = false;
    for (let b of bubbles) {
      if (!b.popping && b.isClicked(tx, ty)) {
        b.popping = true;
        popped = true;

        // Combo
        const now = Date.now();
        if (now - lastPopTime < 800) combo++;
        else combo = 1;
        lastPopTime = now;

        let pts = b.points * (combo >= 3 ? combo : 1);
        score += pts;
        document.getElementById('score').textContent = score;

        // Combo display
        if (combo >= 3) {
          showCombo(combo, tx, ty);
        }

        spawnParticles(b.x, b.y, b.color.fill);
        break;
      }
    }
  }
}

function showCombo(c, x, y) {
  const el = document.getElementById('combo-display');
  el.innerHTML = `<div class="combo-text">x${c} COMBO! 🔥</div>`;
  setTimeout(() => el.innerHTML = '', 700);
}

function spawnParticles(x, y, color) {
  for (let i = 0; i < 8; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const angle = (i / 8) * Math.PI * 2;
    const dist = 40 + Math.random() * 30;
    p.style.cssText = `
      left: ${x}px; top: ${y}px;
      width: ${6 + Math.random() * 6}px;
      height: ${6 + Math.random() * 6}px;
      background: ${color};
      --tx: ${Math.cos(angle) * dist}px;
      --ty: ${Math.sin(angle) * dist}px;
    `;
    gameArea.appendChild(p);
    setTimeout(() => p.remove(), 500);
  }
}

function startGame() {
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('gameover-screen').classList.add('hidden');

  score = 0;
  timeLeft = 30;
  level = 1;
  combo = 0;
  bubbles = [];
  gameRunning = true;

  document.getElementById('score').textContent = '0';
  document.getElementById('level').textContent = '1';
  document.getElementById('timer-bar').style.width = '100%';
  document.getElementById('timer-bar').style.background = 'linear-gradient(90deg, #64ffb4, #00cfff)';

  clearTimeout(spawnTimer);
  cancelAnimationFrame(animFrame);
  clearInterval(timerInterval);

  // Timer
  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    const pct = (timeLeft / 30) * 100;
    document.getElementById('timer-bar').style.width = pct + '%';

    if (pct < 30) {
      document.getElementById('timer-bar').style.background = 'linear-gradient(90deg, #ff453a, #ff9500)';
    }

    // Level up
    level = Math.min(5, 1 + Math.floor((30 - timeLeft) / 8));
    document.getElementById('level').textContent = level;

    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 100);

  spawnBubble();
  gameLoop();
}

function endGame() {
  gameRunning = false;
  clearTimeout(spawnTimer);
  cancelAnimationFrame(animFrame);

  window.AdMobMgr?.showInterstitial(); // ✅ AdMob Interstitial
  // showInterstitialAd(); // Android da bu funksiyani chaqiring

  const isNewBest = score > bestScore;
  if (isNewBest) {
    bestScore = score;
    localStorage.setItem('bubbleBest', bestScore);
    document.getElementById('best').textContent = bestScore;
  }

  document.getElementById('final-score').textContent = score;
  document.getElementById('new-best-box').style.display = isNewBest ? 'block' : 'none';

  // Update total points in the main app
  const currentTotal = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentTotal + Math.round(score / 5));

  // Update progress
  localStorage.setItem('kz-prog-bubble-pop', '100');

  let emoji = '😊', title = 'Yaxshi urinish!';
  if (score >= 500) { emoji = '🏆'; title = 'Ustaxona!'; }
  else if (score >= 300) { emoji = '🔥'; title = 'Ajoyib!'; }
  else if (score >= 150) { emoji = '⭐'; title = 'Zo\'r!'; }

  document.getElementById('result-emoji').textContent = emoji;
  document.getElementById('result-title').textContent = title;

  document.getElementById('gameover-screen').classList.remove('hidden');
}

function showStart() {
  gameRunning = false;
  clearTimeout(spawnTimer);
  cancelAnimationFrame(animFrame);
  clearInterval(timerInterval);
  document.getElementById('gameover-screen').classList.add('hidden');
  document.getElementById('start-screen').classList.remove('hidden');
}

// Event listeners
canvas.addEventListener('touchstart', handleTap, { passive: false });
canvas.addEventListener('mousedown', handleTap);

resize();
</script>
</body>
</html>
