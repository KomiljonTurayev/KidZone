<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Puzzle 🧩</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height:100vh; background:#F1F8E9;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:20px; display:flex; justify-content:space-between; align-items:center; }
.pill { background:white; border-radius:20px; padding:8px 16px; font-weight:900; color:#558B2F; }
#puzzle-board {
  display:grid; grid-template-columns:repeat(3, 100px); grid-template-rows:repeat(3, 100px);
  gap:5px; background:#DCEDC8; padding:5px; border-radius:12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.1); margin-top:20px;
}
.tile {
  width:100px; height:100px; background:#fff; border-radius:8px;
  display:flex; align-items:center; justify-content:center;
  font-size:40px; cursor:pointer; font-weight:bold; color:#558B2F;
}
.tile.empty { background:transparent; box-shadow:none; cursor:default; }

/* Win overlay */
#win-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(4px); }
#win-overlay.h { display:none; }
#win-card { background:linear-gradient(135deg,#558B2F,#8BC34A); border-radius:28px; padding:36px 28px; text-align:center; width:min(280px,85vw); color:white; }
#win-em  { font-size:64px; margin-bottom:10px; }
#win-msg { font-size:22px; font-weight:900; margin-bottom:18px; }
#btn-win-play { background:rgba(255,255,255,0.25); border:2px solid rgba(255,255,255,0.4); border-radius:20px; padding:14px 32px; color:white; font-size:16px; font-weight:900; cursor:pointer; width:100%; }
#btn-win-play:active { transform:scale(0.96); }
</style>
</head>
<body>

<div id="topbar">
  <div class="pill" id="lbl-title">🧩 PUZZLE</div>
  <button class="pill" id="btn-shuffle" onclick="shuffle()">🔄 Aralashtirish</button>
</div>

<div id="puzzle-board"></div>

<!-- Win overlay (replaces alert) -->
<div id="win-overlay" class="h">
  <div id="win-card">
    <div id="win-em">🏆</div>
    <div id="win-msg">Barakalla!</div>
    <button id="btn-win-play" onclick="newGame()">🔄 Qayta</button>
  </div>
</div>

<script src="game-engine.js"></script>
<script>
const game = new KidZoneGame({ id: 'jigsaw' });
const lang = game.lang;

const T = {
  uz: { title:"🧩 PUZZLE", shuffle:"🔄 Aralashtirish", win:"Barakalla! Puzzle yig'ildi!", again:"🔄 Qayta" },
  ru: { title:"🧩 ПАЗЛ",   shuffle:"🔄 Перемешать",    win:"Молодец! Пазл собран!",       again:"🔄 Ещё раз" },
  en: { title:"🧩 PUZZLE", shuffle:"🔄 Shuffle",        win:"Great! Puzzle solved!",        again:"🔄 Play Again" },
};

const t = T[lang] || T.en;

function applyLang() {
  document.getElementById('lbl-title').textContent    = t.title;
  document.getElementById('btn-shuffle').textContent  = t.shuffle;
  document.getElementById('win-msg').textContent      = t.win;
  document.getElementById('btn-win-play').textContent = t.again;
}

let tiles = [1, 2, 3, 4, 5, 6, 7, 8, 0];
const emojis = ["", "🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼"];

function draw() {
  const board = document.getElementById('puzzle-board');
  board.innerHTML = '';
  tiles.forEach((tl, i) => {
    const div = document.createElement('div');
    div.className = 'tile' + (tl === 0 ? ' empty' : '');
    div.textContent = tl === 0 ? '' : emojis[tl];
    div.onclick = () => move(i);
    board.appendChild(div);
  });
}

function move(idx) {
  const emptyIdx = tiles.indexOf(0);
  const row = Math.floor(idx / 3);
  const col = idx % 3;
  const erow = Math.floor(emptyIdx / 3);
  const ecol = emptyIdx % 3;
  if (Math.abs(row - erow) + Math.abs(col - ecol) !== 1) return;
  [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
  draw();
  if (checkWin()) showWin();
}

function checkWin() {
  for (let i = 0; i < 8; i++) if (tiles[i] !== i + 1) return false;
  return true;
}

function showWin() {
  document.getElementById('win-overlay').classList.remove('h');
  game.reportScore(30);
}

function newGame() {
  document.getElementById('win-overlay').classList.add('h');
  shuffle();
}

function shuffle() {
  for (let i = 0; i < 100; i++) {
    const adj = [];
    const emptyIdx = tiles.indexOf(0);
    const row = Math.floor(emptyIdx / 3);
    const col = emptyIdx % 3;
    if (row > 0) adj.push(emptyIdx - 3);
    if (row < 2) adj.push(emptyIdx + 3);
    if (col > 0) adj.push(emptyIdx - 1);
    if (col < 2) adj.push(emptyIdx + 1);
    const rand = adj[Math.floor(Math.random() * adj.length)];
    [tiles[rand], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[rand]];
  }
  draw();
}

applyLang();
shuffle();
</script>
</body>
</html>
