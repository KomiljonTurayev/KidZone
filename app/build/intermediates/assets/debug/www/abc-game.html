<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABC Alphabet 🔤</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background: linear-gradient(135deg, #FF6B35 0%, #FF9F1C 100%);
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden; user-select: none;
  display: flex; flex-direction: column; align-items: center; color: white;
}
#topbar { width:100%; max-width:440px; padding:16px 20px 8px; display:flex; justify-content:space-between; align-items:center; }
.pill { background:rgba(255,255,255,0.2); border:1px solid rgba(255,255,255,0.3); border-radius:20px; padding:8px 16px; font-weight: 800; }
.pill-sm { font-size:10px; color:rgba(255,255,255,0.7); display:block; text-transform: uppercase; }

#prog-wrap { width:90%; max-width:400px; height:8px; background:rgba(255,255,255,0.15); border-radius:4px; margin:10px 0; overflow: hidden; }
#prog-bar { height:100%; background:white; width:0%; transition:width 0.4s; }

#q-card {
  background:white; color: #333; border-radius:32px; padding:30px 20px; width:90%; max-width:400px;
  text-align:center; margin:20px 0; box-shadow:0 15px 35px rgba(0,0,0,0.15);
}
#q-emoji { font-size:100px; line-height:1; margin-bottom:15px; animation:bounce 2s infinite; }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
#q-word { font-size:36px; font-weight:900; color:#FF6B35; letter-spacing:2px; }

#answers { display:grid; grid-template-columns:1fr 1fr; gap:15px; width:90%; max-width:400px; }
.ans-btn {
  background:white; border:none; border-radius:22px; padding:20px;
  font-size:40px; font-weight:900; color:#333; cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,0.1); transition:transform 0.1s;
}
.ans-btn:active { transform:scale(0.92); }
.correct { background:#10B981 !important; color:white !important; }
.wrong { background:#EF4444 !important; color:white !important; }

#result { position:fixed; inset:0; background:rgba(0,0,0,0.8); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(5px); }
.h { display:none !important; }
#result-card { background:white; color:#333; border-radius:32px; padding:40px 30px; text-align:center; width:min(340px,90vw); }
.btn-p { background:#FF6B35; color:white; border:none; border-radius:50px; padding:18px 44px; font-size:18px; font-weight:900; cursor:pointer; width:100%; margin-top:20px; }
</style>
</head>
<body>

<div id="topbar">
  <div class="pill"><span class="pill-sm" id="lbl-score">SCORE</span><span id="score">0</span></div>
  <div style="font-weight:900; font-size:20px;">🔤 <span id="lbl-title">ABC</span></div>
  <div class="pill"><span class="pill-sm" id="lbl-quest">QUEST</span><span id="q-num">1/10</span></div>
</div>

<div id="prog-wrap"><div id="prog-bar"></div></div>

<div id="q-card">
  <div id="q-emoji">🍎</div>
  <div id="q-word">APPLE</div>
</div>

<div id="answers">
  <button class="ans-btn" id="btn0" onclick="check(0)"></button>
  <button class="ans-btn" id="btn1" onclick="check(1)"></button>
  <button class="ans-btn" id="btn2" onclick="check(2)"></button>
  <button class="ans-btn" id="btn3" onclick="check(3)"></button>
</div>

<div id="result" class="h">
  <div id="result-card">
    <div style="font-size:80px;">🎉</div>
    <h1 id="res-ttl">Great!</h1>
    <p id="res-sc" style="font-size:20px; margin:10px 0;"></p>
    <button class="btn-p" id="btn-again" onclick="start()">PLAY AGAIN</button>
  </div>
</div>

<script src="game-engine.js"></script>
<script>
const TRANSLATIONS = {
  en: { title:"ABC", score:"SCORE", quest:"SAVOL", start:"START", great:"Great job!", again:"PLAY AGAIN" },
  uz: { title:"Alifbo", score:"BALL", quest:"SAVOL", start:"BOSHLASH", great:"Barakalla!", again:"QAYTA O'YNASH" },
  ru: { title:"Алфавит", score:"СЧЕТ", quest:"ВОПРОС", start:"ИГРАТЬ", great:"Молодец!", again:"ИГРАТЬ СНОВА" }
};

const DATA = {
  en: [ {e:"🍎", l:"A", w:"APPLE"}, {e:"🐻", l:"B", w:"BEAR"}, {e:"🐱", l:"C", w:"CAT"}, {e:"🐶", l:"D", w:"DOG"}, {e:"🐘", l:"E", w:"ELEPHANT"}, {e:"🐟", l:"F", w:"FISH"}, {e:"🦒", l:"G", w:"GIRAFFE"}, {e:"🏠", l:"H", w:"HOUSE"}, {e:"🍦", l:"I", w:"ICE CREAM"}, {e:"🦓", l:"Z", w:"ZEBRA"} ],
  uz: [ {e:"🍎", l:"O", w:"OLMA"}, {e:"🐻", l:"A", w:"AYIQ"}, {e:"🐱", l:"M", w:"MUSHUK"}, {e:"🐶", l:"I", w:"IT"}, {e:"🐘", l:"F", w:"FIL"}, {e:"🍇", l:"U", w:"UZUM"}, {e:"🍍", l:"A", w:"ANANAS"}, {e:"🍒", l:"G", w:"GOLOS"}, {e:"🍌", l:"B", w:"BANAN"}, {e:"🦁", l:"S", w:"SHER"} ],
  ru: [ {e:"🍎", l:"Я", w:"ЯБЛОКО"}, {e:"🐻", l:"М", w:"МЕДВЕДЬ"}, {e:"🐱", l:"К", w:"КОШКА"}, {e:"🐶", l:"С", w:"СОБАКА"}, {e:"🐘", l:"С", w:"СЛОН"}, {e:"🍓", l:"К", w:"КЛУБНИКА"}, {e:"🐧", l:"П", w:"ПИНГВИН"}, {e:"🐺", l:"В", w:"ВОЛК"}, {e:"🦁", l:"Л", w:"ЛЕВ"}, {e:"🎈", l:"Ш", w:"ШАРИК"} ]
};

const engine = new KidZoneGame({ id: 'abc' });
const t = engine.getTranslations(TRANSLATIONS);
const pool = DATA[engine.lang] || DATA.en;
let score = 0, qIdx = 0, current = null;

function updateUI() {
  document.getElementById('lbl-title').textContent = t.title;
  document.getElementById('lbl-score').textContent = t.score;
  document.getElementById('lbl-quest').textContent = t.quest;
  document.getElementById('res-ttl').textContent = t.great;
  document.getElementById('btn-again').textContent = t.again;
}

function start() {
  score = 0; qIdx = 0;
  document.getElementById('score').textContent = "0";
  document.getElementById('result').classList.add('h');
  next();
}

function next() {
  if (qIdx >= 10) {
    document.getElementById('res-sc').textContent = `${t.score}: ${score}`;
    document.getElementById('result').classList.remove('h');
    engine.gameOver(Math.round(score/2));
    return;
  }
  current = pool[qIdx];
  document.getElementById('q-emoji').textContent = current.e;
  document.getElementById('q-word').textContent = current.w;
  document.getElementById('q-num').textContent = `${qIdx+1}/10`;
  document.getElementById('prog-bar').style.width = `${(qIdx/10)*100}%`;

  const options = [current.l];
  const chars = engine.lang === 'ru' ? "АБВГДЕЁЖЗИЙКLMNOPQRSTUVWXYZ" : "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
  while (options.length < 4) {
    const r = chars[Math.floor(Math.random() * chars.length)];
    if (!options.includes(r)) options.push(r);
  }
  options.sort(() => Math.random() - 0.5).forEach((v, i) => {
    const btn = document.getElementById('btn' + i);
    btn.textContent = v; btn.className = 'ans-btn';
  });
}

function check(i) {
  const btn = document.getElementById('btn' + i);
  if (btn.textContent === current.l) {
    btn.classList.add('correct'); score += 10;
    document.getElementById('score').textContent = score;
    engine.playSound('win');
    qIdx++; setTimeout(next, 800);
  } else {
    btn.classList.add('wrong');
    engine.playSound('lose');
    engine.vibrate(50);
  }
}

window.onload = () => { updateUI(); start(); };
</script>
</body>
</html>
