<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hayvonlar Orkestri 🎤</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background:#7B1FA2;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center; color:white;
}
#topbar { width:100%; padding:20px; text-align:center; }
.pill { display:inline-block; background:rgba(255,255,255,0.2); border-radius:20px; padding:8px 20px; font-weight:900; }

#stage {
  display:grid; grid-template-columns:repeat(3, 1fr); gap:20px; padding:20px;
  width:100%; max-width:400px; flex:1; align-content:center;
}
.animal {
  width:100px; height:100px; background:white; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:50px;
  cursor:pointer; box-shadow:0 10px 20px rgba(0,0,0,0.3);
  transition:transform 0.1s;
}
.animal:active { transform:scale(1.2) rotate(10deg); }

#instruction { margin-top:20px; font-size:18px; font-weight:bold; }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">🎤 HAYVONLAR ORKESTRI</div>
</div>

<div id="stage">
  <div class="animal" data-freq="300" onclick="sing(this)">🐶</div>
  <div class="animal" data-freq="400" onclick="sing(this)">🐱</div>
  <div class="animal" data-freq="500" onclick="sing(this)">🐮</div>
  <div class="animal" data-freq="600" onclick="sing(this)">🐷</div>
  <div class="animal" data-freq="700" onclick="sing(this)">🐸</div>
  <div class="animal" data-freq="800" onclick="sing(this)">🐔</div>
  <div class="animal" data-freq="200" onclick="sing(this)">🐘</div>
  <div class="animal" data-freq="900" onclick="sing(this)">🐧</div>
  <div class="animal" data-freq="450" onclick="sing(this)">🦁</div>
</div>

<div id="instruction">Hayvonlarni bosing va ular kuylashadi! 🎶</div>

<script>
let audioCtx = null;

function sing(el) {
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.type = 'sine';
  osc.frequency.setValueAtTime(parseFloat(el.dataset.freq), audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(parseFloat(el.dataset.freq) * 1.5, audioCtx.currentTime + 0.3);

  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  osc.start();
  osc.stop(audioCtx.currentTime + 0.4);

  // Animation
  el.style.backgroundColor = '#E1BEE7';
  setTimeout(() => el.style.backgroundColor = 'white', 200);
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  if (id === 'drums') {
    document.querySelector('.pill').textContent = '🥁 DOIRA CHALISH';
    document.querySelectorAll('.animal').forEach(el => {
      el.textContent = '🥁';
      el.style.backgroundColor = '#FFEB3B';
    });
    document.getElementById('instruction').textContent = 'Doiralarni bosing va chaling! 🥁';
  }
};

window.addEventListener('beforeunload', () => {
  localStorage.setItem('kz-prog-sing', '100');
});
</script>
</body>
</html>
