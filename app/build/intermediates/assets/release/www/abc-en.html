<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ABC Game 🔡</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body { min-height:100vh; background: #FF9F43; font-family: 'Arial Rounded MT Bold', sans-serif; overflow: hidden; display: flex; flex-direction: column; align-items: center; color: white; }
#q-card { background:white; border-radius:32px; padding:40px 20px; width:90%; max-width:400px; text-align:center; margin-top:20px; box-shadow:0 15px 35px rgba(0,0,0,0.15); color: #333; }
#answers { display:grid; grid-template-columns:1fr 1fr; gap:15px; width:90%; max-width:400px; margin-top:30px; }
.ans-btn { background:white; border:none; border-radius:22px; padding:20px; font-size:36px; font-weight:900; color:#333; cursor:pointer; box-shadow:0 6px 15px rgba(0,0,0,0.1); }
.correct { background:#10B981 !important; color:white; }
.wrong { background:#EF4444 !important; color:white; }
.screen { position: fixed; inset: 0; z-index: 100; background: #FF9F43; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
.hidden { display: none !important; }
.btn-p { background: white; color: #FF9F43; border: none; border-radius: 50px; padding: 18px 44px; font-size: 18px; font-weight: 900; cursor: pointer; }
</style>
</head>
<body>
<div id="topbar" style="width:100%; padding:20px; display:flex; justify-content:space-between;">
  <div id="ui-label">🔡 ABC</div>
  <div>⭐ <span id="score">0</span></div>
</div>
<div id="q-card">
  <div id="q-emoji" style="font-size:100px;">🍎</div>
  <div id="q-text" style="font-size:24px; font-weight:900;">A is for...?</div>
</div>
<div id="answers"></div>
<div id="start-screen" class="screen">
  <h1 id="ui-start-t">ABC Game</h1>
  <button class="btn-p" onclick="start()">START</button>
</div>
<script>
const DATA = {
  en: [ {e:"🍎", l:"A", w:"Apple"}, {e:"🐻", l:"B", w:"Bear"}, {e:"🐱", l:"C", w:"Cat"} ],
  uz: [ {e:"🍎", l:"O", w:"Olma"}, {e:"🐻", l:"A", w:"Ayiq"}, {e:"🐱", l:"M", w:"Mushuk"} ],
  ru: [ {e:"🍎", l:"Я", w:"Яблоко"}, {e:"🐻", l:"М", w:"Медведь"}, {e:"🐱", l:"К", w:"Кошка"} ]
};
const T = {
  en: { quest:"is for...?", start:"START" },
  uz: { quest:"uchun...?", start:"BOSHLASH" },
  ru: { quest:"для...?", start:"ИГРАТЬ" }
};
let lang = new URLSearchParams(window.location.search).get('lang') || 'en';
let score = 0, current = null;

function next() {
  const pool = DATA[lang] || DATA.en;
  current = pool[Math.floor(Math.random() * pool.length)];
  document.getElementById('q-emoji').textContent = current.e;
  document.getElementById('q-text').textContent = `${current.l} ${T[lang].quest}`;

  const options = [current.l];
  while(options.length < 4) {
    const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZАБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ";
    const r = chars[Math.floor(Math.random() * chars.length)];
    if (!options.includes(r)) options.push(r);
  }
  const grid = document.getElementById('answers');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = v;
    btn.onclick = () => {
      if (v === current.l) {
        btn.classList.add('correct'); score += 20;
        document.getElementById('score').textContent = score;
        setTimeout(next, 800);
      } else { btn.classList.add('wrong'); }
    };
    grid.appendChild(btn);
  });
}
function start() {
  document.getElementById('start-screen').classList.add('hidden');
  next();
}
window.onload = () => {
  document.getElementById('ui-start-t').textContent = lang.toUpperCase() + " ABC";
  document.querySelector('.btn-p').textContent = T[lang].start;
};
</script>
</body>
</html>
