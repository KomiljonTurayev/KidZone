<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Find the Shadow 👤</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kz-ui.js"></script>
<script src="kids-ui.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body { min-height:100vh; background:linear-gradient(135deg,#263238,#37474F); font-family:'Arial Rounded MT Bold',Arial,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; color:#fff; }
#topbar { width:100%; max-width:460px; padding:14px 18px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.pill { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); border-radius:18px; padding:7px 14px; font-weight:900; font-size:14px; }
#game-card { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15); border-radius:28px; padding:22px 18px; width:92%; max-width:420px; text-align:center; margin:14px 0; box-shadow:0 8px 28px rgba(0,0,0,.3); }
#shadow-viz { font-size:110px; filter:brightness(0); opacity:0.85; animation:shv 2.5s ease-in-out infinite; display:block; }
@keyframes shv { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
#q-text { font-size:20px; font-weight:900; margin-top:10px; color:rgba(255,255,255,.85); }
#prog-bar-wrap { width:100%; height:5px; background:rgba(255,255,255,.1); border-radius:3px; margin-top:12px; }
#prog-bar { height:100%; background:rgba(255,255,255,.7); border-radius:3px; transition:width .4s; width:0%; }
#tools-row { display:flex; align-items:center; gap:10px; width:92%; max-width:420px; margin-bottom:10px; flex-wrap:wrap; }
#choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:92%; max-width:420px; }
.ans-btn { background:rgba(255,255,255,.1); border:2px solid rgba(255,255,255,.2); border-radius:22px; padding:16px 8px; font-size:38px; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.2); transition:transform .1s; display:flex; flex-direction:column; align-items:center; gap:5px; min-height:80px; justify-content:center; }
.ans-btn .nm { font-size:11px; font-weight:900; color:rgba(255,255,255,.8); }
.ans-btn:active { transform:scale(.92); }
.correct { background:rgba(16,185,129,.4)!important; border-color:#10B981!important; }
.wrong   { background:rgba(239,68,68,.4)!important;  border-color:#EF4444!important; }
.screen  { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#263238; color:#fff; padding:24px; text-align:center; }
.hidden  { display:none!important; }
.btn-p   { background:#fff; color:#263238; border:none; border-radius:50px; padding:16px 38px; font-size:16px; font-weight:900; cursor:pointer; margin-top:14px; font-family:'Arial Rounded MT Bold',Arial,sans-serif; }
.btn-p:active { transform:scale(.95); }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">👤 <span id="ui-title">Soya Topish</span></div>
  <div class="pill"><span id="lv-lbl" style="font-size:9px;color:rgba(255,255,255,.6);display:block;text-align:center;">LV</span><span id="lv-val">1</span></div>
</div>

<div id="game-card">
  <div id="shadow-viz">🐱</div>
  <div id="q-text"></div>
  <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
</div>

<div id="tools-row"></div>
<div id="choices"></div>

<div id="start-screen" class="screen">
  <div style="font-size:80px;filter:brightness(0);opacity:.85;">🐱</div>
  <h1 id="ui-start-t" style="font-size:26px;margin:12px 0 8px;">Soya Topish</h1>
  <p  id="ui-start-d" style="font-size:14px;opacity:.8;">Soyani ko'rib asl nusxasini top!</p>
  <div id="level-info" style="background:rgba(255,255,255,.1);border-radius:14px;padding:9px 18px;margin:12px 0;font-size:13px;font-weight:900;"></div>
  <button class="btn-p" id="btn-start" onclick="startGame()">START</button>
</div>

<div id="result-screen" class="screen hidden">
  <div id="res-em" style="font-size:72px;">🏆</div>
  <h1 id="res-ttl" style="font-size:22px;margin:10px 0 6px;"></h1>
  <div id="res-sc" style="font-size:26px;font-weight:900;margin-bottom:14px;"></div>
  <button class="btn-p" id="btn-next" onclick="onNext()"></button>
  <button class="btn-p" id="btn-restart" style="background:rgba(255,255,255,.15);color:#fff;margin-top:8px;" onclick="startGame()">↩ Qayta</button>
</div>

<script src="game-engine.js"></script>
<script>
const GAME_ID = 'shadow';
const T = {
  uz:{title:"Soya Topish", quest:"Bu kimning soyasi?", start:"BOSHLASH", desc:"Soyani ko'rib asl nusxasini top!", great:"Zo'r!", good:"Yaxshi!", try:"Harakat qil!", next:"Keyingi →", again:"↩ Qayta", lvInfo:"savol", lvUnit:"ta"},
  ru:{title:"Найди тень",  quest:"Чья это тень?",       start:"ИГРАТЬ",  desc:"Угадай существо по тени!",       great:"Отлично!", good:"Хорошо!", try:"Ещё раз!",     next:"Дальше →", again:"↩ Снова",  lvInfo:"вопрос", lvUnit:"шт"},
  en:{title:"Find Shadow", quest:"Whose shadow is this?",start:"START",   desc:"Look at the shadow and find the match!", great:"Amazing!", good:"Good job!", try:"Try again!", next:"Next →", again:"↩ Again",  lvInfo:"q", lvUnit:"items"},
};
const DATA = [
  /* 1-8 Easy animals */
  {id:"cat",     em:"🐱", nm:{uz:"Mushuk",  ru:"Кошка",    en:"Cat"}},
  {id:"dog",     em:"🐶", nm:{uz:"Kuchuk",  ru:"Собака",   en:"Dog"}},
  {id:"lion",    em:"🦁", nm:{uz:"Sher",    ru:"Лев",      en:"Lion"}},
  {id:"elephant",em:"🐘", nm:{uz:"Fil",     ru:"Слон",     en:"Elephant"}},
  {id:"frog",    em:"🐸", nm:{uz:"Qurbaqa", ru:"Лягушка",  en:"Frog"}},
  {id:"penguin", em:"🐧", nm:{uz:"Pingvin", ru:"Пингвин",  en:"Penguin"}},
  {id:"turtle",  em:"🐢", nm:{uz:"Toshbaqa",ru:"Черепаха", en:"Turtle"}},
  {id:"fish",    em:"🐟", nm:{uz:"Baliq",   ru:"Рыба",     en:"Fish"}},
  /* 9-16 Medium transport & objects */
  {id:"rocket",  em:"🚀", nm:{uz:"Raketa",  ru:"Ракета",   en:"Rocket"}},
  {id:"car",     em:"🚗", nm:{uz:"Mashina", ru:"Машина",   en:"Car"}},
  {id:"heli",    em:"🚁", nm:{uz:"Vertolyot",ru:"Вертолёт",en:"Helicopter"}},
  {id:"ship",    em:"🚢", nm:{uz:"Kema",    ru:"Корабль",  en:"Ship"}},
  {id:"star",    em:"⭐", nm:{uz:"Yulduz",  ru:"Звезда",   en:"Star"}},
  {id:"tree",    em:"🌲", nm:{uz:"Daraxt",  ru:"Дерево",   en:"Tree"}},
  {id:"umbrella",em:"☂️", nm:{uz:"Soyabon", ru:"Зонт",     en:"Umbrella"}},
  {id:"key",     em:"🔑", nm:{uz:"Kalit",   ru:"Ключ",     en:"Key"}},
  /* 17-24 Hard */
  {id:"dragon",  em:"🐉", nm:{uz:"Ajdaho",  ru:"Дракон",   en:"Dragon"}},
  {id:"unicorn", em:"🦄", nm:{uz:"Yakkashox", ru:"Единорог", en:"Unicorn"}},
  {id:"cactus",  em:"🌵", nm:{uz:"Kaktus",  ru:"Кактус",   en:"Cactus"}},
  {id:"mushroom",em:"🍄", nm:{uz:"Qo'ziqorin",ru:"Гриб",  en:"Mushroom"}},
  {id:"crown",   em:"👑", nm:{uz:"Toj",     ru:"Корона",   en:"Crown"}},
  {id:"sword",   em:"⚔️", nm:{uz:"Qilich",  ru:"Меч",      en:"Sword"}},
  {id:"castle",  em:"🏰", nm:{uz:"Qal'a",   ru:"Замок",    en:"Castle"}},
  {id:"ghost",   em:"👻", nm:{uz:"Arvoh",   ru:"Призрак",  en:"Ghost"}},
  /* 25-30 Expert */
  {id:"snake",   em:"🐍", nm:{uz:"Ilon",    ru:"Змея",     en:"Snake"}},
  {id:"spider",  em:"🕷️", nm:{uz:"O'rgimchak",ru:"Паук",  en:"Spider"}},
  {id:"octopus", em:"🐙", nm:{uz:"Sakkizoyoq",ru:"Осьминог",en:"Octopus"}},
  {id:"crab",    em:"🦀", nm:{uz:"Qisqichbaqa",ru:"Краб",  en:"Crab"}},
  {id:"scorpion",em:"🦂", nm:{uz:"Chayon",ru:"Скорпион",en:"Scorpion"}},
  {id:"bat",     em:"🦇", nm:{uz:"Ko'rshapalak",ru:"Летучая мышь",en:"Bat"}},
];

const engine = new KidZoneGame({ id: GAME_ID });
const lang = engine.lang;
KidUI.init({ title: "Find Shadow", icon: "👤", color: "#6A1B9A", gameId: "shadow", lang: lang });
const t = T[lang] || T.en;
let _level, _cfg, _pool, _questions, _qIdx, _score, _answered, _hintsObj, _livesObj;

function init() {
  _level = KZL.getLevel(GAME_ID);
  _cfg   = KZL.cfg(GAME_ID);
  _pool  = KZL.slicePool(DATA, _level);
  document.getElementById('ui-title').textContent   = t.title;
  document.getElementById('ui-start-t').textContent = t.title;
  document.getElementById('ui-start-d').textContent = t.desc;
  document.getElementById('btn-start').textContent  = t.start;
  document.getElementById('btn-restart').textContent= t.again;
  document.getElementById('lv-val').textContent     = _level;
  document.getElementById('level-info').textContent = `${_cfg.stars} · ${_cfg.q} ${t.lvInfo} · 💡${_cfg.hints} · 🎭${_pool.length} ${t.lvUnit}`;
  KZL.howToPlay({ id: GAME_ID, steps:{
    uz:[{icon:'👤',text:'Qora soyani diqqat bilan kuzat'},{icon:'👆',text:'4 variantdan to\'g\'ri javobni top'},{icon:'💡',text:'Hint bir noto\'g\'ri variantni o\'chiradi'},{icon:'❤️',text:'3 ta hayot — ehtiyot bo\'l!'},{icon:'🏆',text:'60% ball yig\'ib keyingi darajaga o\'t!'}],
    ru:[{icon:'👤',text:'Внимательно рассмотри тёмный силуэт'},{icon:'👆',text:'Найди правильный ответ из 4 вариантов'},{icon:'💡',text:'Подсказка убирает один неверный вариант'},{icon:'❤️',text:'3 жизни — будь внимателен!'},{icon:'🏆',text:'Набери 60% чтобы перейти на следующий уровень!'}],
    en:[{icon:'👤',text:'Look carefully at the dark silhouette'},{icon:'👆',text:'Find the correct answer from 4 options'},{icon:'💡',text:'Hint removes one wrong option'},{icon:'❤️',text:'3 lives — be careful!'},{icon:'🏆',text:'Score 60% to advance to the next level!'}],
  }});
}

function startGame() {
  _level = KZL.getLevel(GAME_ID);
  _cfg   = KZL.cfg(GAME_ID);
  _pool  = KZL.slicePool(DATA, _level);
  _questions = shuffle(_pool).slice(0, _cfg.q);
  _qIdx = 0; _score = 0; _answered = false;
  document.getElementById('score').textContent='0';
  document.getElementById('lv-val').textContent=_level;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  const row = document.getElementById('tools-row');
  row.innerHTML='';
  _hintsObj = KZL.createHints(_cfg.hints);
  _hintsObj.el.onclick = () => {
    if(_answered)return;
    _hintsObj.use(()=>{
      const wr=[...document.querySelectorAll('.ans-btn')].filter(b=>b.dataset.c==='0'&&b.style.opacity!=='0.2');
      if(wr.length){const r=wr[Math.floor(Math.random()*wr.length)];r.style.opacity='0.2';r.style.pointerEvents='none';}
    });
  };
  row.appendChild(_hintsObj.el);
  _livesObj = KZL.createLives(3);
  row.appendChild(_livesObj.el);
  const lv=document.createElement('div');
  lv.style.cssText='margin-left:auto;background:rgba(255,255,255,.12);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:900;';
  lv.textContent='LV '+_level+' / 20'; row.appendChild(lv);
  loadQ();
}

function loadQ() {
  if(_qIdx>=_questions.length){showResult();return;}
  _answered=false;
  document.querySelectorAll('.ans-btn').forEach(b=>{b.style.opacity='1';b.style.pointerEvents='';});
  const q=_questions[_qIdx];
  document.getElementById('prog-bar').style.width=`${(_qIdx/_questions.length)*100}%`;
  document.getElementById('shadow-viz').textContent=q.em;
  document.getElementById('q-text').textContent=t.quest;

  const wrong=shuffle(_pool.filter(d=>d.id!==q.id)).slice(0,_cfg.c-1);
  const opts=shuffle([q,...wrong]);
  const grid=document.getElementById('choices');
  grid.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='ans-btn'; btn.dataset.c=o.id===q.id?'1':'0';
    btn.innerHTML=`<span>${o.em}</span><span class="nm">${o.nm[lang]||o.nm.en}</span>`;
    btn.onclick=()=>pick(btn,o,q);
    grid.appendChild(btn);
  });
}

function pick(btn,opt,q){
  if(_answered)return; _answered=true;
  if(opt.id===q.id){
    btn.classList.add('correct'); _score+=10;
    document.getElementById('score').textContent=_score;
    engine.playSound('match'); engine.vibrate(30);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.ans-btn[data-c="1"]').forEach(b=>b.classList.add('correct'));
    const dead=_livesObj.lose(); engine.playSound('mismatch');
    if(dead){setTimeout(showResult,900);return;}
  }
  setTimeout(()=>{_qIdx++;loadQ();},900);
}

function showResult(){
  const max=_questions.length*10, pct=_score/max;
  document.getElementById('res-em').textContent = pct>=.8?'🏆':pct>=.6?'⭐':'💪';
  document.getElementById('res-ttl').textContent= pct>=.8?t.great:pct>=.6?t.good:t.try;
  document.getElementById('res-sc').textContent = _score+' / '+max;
  const _showNext = pct>=.6&&_level<20;
  const _btnNext = document.getElementById('btn-next');
  _btnNext.textContent = _showNext ? t.next : t.again;
  _btnNext.style.display = _showNext ? '' : 'none';
  document.getElementById('result-screen').classList.remove('hidden');
  if(pct>=.6){
    engine.reportScore(Math.round(_score/2));
    engine.spawnConfetti();
    if(KZL.getLevel(GAME_ID)===_level&&_level<20){
      const nl=KZL.nextLevel(GAME_ID);
      setTimeout(()=>KZL.showLevelUp(GAME_ID,nl,lang),400);
    }
  }
}

function onNext(){
  document.getElementById('result-screen').classList.add('hidden');
  init(); startGame();
}

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
window.onload=()=>{init();};
</script>
</body>
</html>
