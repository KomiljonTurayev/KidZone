<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Weather 🌤️</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kz-ui.js"></script>
<script src="kids-ui.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body { min-height:100vh; background:linear-gradient(180deg,#1565C0 0%,#42A5F5 60%,#87CEEB 100%); font-family:'Arial Rounded MT Bold',Arial,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; color:#fff; }
#topbar { width:100%; max-width:460px; padding:14px 18px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.pill { background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.3); border-radius:18px; padding:7px 14px; font-weight:900; font-size:14px; }
.pill-sm { font-size:9px; color:rgba(255,255,255,.65); display:block; text-align:center; }
#game-card { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:28px; padding:22px 18px; width:92%; max-width:420px; text-align:center; margin:14px 0; box-shadow:0 8px 28px rgba(0,0,0,.2); }
#q-emoji { font-size:100px; line-height:1; margin-bottom:8px; animation:wfl 2.5s ease-in-out infinite; display:block; }
@keyframes wfl { 0%,100%{transform:scale(1) rotate(-3deg)} 50%{transform:scale(1.06) rotate(3deg)} }
#q-text { font-size:20px; font-weight:900; color:rgba(255,255,255,.9); }
#prog-bar-wrap { width:100%; height:5px; background:rgba(255,255,255,.1); border-radius:3px; margin-top:10px; }
#prog-bar { height:100%; background:rgba(255,255,255,.8); border-radius:3px; transition:width .4s; width:0%; }
#tools-row { display:flex; align-items:center; gap:10px; width:92%; max-width:420px; margin-bottom:10px; flex-wrap:wrap; }
#choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:92%; max-width:420px; }
.ans-btn { background:rgba(255,255,255,.15); border:2px solid rgba(255,255,255,.25); border-radius:20px; padding:14px 8px; font-size:15px; font-weight:900; color:#fff; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.15); transition:transform .1s; min-height:62px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; }
.ans-btn .em2 { font-size:30px; }
.ans-btn:active { transform:scale(.92); }
.correct { background:rgba(16,185,129,.5)!important; border-color:#10B981!important; }
.wrong   { background:rgba(239,68,68,.45)!important;  border-color:#EF4444!important; }
.screen  { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#1565C0; color:#fff; padding:24px; text-align:center; }
.hidden  { display:none!important; }
.btn-p   { background:#fff; color:#1565C0; border:none; border-radius:50px; padding:16px 38px; font-size:16px; font-weight:900; cursor:pointer; margin-top:14px; font-family:'Arial Rounded MT Bold',Arial,sans-serif; }
.btn-p:active { transform:scale(.95); }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">🌤️ <span id="ui-title">Ob-Havo</span></div>
  <div class="pill" style="flex-direction:column;padding:5px 10px;">
    <span class="pill-sm">LEVEL</span><span id="lv-val">1</span>
  </div>
</div>

<div id="game-card">
  <span id="q-emoji">☀️</span>
  <div id="q-text"></div>
  <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
</div>
<div id="tools-row"></div>
<div id="choices"></div>

<div id="start-screen" class="screen">
  <div style="font-size:80px;">🌈</div>
  <h1 id="ui-start-t" style="font-size:26px;margin:12px 0 8px;">Ob-Havo</h1>
  <p  id="ui-start-d" style="font-size:14px;opacity:.85;">Ob-havo turlarini o'rgan!</p>
  <div id="level-info" style="background:rgba(255,255,255,.15);border-radius:14px;padding:9px 18px;margin:12px 0;font-size:13px;font-weight:900;"></div>
  <button class="btn-p" onclick="startGame()">START</button>
</div>

<div id="result-screen" class="screen hidden">
  <div id="res-em" style="font-size:72px;">🏆</div>
  <h1 id="res-ttl" style="font-size:22px;margin:10px 0 6px;"></h1>
  <div id="res-sc" style="font-size:26px;font-weight:900;margin-bottom:14px;"></div>
  <button class="btn-p" id="btn-next" onclick="onNext()"></button>
  <button class="btn-p" style="background:rgba(255,255,255,.15);color:#fff;margin-top:8px;" onclick="startGame()">↩ Qayta</button>
</div>

<script src="game-engine.js"></script>
<script>
const GAME_ID = 'weather';
const T = {
  uz:{title:"Ob-Havo", quest:"Bu qanday ob-havo?", start:"BOSHLASH", desc:"Ob-havo turlarini o'rgan!", great:"Zo'r!", good:"Yaxshi!", try:"Harakat qil!", next:"Keyingi →", again:"↩ Qayta"},
  ru:{title:"Погода",  quest:"Какая погода?",       start:"ИГРАТЬ",  desc:"Изучай виды погоды!",      great:"Отлично!", good:"Хорошо!", try:"Ещё раз!",  next:"Дальше →", again:"↩ Снова"},
  en:{title:"Weather", quest:"What weather is this?",start:"START",   desc:"Learn about weather types!",great:"Amazing!", good:"Good job!", try:"Try again!", next:"Next →", again:"↩ Again"},
};
const DATA = [
  /* 1-8 Easy */
  {id:"sunny",    em:"☀️",  nm:{uz:"Quyoshli",      ru:"Солнечно",    en:"Sunny"}},
  {id:"cloudy",   em:"☁️",  nm:{uz:"Bulutli",       ru:"Облачно",     en:"Cloudy"}},
  {id:"rainy",    em:"🌧️",  nm:{uz:"Yomg'irli",    ru:"Дождливо",    en:"Rainy"}},
  {id:"snowy",    em:"❄️",  nm:{uz:"Qorli",         ru:"Снежно",      en:"Snowy"}},
  {id:"thunder",  em:"⚡",  nm:{uz:"Momaqaldiroq",  ru:"Гроза",       en:"Thunder"}},
  {id:"windy",    em:"🌬️",  nm:{uz:"Shamollik",     ru:"Ветрено",     en:"Windy"}},
  {id:"rainbow",  em:"🌈",  nm:{uz:"Kamalak",       ru:"Радуга",      en:"Rainbow"}},
  {id:"foggy",    em:"🌫️",  nm:{uz:"Tumanli",       ru:"Туман",       en:"Foggy"}},
  /* 9-16 Medium */
  {id:"partly",   em:"⛅",  nm:{uz:"Qisman bulutli",ru:"Переменная облачность",en:"Partly cloudy"}},
  {id:"hail",     em:"🌨️",  nm:{uz:"Do'l",          ru:"Град",        en:"Hail"}},
  {id:"tornado",  em:"🌪️",  nm:{uz:"Tornado",       ru:"Торнадо",     en:"Tornado"}},
  {id:"hot",      em:"🌡️",  nm:{uz:"Issiq",         ru:"Жаркий",      en:"Hot"}},
  {id:"cold",     em:"🥶",  nm:{uz:"Sovuq",         ru:"Холодно",     en:"Cold"}},
  {id:"humid",    em:"💧",  nm:{uz:"Nam",            ru:"Влажно",      en:"Humid"}},
  {id:"sunset",   em:"🌅",  nm:{uz:"Quyosh botishi", ru:"Закат",       en:"Sunset"}},
  {id:"night",    em:"🌙",  nm:{uz:"Tunggi",        ru:"Ночь",        en:"Night"}},
  /* 17-24 Hard */
  {id:"blizzard", em:"🌬️❄️",nm:{uz:"Qor bo'roni",   ru:"Метель",      en:"Blizzard"}},
  {id:"drought",  em:"🏜️",  nm:{uz:"Qurg'oqchilik", ru:"Засуха",      en:"Drought"}},
  {id:"flood",    em:"🌊",  nm:{uz:"Suv toshqini",  ru:"Наводнение",  en:"Flood"}},
  {id:"spring",   em:"🌸",  nm:{uz:"Bahor",         ru:"Весна",       en:"Spring"}},
  {id:"summer",   em:"☀️🏖️",nm:{uz:"Yoz",           ru:"Лето",        en:"Summer"}},
  {id:"autumn",   em:"🍂",  nm:{uz:"Kuz",           ru:"Осень",       en:"Autumn"}},
  {id:"winter",   em:"⛄",  nm:{uz:"Qish",          ru:"Зима",        en:"Winter"}},
  {id:"storm",    em:"⛈️",  nm:{uz:"Bo'ron",        ru:"Шторм",       en:"Storm"}},
  /* 25-30 Expert */
  {id:"aurora",   em:"🌌",  nm:{uz:"Shimoliy yog'du",ru:"Северное сияние",en:"Aurora"}},
  {id:"cyclone",  em:"🌀",  nm:{uz:"Tsiklon",       ru:"Циклон",      en:"Cyclone"}},
  {id:"haze",     em:"😶‍🌫️",nm:{uz:"Tutunli",       ru:"Дымка",       en:"Haze"}},
  {id:"monsoon",  em:"🌧️🌿",nm:{uz:"Musson",        ru:"Муссон",      en:"Monsoon"}},
  {id:"sleet",    em:"🌨️",  nm:{uz:"Yomg'ir-qor",  ru:"Мокрый снег", en:"Sleet"}},
  {id:"drought2", em:"🌞💧",nm:{uz:"Juda issiq",    ru:"Зной",        en:"Heat wave"}},
];

const engine = new KidZoneGame({ id: GAME_ID });
const lang = engine.lang;
KidUI.init({ title: "Weather", icon: "🌤️", color: "#0288D1", gameId: "weather", lang: lang });
const t = T[lang] || T.en;
let _level, _cfg, _pool, _questions, _qIdx, _score, _answered, _hintsObj, _livesObj;

function init() {
  _level = KZL.getLevel(GAME_ID);
  _cfg   = KZL.cfg(GAME_ID);
  _pool  = KZL.slicePool(DATA, _level);
  document.getElementById('ui-title').textContent   = t.title;
  document.getElementById('ui-start-t').textContent = t.title;
  document.getElementById('ui-start-d').textContent = t.desc;
  document.getElementById('lv-val').textContent     = _level;
  document.getElementById('level-info').textContent = `${_cfg.stars} · ${_cfg.q} savol · 💡${_cfg.hints} · 🌡️${_pool.length} ta`;
  KZL.howToPlay({id:GAME_ID,steps:{
    uz:[{icon:'🌤️',text:'Ob-havo belgisini ko\'rasan'},{icon:'👆',text:'To\'g\'ri nomini tanlang'},{icon:'💡',text:'Hint noto\'g\'ri javobni o\'chiradi'},{icon:'❤️',text:'3 ta hayot bor — ehtiyotkor bo\'l!'},{icon:'🏆',text:'60% ball yig\'ib keyingi darajaga o\'t!'}],
    ru:[{icon:'🌤️',text:'Видишь символ погоды'},{icon:'👆',text:'Выбери правильное название'},{icon:'💡',text:'Подсказка убирает неверный ответ'},{icon:'❤️',text:'3 жизни — будь внимателен!'},{icon:'🏆',text:'Набери 60% чтобы перейти на следующий уровень!'}],
    en:[{icon:'🌤️',text:'You see a weather symbol'},{icon:'👆',text:'Choose the correct name'},{icon:'💡',text:'Hint removes one wrong option'},{icon:'❤️',text:'3 lives — be careful!'},{icon:'🏆',text:'Score 60% to advance to next level!'}],
  }});
}

function startGame() {
  _level = KZL.getLevel(GAME_ID);
  _cfg   = KZL.cfg(GAME_ID);
  _pool  = KZL.slicePool(DATA, _level);
  _questions = shuffle(_pool).slice(0, _cfg.q);
  _qIdx=0; _score=0; _answered=false;
  document.getElementById('score').textContent='0';
  document.getElementById('lv-val').textContent=_level;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  const row=document.getElementById('tools-row'); row.innerHTML='';
  _hintsObj=KZL.createHints(_cfg.hints);
  _hintsObj.el.onclick=()=>{
    if(_answered)return;
    _hintsObj.use(()=>{
      const wr=[...document.querySelectorAll('.ans-btn')].filter(b=>b.dataset.c==='0'&&b.style.opacity!=='0.2');
      if(wr.length){const r=wr[Math.floor(Math.random()*wr.length)];r.style.opacity='0.2';r.style.pointerEvents='none';}
    });
  };
  row.appendChild(_hintsObj.el);
  _livesObj=KZL.createLives(3); row.appendChild(_livesObj.el);
  const lv=document.createElement('div');
  lv.style.cssText='margin-left:auto;background:rgba(255,255,255,.12);border-radius:12px;padding:5px 12px;font-size:12px;font-weight:900;';
  lv.textContent='LV '+_level+' / 20'; row.appendChild(lv);
  loadQ();
}

function loadQ() {
  if(_qIdx>=_questions.length){showResult();return;}
  _answered=false;
  document.querySelectorAll('.ans-btn').forEach(b=>{b.style.opacity='1';b.style.pointerEvents='';});
  const q=_questions[_qIdx];
  document.getElementById('prog-bar').style.width=`${(_qIdx/_questions.length)*100}%`;
  document.getElementById('q-emoji').textContent=q.em;
  document.getElementById('q-text').textContent=t.quest;

  const wrong=shuffle(_pool.filter(d=>d.id!==q.id)).slice(0,_cfg.c-1);
  const opts=shuffle([q,...wrong]);
  const grid=document.getElementById('choices'); grid.innerHTML='';
  opts.forEach(o=>{
    const btn=document.createElement('button');
    btn.className='ans-btn'; btn.dataset.c=o.id===q.id?'1':'0';
    btn.innerHTML=`<span class="em2">${o.em}</span><span>${o.nm[lang]||o.nm.en}</span>`;
    btn.onclick=()=>pick(btn,o,q);
    grid.appendChild(btn);
  });
}

function pick(btn,opt,q){
  if(_answered)return; _answered=true;
  if(opt.id===q.id){
    btn.classList.add('correct'); _score+=10;
    document.getElementById('score').textContent=_score;
    engine.playSound('match'); engine.vibrate(30);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.ans-btn[data-c="1"]').forEach(b=>b.classList.add('correct'));
    const dead=_livesObj.lose(); engine.playSound('mismatch');
    if(dead){setTimeout(showResult,900);return;}
  }
  setTimeout(()=>{_qIdx++;loadQ();},900);
}

function showResult(){
  const max=_questions.length*10, pct=_score/max;
  document.getElementById('res-em').textContent = pct>=.8?'🏆':pct>=.6?'⭐':'💪';
  document.getElementById('res-ttl').textContent= pct>=.8?t.great:pct>=.6?t.good:t.try;
  document.getElementById('res-sc').textContent = _score+' / '+max;
  document.getElementById('btn-next').textContent=(pct>=.6&&_level<20)?t.next:t.again;
  document.getElementById('result-screen').classList.remove('hidden');
  if(pct>=.6){
    engine.reportScore(Math.round(_score/2));
    engine.spawnConfetti();
    if(KZL.getLevel(GAME_ID)===_level&&_level<20){
      const nl=KZL.nextLevel(GAME_ID);
      setTimeout(()=>KZL.showLevelUp(GAME_ID,nl,lang),400);
    }
  }
}

function onNext(){ document.getElementById('result-screen').classList.add('hidden'); init(); startGame(); }
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
window.onload=()=>{init();};
</script>
</body>
</html>
