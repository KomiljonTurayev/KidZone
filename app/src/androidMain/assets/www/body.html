<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Body Parts 👁️</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kz-ui.js"></script>
<script src="kids-ui.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body { min-height:100vh; background:#FCE4EC; font-family:'Arial Rounded MT Bold',Arial,sans-serif; overflow:hidden; display:flex; flex-direction:column; align-items:center; }
#topbar { width:100%; max-width:460px; padding:14px 18px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.pill { background:#fff; border-radius:20px; padding:7px 14px; font-weight:900; color:#E91E63; box-shadow:0 4px 10px rgba(0,0,0,.08); font-size:14px; }
.pill-sm { font-size:9px; color:#aaa; display:block; text-align:center; }
#game-card { background:#fff; border-radius:32px; padding:22px 18px; width:92%; max-width:420px; text-align:center; margin:14px 0; box-shadow:0 12px 32px rgba(0,0,0,.09); }
#target-text { font-size:24px; font-weight:900; color:#333; margin-bottom:14px; min-height:32px; }
#body-viz { font-size:100px; margin-bottom:6px; animation:bv 2s ease-in-out infinite; }
@keyframes bv { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
#prog-bar-wrap { width:100%; height:6px; background:#FCE4EC; border-radius:3px; margin-top:10px; }
#prog-bar { height:100%; background:#E91E63; border-radius:3px; transition:width .4s; width:0%; }
#tools-row { display:flex; align-items:center; gap:10px; width:92%; max-width:420px; margin-bottom:10px; flex-wrap:wrap; }
#choices { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:92%; max-width:420px; }
.ans-btn { background:#fff; border:3px solid #FCE4EC; border-radius:22px; padding:16px 8px; font-size:17px; font-weight:900; color:#333; cursor:pointer; box-shadow:0 5px 14px rgba(0,0,0,.07); transition:transform .1s; min-height:64px; display:flex; align-items:center; justify-content:center; gap:6px; }
.ans-btn:active { transform:scale(.92); }
.correct { background:#D1FAE5!important; border-color:#10B981!important; color:#065F46!important; }
.wrong   { background:#FEE2E2!important; border-color:#EF4444!important; color:#7F1D1D!important; }
.screen  { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#E91E63; color:#fff; padding:24px; text-align:center; }
.hidden  { display:none!important; }
.btn-p   { background:#fff; color:#E91E63; border:none; border-radius:50px; padding:16px 38px; font-size:16px; font-weight:900; cursor:pointer; margin-top:14px; font-family:'Arial Rounded MT Bold',Arial,sans-serif; }
.btn-p:active { transform:scale(.95); }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">⭐ <span id="score">0</span></div>
  <div class="pill">👁️ <span id="ui-title">Body Parts</span></div>
  <div class="pill" style="flex-direction:column;padding:5px 10px;">
    <span class="pill-sm" id="lv-lbl">LEVEL</span><span id="lv-val">1</span>
  </div>
</div>

<div id="game-card">
  <div id="target-text"></div>
  <div id="body-viz">👦</div>
  <div id="prog-bar-wrap"><div id="prog-bar"></div></div>
</div>

<div id="tools-row"></div>
<div id="choices"></div>

<div id="start-screen" class="screen">
  <div style="font-size:80px;">👦</div>
  <h1 id="ui-start-t" style="font-size:26px;margin:12px 0 8px;">Body Parts</h1>
  <p  id="ui-start-d" style="font-size:14px;opacity:.85;"></p>
  <div id="level-info" style="background:rgba(255,255,255,.2);border-radius:14px;padding:9px 18px;margin:12px 0;font-size:13px;font-weight:900;"></div>
  <button class="btn-p" onclick="startGame()">START</button>
</div>

<div id="result-screen" class="screen hidden">
  <div id="res-em" style="font-size:72px;">🏆</div>
  <h1 id="res-ttl" style="font-size:22px;margin:10px 0 6px;"></h1>
  <div id="res-sc" style="font-size:26px;font-weight:900;margin-bottom:14px;"></div>
  <button class="btn-p" id="btn-next" onclick="onNext()"></button>
  <button class="btn-p" id="btn-back" style="background:rgba(255,255,255,.2);color:#fff;margin-top:8px;" onclick="startGame()">↩ Qayta</button>
</div>

<script src="game-engine.js"></script>
<script>
const GAME_ID = 'body';
const T = {
  uz:{title:"Tana A'zolari", quest:"qayerda?", start:"BOSHLASH", desc:"Tana a'zolarini 3 tilda o'rgan!", great:"Zo'r!", good:"Yaxshi!", try:"Yana!", next:"Keyingi →", again:"↩ Qayta", back:"↩ Qayta", lvLbl:"DARAJA", qUnit:"savol", pUnit:" ta"},
  ru:{title:"Части тела",    quest:"где находится?", start:"ИГРАТЬ", desc:"Учи части тела на 3 языках!", great:"Отлично!", good:"Хорошо!", try:"Ещё!", next:"Дальше →", again:"↩ Снова", back:"↩ Назад", lvLbl:"УРОВЕНЬ", qUnit:"вопросов", pUnit:""},
  en:{title:"Body Parts",    quest:"where is it?",   start:"START",  desc:"Learn body parts in 3 languages!", great:"Amazing!", good:"Good job!", try:"Try again!", next:"Next Level →", again:"↩ Again", back:"↩ Back", lvLbl:"LEVEL", qUnit:"questions", pUnit:""},
};
const DATA = [
  /* 1-8 Easy */
  {id:"eye",    em:"👁️", nm:{uz:"Ko'z",      ru:"Глаз",     en:"Eye"}},
  {id:"ear",    em:"👂",  nm:{uz:"Quloq",     ru:"Ухо",      en:"Ear"}},
  {id:"nose",   em:"👃",  nm:{uz:"Burun",     ru:"Нос",      en:"Nose"}},
  {id:"mouth",  em:"👄",  nm:{uz:"Og'iz",     ru:"Рот",      en:"Mouth"}},
  {id:"hand",   em:"✋",  nm:{uz:"Qo'l",      ru:"Рука",     en:"Hand"}},
  {id:"foot",   em:"🦶",  nm:{uz:"Oyoq",      ru:"Нога",     en:"Foot"}},
  {id:"hair",   em:"💇",  nm:{uz:"Soch",      ru:"Волосы",   en:"Hair"}},
  {id:"tooth",  em:"🦷",  nm:{uz:"Tish",      ru:"Зуб",      en:"Tooth"}},
  /* 9-16 Medium */
  {id:"tongue", em:"👅",  nm:{uz:"Til",       ru:"Язык",     en:"Tongue"}},
  {id:"arm",    em:"💪",  nm:{uz:"Mushak",    ru:"Мышца",    en:"Muscle"}},
  {id:"finger", em:"☝️",  nm:{uz:"Barmoq",    ru:"Палец",    en:"Finger"}},
  {id:"thumb",  em:"👍",  nm:{uz:"Bosh barmoq",ru:"Большой палец",en:"Thumb"}},
  {id:"knee",   em:"🦵",  nm:{uz:"Tizza",     ru:"Колено",   en:"Knee"}},
  {id:"brain",  em:"🧠",  nm:{uz:"Miya",      ru:"Мозг",     en:"Brain"}},
  {id:"heart",  em:"❤️",  nm:{uz:"Yurak",     ru:"Сердце",   en:"Heart"}},
  {id:"bone",   em:"🦴",  nm:{uz:"Suyak",     ru:"Кость",    en:"Bone"}},
  /* 17-24 Hard */
  {id:"back",   em:"🔙",  nm:{uz:"Orqa",      ru:"Спина",    en:"Back"}},
  {id:"belly",  em:"🫃",  nm:{uz:"Qorin",     ru:"Живот",    en:"Belly"}},
  {id:"chest",  em:"🧍",  nm:{uz:"Ko'krak",   ru:"Грудь",    en:"Chest"}},
  {id:"shoulder",em:"🤷", nm:{uz:"Yelka",     ru:"Плечо",    en:"Shoulder"}},
  {id:"elbow",  em:"🦾",  nm:{uz:"Tirsak",    ru:"Локоть",   en:"Elbow"}},
  {id:"lip",    em:"💋",  nm:{uz:"Lab",       ru:"Губа",     en:"Lip"}},
  {id:"cheek",  em:"😊",  nm:{uz:"Yonoq",     ru:"Щека",     en:"Cheek"}},
  {id:"forehead",em:"🤦", nm:{uz:"Peshona",   ru:"Лоб",      en:"Forehead"}},
  /* 25-30 Expert */
  {id:"chin",   em:"😤",  nm:{uz:"Iyak",      ru:"Подбородок",en:"Chin"}},
  {id:"neck",   em:"🧣",  nm:{uz:"Bo'yin",    ru:"Шея",      en:"Neck"}},
  {id:"wrist",  em:"⌚",  nm:{uz:"Bilak",     ru:"Запястье", en:"Wrist"}},
  {id:"ankle",  em:"🦶",  nm:{uz:"To'piq",    ru:"Лодыжка",  en:"Ankle"}},
  {id:"eyelash",em:"😍",  nm:{uz:"Kiprik",    ru:"Ресница",  en:"Eyelash"}},
  {id:"eyebrow",em:"🤨",  nm:{uz:"Qosh",      ru:"Бровь",    en:"Eyebrow"}},
];

const engine = new KidZoneGame({ id: GAME_ID });
const lang = engine.lang;
KidUI.init({ title: "Body Parts", icon: "👁️", color: "#D84315", gameId: "body", lang: lang });
const t = T[lang] || T.en;
let _level, _cfg, _pool, _questions, _qIdx, _score, _answered, _hintsObj, _livesObj;

function init() {
  _level = KZL.getLevel(GAME_ID);
  _cfg   = KZL.cfg(GAME_ID);
  _pool  = KZL.slicePool(DATA, _level);
  document.title = t.title;
  document.getElementById('ui-title').textContent   = t.title;
  document.getElementById('ui-start-t').textContent = t.title;
  document.getElementById('ui-start-d').textContent = t.desc;
  document.getElementById('lv-val').textContent     = _level;
  document.getElementById('lv-lbl').textContent     = t.lvLbl;
  document.getElementById('btn-back').textContent   = t.back;
  document.getElementById('level-info').textContent = `${_cfg.stars} · ${_cfg.q} ${t.qUnit} · 💡${_cfg.hints} · 🐾${_pool.length}${t.pUnit}`;

  KZL.howToPlay({ id: GAME_ID, steps:{
    uz:[{icon:'👦',text:'Tana a\'zosi nomini ko\'rasan'},{icon:'👆',text:'To\'g\'ri emoji ni top'},{icon:'💡',text:'Hint bir noto\'g\'ri javobni o\'chiradi'},{icon:'❤️',text:'3 ta hayot — ehtiyotkor bo\'l!'},{icon:'🏆',text:'Yangi daraja uchun 60% ball to\'pla!'}],
    ru:[{icon:'👦',text:'Видишь название части тела'},{icon:'👆',text:'Найди правильный эмодзи'},{icon:'💡',text:'Подсказка убирает неверный ответ'},{icon:'❤️',text:'3 жизни — будь осторожен!'},{icon:'🏆',text:'Набери 60% для следующего уровня!'}],
    en:[{icon:'👦',text:'You see the name of a body part'},{icon:'👆',text:'Find the correct emoji'},{icon:'💡',text:'Hint removes one wrong option'},{icon:'❤️',text:'3 lives — be careful!'},{icon:'🏆',text:'Score 60% to advance to next level!'}],
  }});
}

function startGame() {
  _level = KZL.getLevel(GAME_ID);
  _cfg   = KZL.cfg(GAME_ID);
  _pool  = KZL.slicePool(DATA, _level);
  _questions = shuffle(_pool).slice(0, _cfg.q);
  _qIdx = 0; _score = 0; _answered = false;
  document.getElementById('score').textContent = '0';
  document.getElementById('lv-val').textContent = _level;
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');

  // Tools
  const row = document.getElementById('tools-row');
  row.innerHTML = '';
  _hintsObj = KZL.createHints(_cfg.hints);
  _hintsObj.el.onclick = () => {
    if (_answered) return;
    _hintsObj.use(() => {
      const wr = [...document.querySelectorAll('.ans-btn')].filter(b=>b.dataset.c==='0'&&b.style.opacity!=='0.2');
      if (wr.length) { const r=wr[Math.floor(Math.random()*wr.length)]; r.style.opacity='0.2'; r.style.pointerEvents='none'; }
    });
  };
  row.appendChild(_hintsObj.el);
  _livesObj = KZL.createLives(3);
  row.appendChild(_livesObj.el);
  const lv = document.createElement('div');
  lv.style.cssText='margin-left:auto;background:#FCE4EC;border-radius:12px;padding:5px 12px;font-size:12px;font-weight:900;color:#E91E63;';
  lv.textContent='LV '+_level+' / 20'; row.appendChild(lv);
  loadQ();
}

function loadQ() {
  if (_qIdx >= _questions.length) { showResult(); return; }
  _answered = false;
  document.querySelectorAll('.ans-btn').forEach(b=>{b.style.opacity='1';b.style.pointerEvents='';});
  const q = _questions[_qIdx];
  document.getElementById('prog-bar').style.width = `${(_qIdx/_questions.length)*100}%`;
  document.getElementById('target-text').textContent = (q.nm[lang]||q.nm.en) + ' ' + t.quest;
  document.getElementById('body-viz').textContent = q.em;

  const wrong = shuffle(_pool.filter(d=>d.id!==q.id)).slice(0,_cfg.c-1);
  const opts  = shuffle([q,...wrong]);
  const grid  = document.getElementById('choices');
  grid.innerHTML='';
  opts.forEach(o=>{
    const btn = document.createElement('button');
    btn.className='ans-btn'; btn.dataset.c = o.id===q.id?'1':'0';
    btn.textContent = o.em+' '+(o.nm[lang]||o.nm.en);
    btn.onclick = ()=>pick(btn,o,q);
    grid.appendChild(btn);
  });
}

function pick(btn,opt,q){
  if(_answered)return; _answered=true;
  if(opt.id===q.id){
    btn.classList.add('correct'); _score+=10;
    document.getElementById('score').textContent=_score;
    engine.playSound('match'); engine.vibrate(30);
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.ans-btn[data-c="1"]').forEach(b=>b.classList.add('correct'));
    const dead=_livesObj.lose(); engine.playSound('mismatch');
    if(dead){setTimeout(showResult,900);return;}
  }
  setTimeout(()=>{_qIdx++;loadQ();},900);
}

function showResult(){
  const max=_questions.length*10, pct=_score/max;
  document.getElementById('res-em').textContent  = pct>=.8?'🏆':pct>=.6?'⭐':'💪';
  document.getElementById('res-ttl').textContent = pct>=.8?t.great:pct>=.6?t.good:t.try;
  document.getElementById('res-sc').textContent  = _score+' / '+max;
  document.getElementById('btn-next').textContent= (pct>=.6&&_level<20)?t.next:t.again;
  document.getElementById('result-screen').classList.remove('hidden');
  if(pct>=.6){
    engine.reportScore(Math.round(_score/2));
    engine.spawnConfetti();
    if(KZL.getLevel(GAME_ID)===_level&&_level<20){
      const nl=KZL.nextLevel(GAME_ID);
      setTimeout(()=>KZL.showLevelUp(GAME_ID,nl,lang),400);
    }
  }
}

function onNext(){
  document.getElementById('result-screen').classList.add('hidden');
  init(); startGame();
}

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

window.onload=()=>{init();};
</script>
</body>
</html>
