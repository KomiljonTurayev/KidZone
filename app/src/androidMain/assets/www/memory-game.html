<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Xotira O'yini 🧠</title>

<style>
/* ═══════════════════════════════════════════════════
   TABLET RESPONSIVE SYSTEM
   Phone  <600px  → 4 karta
   Tablet 600-900px→ 6 karta (portrait) / 8 karta (landscape)
   Tablet 900px+  → 8 karta / 12 karta (landscape)
═══════════════════════════════════════════════════ */
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }

:root {
  --cols: 4;
  --card-size: 80px;
  --font-emoji: 36px;
  --gap: 10px;
  --top-font: 14px;
  --btn-size: 52px;
}

/* PHONE */
@media (min-width: 480px) {
  :root { --cols:4; --card-size:90px; --font-emoji:40px; }
}

/* TABLET PORTRAIT */
@media (min-width: 600px) {
  :root { --cols:4; --card-size:110px; --font-emoji:50px; --gap:14px; --top-font:16px; --btn-size:60px; }
}
@media (min-width: 768px) {
  :root { --cols:4; --card-size:130px; --font-emoji:58px; --gap:16px; --top-font:18px; --btn-size:68px; }
}

/* TABLET LANDSCAPE */
@media (min-width: 600px) and (orientation: landscape) {
  :root { --cols:6; --card-size:100px; --font-emoji:44px; --gap:12px; }
}
@media (min-width: 900px) and (orientation: landscape) {
  :root { --cols:6; --card-size:120px; --font-emoji:52px; --gap:14px; }
}
@media (min-width: 1100px) {
  :root { --cols:6; --card-size:130px; --font-emoji:56px; --gap:16px; }
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}

/* ANIMATED PARTICLES */
#particles { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
.particle {
  position:absolute; border-radius:50%; opacity:0.08;
  animation: particleFloat ease-in-out infinite;
}
@keyframes particleFloat {
  0%,100% { transform: translateY(0) rotate(0deg); }
  33%      { transform: translateY(-20px) rotate(120deg); }
  66%      { transform: translateY(10px) rotate(240deg); }
}

/* APP LAYOUT */
#app {
  position: relative; z-index: 1;
  display: flex; flex-direction: column;
  align-items: center;
  min-height: 100vh; min-height: 100dvh;
  padding: 0 0 70px;
}

/* ── TOP BAR ── */
#topbar {
  width: 100%; max-width: 1100px;
  padding: 12px 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.stat-card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;
  padding: 8px 16px;
  text-align: center;
  min-width: 70px;
  flex-shrink: 0;
}
.stat-card .lbl { color: rgba(255,255,255,0.5); font-size: 10px; letter-spacing: 1.5px; }
.stat-card .val { color: white; font-size: var(--top-font); font-weight: 900; }

#level-info {
  background: linear-gradient(135deg, rgba(139,92,246,0.4), rgba(59,130,246,0.4));
  border: 1px solid rgba(139,92,246,0.5);
  border-radius: 18px;
  padding: 8px 20px;
  text-align: center;
  flex: 1;
  max-width: 300px;
}
#level-title { color: #C4B5FD; font-size: 11px; letter-spacing: 1px; }
#level-name  { color: white; font-size: var(--top-font); font-weight: 900; }

/* ORIENTATION WARNING (phone landscape) */
#rotate-hint {
  display: none;
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.9);
  color: white;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  font-size: 18px;
  text-align: center;
  padding: 30px;
}
#rotate-hint .big { font-size: 60px; animation: rotateAnim 2s ease-in-out infinite; }
@keyframes rotateAnim { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(90deg)} }
/* Only show on small landscape */
@media (max-width: 599px) and (orientation: landscape) {
  #rotate-hint { display: flex; }
}

/* DIFFICULTY SELECTOR */
#diff-bar {
  display: flex; gap: 8px;
  margin: 4px 0 8px;
  flex-wrap: wrap;
  justify-content: center;
  width: 100%; max-width: 1100px;
  padding: 0 16px;
}
.diff-btn {
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: 30px;
  padding: 7px 18px;
  font-size: 13px; font-weight: bold;
  cursor: pointer;
  transition: all 0.15s;
  color: rgba(255,255,255,0.6);
  background: rgba(255,255,255,0.06);
}
.diff-btn.active {
  color: white;
  border-color: transparent;
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.diff-btn:active { transform: scale(0.95); }

/* TIMER BAR */
#timer-wrap {
  width: 92%; max-width: 1000px;
  height: 8px;
  background: rgba(255,255,255,0.08);
  border-radius: 8px; overflow: hidden;
  margin: 0 auto 10px;
}
#timer-bar {
  height: 100%;
  background: linear-gradient(90deg, #8B5CF6, #3B82F6);
  border-radius: 8px;
  transition: width 0.3s ease, background 0.5s;
}

/* ── CARD GRID ── */
#grid-wrap {
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  flex: 1;
  padding: 0 12px;
}

#grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--card-size));
  gap: var(--gap);
}

/* ── MEMORY CARD ── */
.card {
  width: var(--card-size);
  height: var(--card-size);
  perspective: 600px;
  cursor: pointer;
}

.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 20px;
}
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.matched .card-inner { transform: rotateY(180deg); }

.card-front, .card-back {
  position: absolute; inset: 0;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
}

/* BACK (face down) */
.card-back {
  background: linear-gradient(135deg, #312e81, #1e40af);
  border: 2px solid rgba(255,255,255,0.12);
  box-shadow: 0 4px 16px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.1);
}
.card-back::before {
  content: "?";
  font-size: calc(var(--card-size) * 0.35);
  color: rgba(255,255,255,0.15);
  font-weight: 900;
}

/* FRONT (face up) */
.card-front {
  background: white;
  transform: rotateY(180deg);
  font-size: var(--font-emoji);
  box-shadow: 0 4px 20px rgba(0,0,0,0.2);
}

.card.matched .card-front {
  background: linear-gradient(135deg, #D1FAE5, #A7F3D0);
  box-shadow: 0 0 0 3px #10B981, 0 6px 20px rgba(16,185,129,0.3);
  animation: matchedPop 0.4s ease;
}
@keyframes matchedPop {
  0%,100% { transform: rotateY(180deg) scale(1); }
  50%      { transform: rotateY(180deg) scale(1.1); }
}

.card.wrong-flash .card-front {
  background: #FEE2E2;
  animation: wrongFlash 0.4s ease;
}
@keyframes wrongFlash {
  0%,100% { transform: rotateY(180deg) translateX(0); }
  25%      { transform: rotateY(180deg) translateX(-6px); }
  75%      { transform: rotateY(180deg) translateX(6px); }
}

/* TABLET-SPECIFIC: hover glow */
@media (hover:hover) {
  .card:not(.matched):hover .card-back {
    border-color: rgba(139,92,246,0.6);
    box-shadow: 0 0 0 2px rgba(139,92,246,0.4), 0 6px 20px rgba(0,0,0,0.3);
  }
}

/* SCREENS */
.screen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 24px;
  background: linear-gradient(135deg, #1a1a2e, #0f3460);
}
.hidden { display: none !important; }

.modal {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 32px;
  padding: 32px 28px;
  text-align: center;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
}

/* TABLET: bigger modal */
@media (min-width: 768px) {
  .modal { max-width: 520px; padding: 40px 36px; }
}

.big-icon { font-size: 72px; line-height: 1; margin-bottom: 8px; }
.modal-title { color: white; font-size: 28px; font-weight: 900; margin: 8px 0; }
.modal-sub   { color: rgba(255,255,255,0.6); font-size: 14px; line-height: 1.7; }

@media (min-width: 768px) {
  .modal-title { font-size: 34px; }
  .modal-sub   { font-size: 16px; }
}

.diff-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; margin-top: 14px;
}
.diff-card {
  border: none; border-radius: 20px;
  padding: 16px 10px;
  cursor: pointer; transition: transform 0.1s;
  color: white; font-weight: bold; font-size: 14px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.diff-card:active { transform: scale(0.95); }
.diff-card .dc-emoji  { font-size: 28px; }
.diff-card .dc-label  { font-size: 13px; }
.diff-card .dc-detail { font-size: 11px; opacity: 0.75; }

.play-btn {
  background: linear-gradient(135deg, #8B5CF6, #3B82F6);
  border: none; border-radius: 50px;
  padding: 18px 44px;
  color: white; font-size: 17px; font-weight: 900;
  cursor: pointer;
  box-shadow: 0 6px 24px rgba(139,92,246,0.4);
  transition: transform 0.1s;
  width: 100%; max-width: 300px;
}
.play-btn:active { transform: scale(0.96); }
.ghost-btn {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 50px; padding: 14px 36px;
  color: rgba(255,255,255,0.6); font-size: 14px;
  cursor: pointer; width: 100%; max-width: 300px;
}

/* RESULT STATS */
.result-grid {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 10px; margin: 16px 0;
}
.r-stat {
  background: rgba(255,255,255,0.07);
  border-radius: 18px; padding: 14px 8px; text-align: center;
}
.r-stat .big { color: white; font-size: 28px; font-weight: 900; }
.r-stat .lbl { color: rgba(255,255,255,0.4); font-size: 10px; letter-spacing: 1px; margin-top: 2px; }

/* STARS */
.stars { font-size: 36px; letter-spacing: 4px; margin: 6px 0; }

/* PARTICLES BURST */
.burst {
  position: fixed; pointer-events: none; z-index: 150;
  font-size: 28px;
  animation: burstAnim 0.9s ease-out forwards;
}
@keyframes burstAnim {
  0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
  100% { transform: translate(var(--bx), var(--by)) scale(1.2); opacity: 0; }
}

/* COMBO */
#combo-popup {
  position: fixed; top: 25%; left: 50%;
  transform: translateX(-50%);
  pointer-events: none; z-index: 120;
  font-size: 42px; font-weight: 900; color: #FBBF24;
  text-shadow: 0 0 20px rgba(251,191,36,0.6);
  animation: comboPop 0.7s ease-out forwards;
}
@keyframes comboPop {
  0%   { transform: translateX(-50%) scale(0.5); opacity:1; }
  60%  { transform: translateX(-50%) scale(1.2); opacity:1; }
  100% { transform: translateX(-50%) translateY(-50px) scale(1); opacity:0; }
}
</style>

<body>

<!-- PARTICLES BG -->
<div id="particles"></div>

<!-- ROTATE HINT (small landscape) -->
<div id="rotate-hint">
  <div class="big">📱</div>
  <div id="rotate-txt"></div>
</div>

<div id="app">
  <!-- TOP BAR -->
  <div id="topbar">
    <div class="stat-card">
      <div class="lbl" id="lbl-pairs"></div>
      <div class="val" id="pairs-val">0/0</div>
    </div>
    <div class="stat-card">
      <div class="lbl" id="lbl-score"></div>
      <div class="val" id="score-val">0</div>
    </div>
    <div id="level-info">
      <div id="level-title"></div>
      <div id="level-name"></div>
    </div>
    <div class="stat-card">
      <div class="lbl" id="lbl-tries"></div>
      <div class="val" id="tries-val">0</div>
    </div>
    <div class="stat-card">
      <div class="lbl" id="lbl-best"></div>
      <div class="val" id="best-val">0</div>
    </div>
  </div>

  <!-- TIMER -->
  <div id="timer-wrap"><div id="timer-bar" style="width:100%"></div></div>

  <!-- DIFFICULTY TABS -->
  <div id="diff-bar">
    <button class="diff-btn active" id="d-easy"   onclick="changeDiff('easy')"   style="background:linear-gradient(135deg,#10B981,#059669);border-color:transparent;color:white"></button>
    <button class="diff-btn"        id="d-medium" onclick="changeDiff('medium')" ></button>
    <button class="diff-btn"        id="d-hard"   onclick="changeDiff('hard')"   ></button>
    <button class="diff-btn"        id="d-tablet" onclick="changeDiff('tablet')" ></button>
  </div>

  <!-- GAME GRID -->
  <div id="grid-wrap">
    <div id="grid"></div>
  </div>
</div>

<!-- START SCREEN -->
<div class="screen" id="start-screen">
  <div class="modal">
    <div class="big-icon">🧠</div>
    <div class="modal-title" id="start-title"></div>
    <div class="modal-sub" id="start-sub"></div>
    <div class="diff-grid">
      <button class="diff-card" style="background:linear-gradient(135deg,#10B981,#059669)" onclick="startWithDiff('easy')">
        <span class="dc-emoji">🟢</span>
        <span class="dc-label" id="dc-easy"></span>
        <span class="dc-detail" id="dc-easy-d"></span>
      </button>
      <button class="diff-card" style="background:linear-gradient(135deg,#F59E0B,#D97706)" onclick="startWithDiff('medium')">
        <span class="dc-emoji">🟡</span>
        <span class="dc-label" id="dc-medium"></span>
        <span class="dc-detail" id="dc-medium-d"></span>
      </button>
      <button class="diff-card" style="background:linear-gradient(135deg,#EF4444,#DC2626)" onclick="startWithDiff('hard')">
        <span class="dc-emoji">🔴</span>
        <span class="dc-label" id="dc-hard"></span>
        <span class="dc-detail" id="dc-hard-d"></span>
      </button>
      <button class="diff-card" style="background:linear-gradient(135deg,#8B5CF6,#6D28D9)" onclick="startWithDiff('tablet')">
        <span class="dc-emoji">📱</span>
        <span class="dc-label" id="dc-tablet"></span>
        <span class="dc-detail" id="dc-tablet-d"></span>
      </button>
    </div>
  </div>
</div>

<!-- WIN SCREEN -->
<div class="screen hidden" id="win-screen">
  <div class="modal">
    <div class="big-icon" id="win-emoji">🏆</div>
    <div class="modal-title" id="win-title"></div>
    <div class="stars" id="win-stars">⭐⭐⭐</div>
    <div class="result-grid">
      <div class="r-stat">
        <div class="big" id="r-score">0</div>
        <div class="lbl" id="r-lbl-score"></div>
      </div>
      <div class="r-stat">
        <div class="big" id="r-time">0s</div>
        <div class="lbl" id="r-lbl-time"></div>
      </div>
      <div class="r-stat">
        <div class="big" id="r-tries">0</div>
        <div class="lbl" id="r-lbl-tries"></div>
      </div>
    </div>
    <div class="modal-sub" id="win-msg"></div>
  </div>
  <button class="play-btn" id="btn-restart" onclick="restartGame()"></button>
  <button class="ghost-btn" id="btn-home" onclick="goHome()"></button>
</div>

<script>
// ════════════════════════════════════════════════════════
// O'YIN KONFIGURATSIYASI
// ════════════════════════════════════════════════════════

const EMOJIS_POOL = [
  "🐶","🐱","🐸","🐮","🦁","🐧","🦊","🐰",
  "🌸","🌈","⭐","🎮","🍎","🍕","🚀","🎸",
  "🏆","🦋","🐠","🌙","🎨","🧩","🎯","🎪",
  "🦄","🐳","🌺","🎭","🍦","🎲"
];

const DIFFICULTY = {
  easy:   { pairs: 4,  time: 60,  cols: 4,  label: () => t.diffLabel.easy },
  medium: { pairs: 6,  time: 90,  cols: 4,  label: () => t.diffLabel.medium },
  hard:   { pairs: 8,  time: 120, cols: 4,  label: () => t.diffLabel.hard },
  tablet: { pairs: 10, time: 150, cols: 5,  label: () => t.diffLabel.tablet },
};

let diff = "easy";
let cards = [], flipped = [], matched = 0;
let tries = 0, score = 0, timeLeft = 60;
let canFlip = true, timerInterval = null, gameStarted = false;
let startTime = 0;
let best = parseInt(localStorage.getItem("memoBest") || "0");
let audioCtx = null;

document.getElementById("best-val").textContent = best;

// BUILD PARTICLES
(function() {
  const p = document.getElementById("particles");
  const colors = ["#8B5CF6","#3B82F6","#10B981","#F59E0B","#EF4444"];
  for (let i = 0; i < 15; i++) {
    const d = document.createElement("div");
    d.className = "particle";
    const size = 30 + Math.random() * 70;
    d.style.cssText = `
      width:${size}px;height:${size}px;
      left:${Math.random()*100}vw;top:${Math.random()*100}vh;
      background:${colors[i%colors.length]};
      animation-duration:${4+Math.random()*5}s;
      animation-delay:-${Math.random()*5}s;
    `;
    p.appendChild(d);
  }
})();

// AUDIO
function beep(freq, dur=0.15, type="sine") {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.2, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+dur);
    o.start(); o.stop(audioCtx.currentTime+dur);
  } catch(e) {}
}
const sndFlip   = ()  => beep(440, 0.1, "sine");
const sndMatch  = ()  => [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.18,"triangle"),i*60));
const sndWrong  = ()  => beep(200, 0.25, "sawtooth");
const sndWin    = ()  => [523,587,659,698,784,880,988,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.2,"triangle"),i*80));

// SHUFFLE
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// TABLET-AWARE COLUMN OVERRIDE
function getCols(pairsCount) {
  const w = window.innerWidth;
  const isLandscape = window.innerWidth > window.innerHeight;
  if (w >= 1100) return isLandscape ? 6 : 5;
  if (w >= 768)  return isLandscape ? 6 : 5;
  if (w >= 600)  return isLandscape ? 6 : 4;
  return 4;
}

function buildGrid(pairsCount) {
  const emojis = shuffle(EMOJIS_POOL).slice(0, pairsCount);
  const all    = shuffle([...emojis, ...emojis]);

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  const cols = getCols(pairsCount);
  grid.style.gridTemplateColumns = `repeat(${cols}, var(--card-size))`;

  cards = all.map((emoji, idx) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.emoji = emoji;
    card.dataset.idx   = idx;
    card.innerHTML = `
      <div class="card-inner">
        <div class="card-back"></div>
        <div class="card-front">${emoji}</div>
      </div>`;
    card.addEventListener("click", () => flipCard(card));
    grid.appendChild(card);
    return card;
  });
}

function flipCard(card) {
  if (!canFlip) return;
  if (card.classList.contains("flipped") || card.classList.contains("matched")) return;
  if (flipped.length >= 2) return;

  // Start timer on first flip
  if (!gameStarted) {
    gameStarted = true;
    startTime = Date.now();
    startTimer();
  }

  card.classList.add("flipped");
  flipped.push(card);
  sndFlip();

  if (flipped.length === 2) {
    tries++;
    document.getElementById("tries-val").textContent = tries;
    canFlip = false;
    setTimeout(checkMatch, 700);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  if (a.dataset.emoji === b.dataset.emoji) {
    // MATCH!
    a.classList.add("matched");
    b.classList.add("matched");
    matched++;
    // Score: more points for fewer tries
    const bonus = Math.max(1, 5 - Math.floor(tries / (DIFFICULTY[diff].pairs)));
    score += 10 * bonus;
    document.getElementById("score-val").textContent = score;
    document.getElementById("pairs-val").textContent = `${matched}/${DIFFICULTY[diff].pairs}`;
    sndMatch();
    burst(a);

    if (matched === DIFFICULTY[diff].pairs) {
      setTimeout(winGame, 500);
    }
  } else {
    // WRONG
    a.classList.add("wrong-flash");
    b.classList.add("wrong-flash");
    sndWrong();
    setTimeout(() => {
      a.classList.remove("flipped","wrong-flash");
      b.classList.remove("flipped","wrong-flash");
    }, 500);
  }
  flipped = [];
  canFlip = true;
}

function burst(card) {
  const rect = card.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top  + rect.height/2;
  const emojis = ["✨","⭐","💫","🌟"];
  for (let i = 0; i < 8; i++) {
    const el = document.createElement("div");
    el.className = "burst";
    el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    el.style.left = cx + "px";
    el.style.top  = cy + "px";
    const angle  = (i/8) * Math.PI*2;
    const dist   = 60 + Math.random()*50;
    el.style.setProperty("--bx", Math.cos(angle)*dist + "px");
    el.style.setProperty("--by", Math.sin(angle)*dist + "px");
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
}

function startTimer() {
  const cfg = DIFFICULTY[diff];
  timeLeft = cfg.time;
  clearInterval(timerInterval);
  const bar = document.getElementById("timer-bar");
  timerInterval = setInterval(() => {
    timeLeft -= 0.1;
    const pct = Math.max(0, (timeLeft/cfg.time)*100);
    bar.style.width = pct + "%";
    if (pct < 25) bar.style.background = "linear-gradient(90deg,#EF4444,#F59E0B)";
    else if (pct < 50) bar.style.background = "linear-gradient(90deg,#F59E0B,#FBBF24)";
    if (timeLeft <= 0) { clearInterval(timerInterval); timeOut(); }
  }, 100);
}

function timeOut() {
  // Reveal all cards briefly then show result
  cards.forEach(c => c.classList.add("flipped"));
  setTimeout(() => {
    showResult(false);
  }, 1000);
}

function winGame() {
  clearInterval(timerInterval);
  sndWin();
  showResult(true);
}

function showResult(won) {
  const elapsed = Math.round((Date.now() - startTime) / 1000);

  if (score > best) {
    best = score;
    localStorage.setItem("memoBest", best);
    document.getElementById("best-val").textContent = best;
  }

  // Stars
  const pct = matched / DIFFICULTY[diff].pairs;
  const stars = pct >= 1 ? "⭐⭐⭐" : pct >= 0.7 ? "⭐⭐" : "⭐";
  const emoji = pct >= 1 ? "🏆" : pct >= 0.5 ? "🎉" : "💪";
  const title = t.resultTitle(pct, elapsed);

  document.getElementById("win-emoji").textContent = emoji;
  document.getElementById("win-title").textContent = title;
  document.getElementById("win-stars").textContent = stars;
  document.getElementById("r-score").textContent   = score;
  document.getElementById("r-time").textContent    = elapsed + "s";
  document.getElementById("r-tries").textContent   = tries;
  document.getElementById("win-msg").textContent   = t.pairsFound(matched, DIFFICULTY[diff].pairs);

  // Update total points in the main app
  const currentTotal = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentTotal + Math.round(score / 4));

  // Update progress
  localStorage.setItem('kz-prog-memory', '100');

  document.getElementById("win-screen").classList.remove("hidden");
}

function changeDiff(d) {
  diff = d;
  ["easy","medium","hard","tablet"].forEach(x => {
    const btn = document.getElementById("d-"+x);
    btn.classList.remove("active");
    btn.style.background = "";
    btn.style.color = "";
    btn.style.borderColor = "";
  });
  const colors = { easy:"#10B981,#059669", medium:"#F59E0B,#D97706", hard:"#EF4444,#DC2626", tablet:"#8B5CF6,#6D28D9" };
  const btn = document.getElementById("d-"+d);
  btn.classList.add("active");
  btn.style.background = `linear-gradient(135deg,${colors[d]})`;
  btn.style.color = "white";
  btn.style.borderColor = "transparent";
  document.getElementById("level-name").textContent = DIFFICULTY[d].label();
  initGame();
}

function initGame() {
  clearInterval(timerInterval);
  flipped = []; matched = 0; tries = 0; score = 0; gameStarted = false;
  document.getElementById("score-val").textContent = "0";
  document.getElementById("tries-val").textContent = "0";
  document.getElementById("pairs-val").textContent = `0/${DIFFICULTY[diff].pairs}`;
  document.getElementById("timer-bar").style.width = "100%";
  document.getElementById("timer-bar").style.background = "linear-gradient(90deg,#8B5CF6,#3B82F6)";
  buildGrid(DIFFICULTY[diff].pairs);
}

function startWithDiff(d) {
  diff = d;
  document.getElementById("level-name").textContent = DIFFICULTY[d].label();
  document.getElementById("start-screen").classList.add("hidden");
  changeDiff(d);
  initGame();
  KZL.howToPlay({id:'memory-game', lang:lang,
    title: t.howTitle,
    steps: t.how,
    accentColor:'#8B5CF6'});
}

function restartGame() {
  document.getElementById("win-screen").classList.add("hidden");
  initGame();
}

function goHome() {
  clearInterval(timerInterval);
  document.getElementById("win-screen").classList.add("hidden");
  document.getElementById("start-screen").classList.remove("hidden");
}

// HANDLE RESIZE (orientation change)
window.addEventListener("resize", () => {
  if (gameStarted) return;
  const g = document.getElementById("grid");
  if (g.children.length > 0) {
    g.style.gridTemplateColumns = `repeat(${getCols(DIFFICULTY[diff].pairs)}, var(--card-size))`;
  }
});

// ── APPLY TRANSLATIONS ──
(function applyTranslations() {
  // Rotate hint
  document.getElementById("rotate-txt").innerHTML =
    t.rotateTxt.replace("\n", "<br>");

  // Top bar labels
  document.getElementById("lbl-pairs").textContent = t.pairs;
  document.getElementById("lbl-score").textContent = t.score;
  document.getElementById("level-title").textContent = t.level;
  document.getElementById("lbl-tries").textContent = t.tries;
  document.getElementById("lbl-best").textContent  = t.record;

  // Initial level name
  document.getElementById("level-name").textContent = t.diffLabel.easy;

  // Diff-bar tab buttons
  document.getElementById("d-easy").textContent   = t.diffEasy   + " (8)";
  document.getElementById("d-medium").textContent = t.diffMed    + " (12)";
  document.getElementById("d-hard").textContent   = t.diffHard   + " (16)";
  document.getElementById("d-tablet").textContent = t.diffTab    + " (20)";

  // Start screen
  document.getElementById("start-title").textContent = t.gameTitle;
  document.getElementById("start-sub").innerHTML =
    t.gameSub.replace("\n", "<br>");
  document.getElementById("dc-easy").textContent     = t.easy;
  document.getElementById("dc-easy-d").textContent   = t.easyDetail;
  document.getElementById("dc-medium").textContent   = t.medium;
  document.getElementById("dc-medium-d").textContent = t.medDetail;
  document.getElementById("dc-hard").textContent     = t.hard;
  document.getElementById("dc-hard-d").textContent   = t.hardDetail;
  document.getElementById("dc-tablet").textContent   = t.tablet;
  document.getElementById("dc-tablet-d").textContent = t.tabDetail;

  // Win screen static labels
  document.getElementById("r-lbl-score").textContent = t.score;
  document.getElementById("r-lbl-time").textContent  = t.timeLbl;
  document.getElementById("r-lbl-tries").textContent = t.tries;
  document.getElementById("btn-restart").textContent = t.restart;
  document.getElementById("btn-home").textContent    = t.home;
})();

// INIT
initGame();
</script>
</body>
</html>
