<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>O'zbek Alifbosi 🔤</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kz-ui.js"></script>
<script src="kids-ui.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; min-height:100dvh;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden; user-select: none;
  display: flex; flex-direction: column; align-items: center;
  color: white;
}
#topbar { width:100%; max-width:440px; padding:16px 20px 8px; display:flex; justify-content:space-between; align-items:center; }
.pill { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:20px; padding:8px 16px; text-align:center; min-width:72px; }
.pill-sm { font-size:10px; color:rgba(255,255,255,0.6); display:block; letter-spacing:1px; }
.pill-val { font-size:20px; font-weight:900; }
#title { font-size:17px; font-weight:900; }
#prog-wrap { width:88%; max-width:400px; height:7px; background:rgba(255,255,255,0.1); border-radius:4px; margin:4px auto 14px; }
#prog-bar { height:100%; background:linear-gradient(90deg,#FF6B35,#FF9F1C); border-radius:4px; transition:width 0.4s; width:0%; }
#q-card {
  background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.12);
  border-radius:28px; padding:24px 20px; width:90%; max-width:400px;
  text-align:center; margin-bottom:18px;
}
#q-emoji { font-size:74px; line-height:1; margin-bottom:10px; animation:float 3s ease-in-out infinite; }
@keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
#q-word { font-size:24px; font-weight:900; letter-spacing:3px; color:#FFD54F; margin-bottom:6px; }
#q-hint { font-size:13px; color:rgba(255,255,255,0.55); }
#answers { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:90%; max-width:400px; }
.ans-btn {
  background:rgba(255,255,255,0.09); border:2px solid rgba(255,255,255,0.18);
  border-radius:22px; padding:18px 10px; font-size:32px; font-weight:900;
  color:white; cursor:pointer; transition:transform 0.12s, background 0.15s;
  min-height:80px; display:flex; align-items:center; justify-content:center;
}
.ans-btn:active { transform:scale(0.91); }
.ans-btn.correct { background:rgba(76,175,80,0.45); border-color:#4CAF50; }
.ans-btn.wrong   { background:rgba(244,67,54,0.35); border-color:#F44336; }
/* Result overlay */
#result { position:fixed; inset:0; background:rgba(0,0,0,0.72); display:flex; align-items:center; justify-content:center; z-index:100; backdrop-filter:blur(4px); }
#result.h { display:none; }
#result-card { background:#1e1e3f; border:1px solid rgba(255,255,255,0.15); border-radius:28px; padding:32px 24px; text-align:center; width:min(320px,90vw); }
#result-em  { font-size:60px; margin-bottom:10px; }
#result-ttl { font-size:22px; font-weight:900; margin-bottom:6px; }
#result-sc  { font-size:15px; color:rgba(255,255,255,0.65); margin-bottom:20px; }
.btn-restart { background:linear-gradient(135deg,#FF6B35,#FF9F1C); border:none; border-radius:20px; padding:14px 32px; color:white; font-size:16px; font-weight:900; cursor:pointer; width:100%; }
.btn-restart:active { transform:scale(0.96); }
</style>
</head>
<body>

<div id="topbar">
  <div class="pill"><span class="pill-sm">BALL</span><span class="pill-val" id="score-val">0</span></div>
  <div id="title">🔤 Alifbo</div>
  <div class="pill"><span class="pill-sm">SAVOL</span><span class="pill-val" id="q-num">1/12</span></div>
</div>
<div id="prog-wrap"><div id="prog-bar"></div></div>

<div id="q-card">
  <div id="q-emoji">🍎</div>
  <div id="q-word">ALMA</div>
  <div id="q-hint">Qaysi harf bilan boshlanadi?</div>
</div>

<div id="answers">
  <button class="ans-btn" id="btn0" onclick="answer(0)"></button>
  <button class="ans-btn" id="btn1" onclick="answer(1)"></button>
  <button class="ans-btn" id="btn2" onclick="answer(2)"></button>
  <button class="ans-btn" id="btn3" onclick="answer(3)"></button>
</div>

<div id="result" class="h">
  <div id="result-card">
    <div id="result-em">🎉</div>
    <div id="result-ttl">Barakalla!</div>
    <div id="result-sc"></div>
    <button class="btn-restart" onclick="restart()">🔄 Qayta o'ynash</button>
  </div>
</div>

<script>
const WORDS = [
  {em:"🍎",word:"ALMA",   letter:"A"}, {em:"🐝",word:"ARI",    letter:"A"},
  {em:"🌲",word:"DARAXT", letter:"D"}, {em:"🐟",word:"BALIQ",  letter:"B"},
  {em:"🌺",word:"GUL",    letter:"G"}, {em:"🏠",word:"UY",     letter:"U"},
  {em:"🌙",word:"OY",     letter:"O"}, {em:"🐄",word:"MOL",    letter:"M"},
  {em:"🍇",word:"UZUM",   letter:"U"}, {em:"⭐",word:"YULDUZ", letter:"Y"},
  {em:"🐦",word:"QUSH",   letter:"Q"}, {em:"🐈",word:"MUSHUK", letter:"M"},
  {em:"🌊",word:"DENGIZ", letter:"D"}, {em:"🐘",word:"FIL",    letter:"F"},
  {em:"🍌",word:"BANAN",  letter:"B"}, {em:"🌸",word:"ATIRGUL",letter:"A"},
];
const LETTERS = ["A","B","D","E","F","G","H","I","J","K","L","M","N","O","P","Q","R","S","T","U","V","X","Y","Z"];
const TOTAL = 12;

let score = 0, qIdx = 0, answered = false, questions = [];

function shuffle(a) { return [...a].sort(()=>Math.random()-0.5); }

function buildQuestions() { questions = shuffle(WORDS).slice(0, TOTAL); }

function loadQ() {
  if (qIdx >= TOTAL) { showResult(); return; }
  answered = false;
  const q = questions[qIdx];
  document.getElementById("q-emoji").textContent = q.em;
  document.getElementById("q-word").textContent  = q.word;
  document.getElementById("q-num").textContent   = `${qIdx+1}/${TOTAL}`;
  document.getElementById("prog-bar").style.width = `${(qIdx/TOTAL)*100}%`;
  const wrong = shuffle(LETTERS.filter(l => l !== q.letter)).slice(0,3);
  shuffle([q.letter, ...wrong]).forEach((c,i) => {
    const b = document.getElementById("btn"+i);
    b.textContent = c; b.className = "ans-btn"; b.dataset.l = c;
  });
}

function answer(idx) {
  if (answered) return; answered = true;
  const q = questions[qIdx];
  const btn = document.getElementById("btn"+idx);
  if (btn.dataset.l === q.letter) {
    btn.classList.add("correct"); score += 10;
    document.getElementById("score-val").textContent = score;
    const prev = parseInt(localStorage.getItem("kz-prog-abc-uz")||"0");
    localStorage.setItem("kz-prog-abc-uz", Math.max(prev, Math.round((qIdx+1)/TOTAL*100)));
  } else {
    btn.classList.add("wrong");
    document.querySelectorAll(".ans-btn").forEach(b => { if(b.dataset.l===q.letter) b.classList.add("correct"); });
  }
  setTimeout(()=>{ qIdx++; loadQ(); }, 900);
}

function showResult() {
  const pct = score / (TOTAL*10) * 100;
  document.getElementById("result-em").textContent  = pct>=80?"🏆":pct>=50?"⭐":"💪";
  document.getElementById("result-ttl").textContent = pct>=80?"Ajoyib!":pct>=50?"Yaxshi!":"Harakat qiling!";
  document.getElementById("result-sc").textContent  = `Natija: ${score}/${TOTAL*10} ball`;
  document.getElementById("result").classList.remove("h");
  localStorage.setItem("kz-pts", (parseInt(localStorage.getItem("kz-pts")||"0")) + score);
}

function restart() {
  score = 0; qIdx = 0;
  document.getElementById("score-val").textContent = "0";
  document.getElementById("result").classList.add("h");
  buildQuestions(); loadQ();
}

KidUI.init({ title: "Uzbek ABC", icon: "🔤", color: "#FF5722", gameId: "abc_uz", lang: "uz" });
buildQuestions(); loadQ();
</script>
</body>
</html>
