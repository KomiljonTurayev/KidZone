<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Modern Jigsaw Puzzle 🧩</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kz-ui.js"></script>
<script src="kids-ui.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
  body {
    min-height: 100vh; min-height: 100dvh;
    background: radial-gradient(circle at 50% 10%, #E8EAFF 0%, #C7D2FE 100%);
    font-family: 'Arial Rounded MT Bold', 'Nunito', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 12px 10px; overflow: hidden;
  }

  /* Header */
  #header {
    width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.85); backdrop-filter: blur(10px);
    border-radius: 20px; padding: 8px 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.06);
  }
  .pill { font-size: 15px; font-weight: 900; color: #4F46E5; display: flex; align-items: center; gap: 6px; }
  .ctrl-btn {
    background: #EEF2FF; border: 2px solid #C7D2FE; border-radius: 12px;
    padding: 6px 12px; font-size: 14px; font-weight: 900; color: #4338CA;
    cursor: pointer; transition: transform 0.1s; display: flex; align-items: center; gap: 4px;
  }
  .ctrl-btn:active { transform: scale(0.94); }

  /* Theme selector bar */
  #theme-bar {
    display: flex; gap: 8px; width: 100%; max-width: 420px; overflow-x: auto; padding: 4px 2px;
    scrollbar-width: none;
  }
  #theme-bar::-webkit-scrollbar { display: none; }
  .theme-chip {
    background: white; border: 2px solid #E0E7FF; border-radius: 16px;
    padding: 6px 12px; font-size: 18px; cursor: pointer; white-space: nowrap;
    transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .theme-chip.active {
    background: #4F46E5; border-color: #4F46E5; transform: scale(1.08); box-shadow: 0 4px 12px rgba(79,70,229,0.3);
  }

  /* Puzzle Workspace */
  #workspace {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: 100%; max-width: 400px; gap: 12px;
  }

  /* Puzzle Target Board */
  #board-wrap {
    position: relative; width: 300px; height: 300px;
    background: white; border-radius: 28px; padding: 8px;
    box-shadow: 0 12px 30px rgba(79, 70, 229, 0.15), inset 0 0 0 4px rgba(79, 70, 229, 0.1);
  }
  #board {
    width: 100%; height: 100%; display: grid; gap: 4px;
    border-radius: 20px; overflow: hidden; position: relative;
    background: #F3F4F6;
  }
  .slot {
    background: rgba(79, 70, 229, 0.04); border: 2px dashed rgba(79, 70, 229, 0.2);
    border-radius: 12px; position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .slot.highlight {
    background: rgba(79, 70, 229, 0.15); border-color: #4F46E5; border-style: solid;
  }

  /* Ghost preview on board */
  #ghost-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 20px;
    opacity: 0.18; pointer-events: none; transition: opacity 0.3s;
  }

  /* Pieces Tray */
  #tray {
    width: 100%; min-height: 100px; background: rgba(255,255,255,0.75); backdrop-filter: blur(8px);
    border-radius: 24px; padding: 10px; display: flex; gap: 10px; align-items: center;
    justify-content: center; flex-wrap: wrap; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
  }

  /* Jigsaw Pieces */
  .piece {
    border-radius: 12px; cursor: grab; position: relative;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    transition: transform 0.15s, box-shadow 0.15s; z-index: 10;
  }
  .piece:active { cursor: grabbing; transform: scale(1.1); z-index: 50; }
  .piece.placed {
    cursor: default; box-shadow: none; border-radius: 10px;
    animation: snapPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes snapPop {
    0% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }

  /* Win Modal */
  #win-modal {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  #win-card {
    background: white; border-radius: 32px; padding: 32px 24px; width: 88%; max-width: 340px;
    text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    animation: modalPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes modalPop { 0% { transform: scale(0.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .win-btn {
    background: linear-gradient(135deg, #4F46E5, #7C3AED); color: white; border: none;
    border-radius: 22px; padding: 14px 32px; font-size: 17px; font-weight: 900;
    cursor: pointer; box-shadow: 0 6px 18px rgba(79, 70, 229, 0.4); margin-top: 20px;
    width: 100%;
  }
</style>
</head>
<body>

<div id="header">
  <div class="pill">🧩 <span id="ui-title">Jigsaw Puzzle</span></div>
  <div style="display: flex; gap: 8px;">
    <button class="ctrl-btn" onclick="toggleHint()">👁️ <span id="lbl-hint">Ko'rish</span></button>
    <button class="ctrl-btn" onclick="nextDifficulty()">⚡ <span id="lbl-diff">3×3</span></button>
  </div>
</div>

<div id="theme-bar">
  <div class="theme-chip active" onclick="selectTheme(0)">🦁 Shercha</div>
  <div class="theme-chip" onclick="selectTheme(1)">🦖 Dinozavr</div>
  <div class="theme-chip" onclick="selectTheme(2)">🚀 Raketa</div>
  <div class="theme-chip" onclick="selectTheme(3)">🐬 Delfin</div>
  <div class="theme-chip" onclick="selectTheme(4)">🏰 Qasr</div>
  <div class="theme-chip" onclick="selectTheme(5)">🚗 Mashina</div>
</div>

<div id="workspace">
  <div id="board-wrap">
    <canvas id="ghost-canvas"></canvas>
    <div id="board"></div>
  </div>

  <div id="tray"></div>
</div>

<div id="win-modal">
  <div id="win-card">
    <div style="font-size: 72px; margin-bottom: 8px;">🏆✨</div>
    <h2 id="win-title" style="font-size: 26px; color: #4338CA; margin-bottom: 6px;">Barakalla!</h2>
    <p id="win-sub" style="font-size: 15px; color: #6B7280;">Puzzle ajoyib terildi!</p>
    <button class="win-btn" onclick="nextPuzzle()">Keyingisi ➔</button>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const lang = urlParams.get('lang') || 'uz';
const T = {
  uz: { title: "Puzzle", hint: "Ko'rish", win: "Barakalla! 🏆", winSub: "Puzzle mukammal yig'ildi!", next: "Keyingisi ➔" },
  ru: { title: "Пазл", hint: "Подсказка", win: "Отлично! 🏆", winSub: "Пазл успешно собран!", next: "Дальше ➔" },
  en: { title: "Puzzle", hint: "Peek", win: "Awesome! 🏆", winSub: "Puzzle solved completely!", next: "Next ➔" }
}[lang] || { title: "Puzzle", hint: "Ko'rish", win: "Barakalla!", winSub: "Puzzle terildi!", next: "Keyingisi" };

document.getElementById('ui-title').textContent = T.title;
document.getElementById('lbl-hint').textContent = T.hint;
document.getElementById('win-title').textContent = T.win;
document.getElementById('win-sub').textContent = T.winSub;
document.querySelector('.win-btn').textContent = T.next;

// Web Audio synthesizer for piece snap
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function playSnapSound() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.setValueAtTime(520, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.09);
    osc.start(); osc.stop(audioCtx.currentTime + 0.1);
  } catch(e) {}
}

const THEMES = [
  { name: "Lion", bg: "#FDE68A", fg: "#B45309", em: "🦁", title: "Qirol Sher" },
  { name: "Dino", bg: "#A7F3D0", fg: "#047857", em: "🦖", title: "Dinozavr" },
  { name: "Rocket", bg: "#C7D2FE", fg: "#4338CA", em: "🚀", title: "Raketa" },
  { name: "Dolphin", bg: "#BAE6FD", fg: "#0369A1", em: "🐬", title: "Delfin" },
  { name: "Castle", bg: "#FBCFE8", fg: "#BE185D", em: "🏰", title: "Sehrli Qasr" },
  { name: "Car", bg: "#FED7AA", fg: "#C2410C", em: "🚗", title: "Quvnoq Mashina" },
];

let currentTheme = 0;
let gridN = 3; // 2, 3, or 4
let showHint = false;
let placedCount = 0;
let selectedPiece = null;

// Generate rich artwork on an offscreen canvas
function createArtworkCanvas(size, theme) {
  const c = document.createElement('canvas');
  c.width = size; c.height = size;
  const ctx = c.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, theme.bg);
  grad.addColorStop(1, '#ffffff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);

  // Decorative circles
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(size * 0.2, size * 0.25, size * 0.35, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(size * 0.85, size * 0.75, size * 0.3, 0, Math.PI * 2); ctx.fill();

  // Central Character Emoji
  ctx.font = (size * 0.52) + 'px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(theme.em, size / 2, size / 2 + 10);

  // Little accent stars
  ctx.font = (size * 0.12) + 'px sans-serif';
  ctx.fillText('⭐', size * 0.2, size * 0.2);
  ctx.fillText('✨', size * 0.8, size * 0.25);
  ctx.fillText('🌈', size * 0.5, size * 0.85);

  return c;
}

function initGame() {
  placedCount = 0;
  const theme = THEMES[currentTheme];
  const boardEl = document.getElementById('board');
  const trayEl = document.getElementById('tray');
  const ghostCanvas = document.getElementById('ghost-canvas');

  boardEl.innerHTML = '';
  trayEl.innerHTML = '';

  boardEl.style.gridTemplateColumns = 'repeat(' + gridN + ', 1fr)';
  const boardSize = 284; // 300px minus padding
  const tileSize = (boardSize - (gridN - 1) * 4) / gridN;

  // Render ghost reference preview
  const art = createArtworkCanvas(boardSize, theme);
  ghostCanvas.width = boardSize; ghostCanvas.height = boardSize;
  const gCtx = ghostCanvas.getContext('2d');
  gCtx.drawImage(art, 0, 0);

  // Create board target slots
  for (let r = 0; r < gridN; r++) {
    for (let c = 0; c < gridN; c++) {
      const slot = document.createElement('div');
      slot.className = 'slot';
      slot.dataset.r = r; slot.dataset.c = c;
      slot.onclick = () => onSlotClick(slot);
      boardEl.appendChild(slot);
    }
  }

  // Create pieces
  const pieces = [];
  for (let r = 0; r < gridN; r++) {
    for (let c = 0; c < gridN; c++) {
      const piece = document.createElement('canvas');
      piece.className = 'piece';
      piece.width = tileSize; piece.height = tileSize;
      piece.style.width = tileSize + 'px';
      piece.style.height = tileSize + 'px';
      piece.dataset.r = r; piece.dataset.c = c;

      const pCtx = piece.getContext('2d');
      // Crop corresponding tile from main artwork
      const sx = c * (art.width / gridN);
      const sy = r * (art.height / gridN);
      const sw = art.width / gridN;
      const sh = art.height / gridN;
      pCtx.drawImage(art, sx, sy, sw, sh, 0, 0, tileSize, tileSize);

      // Border outline on piece
      pCtx.strokeStyle = 'rgba(255,255,255,0.7)';
      pCtx.lineWidth = 3;
      pCtx.strokeRect(0, 0, tileSize, tileSize);

      piece.onclick = () => onPieceClick(piece);
      pieces.push(piece);
    }
  }

  // Shuffle pieces and add to tray
  pieces.sort(() => Math.random() - 0.5);
  pieces.forEach(p => trayEl.appendChild(p));
}

function onPieceClick(piece) {
  if (piece.classList.contains('placed')) return;
  if (selectedPiece) selectedPiece.style.transform = '';
  selectedPiece = piece;
  piece.style.transform = 'scale(1.15)';
  piece.style.boxShadow = '0 0 16px #4F46E5';
}

function onSlotClick(slot) {
  if (!selectedPiece) return;
  if (slot.children.length > 0) return; // already has piece

  const pr = selectedPiece.dataset.r;
  const pc = selectedPiece.dataset.c;
  const sr = slot.dataset.r;
  const sc = slot.dataset.c;

  if (pr === sr && pc === sc) {
    // CORRECT SNAP!
    playSnapSound();
    if (navigator.vibrate) navigator.vibrate(20);

    selectedPiece.style.transform = '';
    selectedPiece.style.boxShadow = '';
    selectedPiece.classList.add('placed');
    slot.appendChild(selectedPiece);
    selectedPiece = null;

    placedCount++;
    if (placedCount === gridN * gridN) {
      // VICTORY!
      if (window.KZL && KZL.spawnConfetti) KZL.spawnConfetti();
      setTimeout(() => {
        document.getElementById('win-modal').style.display = 'flex';
      }, 400);
    }
  } else {
    // Wrong slot animation
    slot.style.backgroundColor = '#FEE2E2';
    setTimeout(() => slot.style.backgroundColor = '', 300);
  }
}

function toggleHint() {
  showHint = !showHint;
  document.getElementById('ghost-canvas').style.opacity = showHint ? '0.65' : '0.18';
}

function nextDifficulty() {
  gridN = gridN === 2 ? 3 : gridN === 3 ? 4 : 2;
  document.getElementById('lbl-diff').textContent = gridN + '×' + gridN;
  initGame();
}

function selectTheme(idx) {
  currentTheme = idx;
  document.querySelectorAll('.theme-chip').forEach((c, i) => c.classList.toggle('active', i === idx));
  initGame();
}

function nextPuzzle() {
  document.getElementById('win-modal').style.display = 'none';
  currentTheme = (currentTheme + 1) % THEMES.length;
  document.querySelectorAll('.theme-chip').forEach((c, i) => c.classList.toggle('active', i === currentTheme));
  initGame();
}

window.onload = initGame;
</script>
</body>
</html>
