<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Glow Magic Draw ✨</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kz-ui.js"></script>
<script src="kids-ui.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; touch-action:none; user-select:none; }
  body { min-height: 100vh; background: #000; overflow: hidden; display: flex; flex-direction: column; }
  canvas { flex: 1; width: 100vw; display: block; }
  #toolbar {
    height: 70px; background: rgba(20,20,30,0.9); display: flex; align-items: center;
    justify-content: space-around; padding: 10px; z-index: 10;
  }
  .c-dot { width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid white; }
  .btn-clear { background: #E91E63; color: white; border: none; border-radius: 16px; padding: 10px 18px; font-weight: 900; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="toolbar">
  <div class="c-dot" style="background:#FF0055; box-shadow:0 0 10px #FF0055;" onclick="setColor('#FF0055')"></div>
  <div class="c-dot" style="background:#00F0FF; box-shadow:0 0 10px #00F0FF;" onclick="setColor('#00F0FF')"></div>
  <div class="c-dot" style="background:#FFE600; box-shadow:0 0 10px #FFE600;" onclick="setColor('#FFE600')"></div>
  <div class="c-dot" style="background:#00FF66; box-shadow:0 0 10px #00FF66;" onclick="setColor('#00FF66')"></div>
  <button class="btn-clear" onclick="clearCanvas()">🗑️ Tozalash</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight - 70; }
window.onresize = resize; resize();

let isDrawing = false, lastX = 0, lastY = 0, color = '#00F0FF';

function setColor(c) { color = c; }
function clearCanvas() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

canvas.addEventListener('pointerdown', e => {
  isDrawing = true;
  lastX = e.clientX; lastY = e.clientY;
});
canvas.addEventListener('pointermove', e => {
  if (!isDrawing) return;
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(e.clientX, e.clientY);
  ctx.strokeStyle = color;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.shadowColor = color;
  ctx.shadowBlur = 16;
  ctx.stroke();
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener('pointerup', () => isDrawing = false);
</script>
</body>
</html>
