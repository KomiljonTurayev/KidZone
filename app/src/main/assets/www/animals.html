<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Animal World 🐾</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height: 100vh;
  background: linear-gradient(180deg, #87CEEB 0%, #B0E2FF 60%, #90EE90 60%, #228B22 100%);
  font-family: 'Arial Rounded MT Bold', 'Nunito', Arial, sans-serif;
  overflow: hidden; user-select: none;
}
#app { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-bottom: 20px; }
#topbar { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 0; }
.score-pill { background: rgba(255,255,255,0.9); border-radius: 30px; padding: 8px 18px; display: flex; align-items: center; gap: 6px; box-shadow: 0 3px 12px rgba(0,0,0,0.15); }
.score-pill b { font-size: 18px; color: #5B21B6; }
#title-box { background: rgba(255,255,255,0.95); border-radius: 20px; padding: 8px 20px; text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,0.15); }
#title-box h1 { font-size: 18px; color: #4C1D95; }
#question-card { background: rgba(255,255,255,0.95); border-radius: 28px; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.15); margin-bottom: 14px; text-align: center; width: 90%; max-width: 400px; }
#animal-display { font-size: 80px; animation: bounce 2s infinite; cursor: pointer; display: inline-block; }
@keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
#choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; max-width: 480px; padding: 0 16px; }
.choice-btn { background: white; border: 3px solid transparent; border-radius: 22px; padding: 14px 8px; font-size: 40px; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; gap: 6px; }
.choice-btn .name { font-size: 13px; font-weight: bold; color: #4C1D95; }
.correct { background: #D1FAE5 !important; border-color: #10B981 !important; }
.wrong { background: #FEE2E2 !important; border-color: #EF4444 !important; }
.screen { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #7C3AED; color: white; padding: 20px; text-align: center; }
.hidden { display: none !important; }
.btn-p { background: white; color: #7C3AED; border: none; border-radius: 50px; padding: 18px 44px; font-size: 18px; font-weight: 900; cursor: pointer; margin-top: 20px; }
#progress-wrap { display: flex; gap: 5px; margin-top: 10px; }
.dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.3); }
.dot.ok { background: #10B981; }
.dot.no { background: #EF4444; }
</style>
</head>
<body>

<div id="app">
  <div id="topbar">
    <div class="score-pill"><span>⭐</span><b id="score">0</b></div>
    <div id="title-box"><h1 id="ui-title">Animal World</h1></div>
    <div class="score-pill"><span>🏆</span><b id="best">0</b></div>
  </div>
  <div id="progress-wrap"></div>
  <div style="height: 20px;"></div>
  <div id="question-card">
    <div id="ui-quest" style="color:#7C3AED; font-weight:bold; margin-bottom:10px;">Which animal?</div>
    <div id="animal-display" onclick="playSound()">🐶</div>
    <div id="animal-sound" style="font-size: 20px; font-weight: 900; margin-top: 10px;">Vov-vov!</div>
    <div id="ui-hint" style="font-size: 12px; color: #666;">Tap animal to hear sound</div>
  </div>
  <div id="choices"></div>
</div>

<div id="start-screen" class="screen">
  <h1 id="ui-start-t">Animal World</h1>
  <p id="ui-start-d">Learn animal names and sounds!</p>
  <button class="btn-p" onclick="start()">START GAME</button>
</div>

<div id="result-screen" class="screen hidden">
  <h1 id="ui-res-t">Great Job!</h1>
  <div id="ui-res-s" style="font-size: 24px; margin: 20px 0;">Score: 100</div>
  <button class="btn-p" onclick="start()">PLAY AGAIN</button>
</div>

<script>
const ANIMALS = [
  { id:"dog", emoji:"🐶", sounds:{en:"Woof!", uz:"Vov-vov!", ru:"Гав!"}, names:{en:"Dog", uz:"Kuchuk", ru:"Собака"}, freq:400 },
  { id:"cat", emoji:"🐱", sounds:{en:"Meow!", uz:"Miyov!", ru:"Мяу!"}, names:{en:"Cat", uz:"Mushuk", ru:"Кошка"}, freq:600 },
  { id:"cow", emoji:"🐮", sounds:{en:"Moo!", uz:"Ma-a!", ru:"Му-у!"}, names:{en:"Cow", uz:"Sigir", ru:"Корова"}, freq:200 },
  { id:"lion", emoji:"🦁", sounds:{en:"Roar!", uz:"Rrrr!", ru:"Ррр!"}, names:{en:"Lion", uz:"Sher", ru:"Лев"}, freq:150 }
];

const T = {
  en: { title:"Animal World", quest:"Which animal?", hint:"Tap animal to hear sound", start:"START GAME", desc:"Learn names and sounds!", great:"Great Job!", score:"Score", again:"PLAY AGAIN" },
  uz: { title:"Hayvonlar Olami", quest:"Qaysi hayvon?", hint:"Ovozni eshitish uchun bosing", start:"BOSHLASH", desc:"Nomlar va ovozlarni o'rganing!", great:"Ajoyib!", score:"Ball", again:"QAYTA O'YNASH" },
  ru: { title:"Мир Животных", quest:"Кто это?", hint:"Нажми, чтобы услышать", start:"ИГРАТЬ", desc:"Учи имена и звуки!", great:"Молодец!", score:"Счет", again:"ЕЩЕ РАЗ" }
};

let lang = new URLSearchParams(window.location.search).get('lang') || 'en';
let score = 0, current = null, qNum = 0, total = 5;

function updateUI() {
  const t = T[lang];
  document.getElementById('ui-title').textContent = t.title;
  document.getElementById('ui-quest').textContent = t.quest;
  document.getElementById('ui-hint').textContent = t.hint;
  document.getElementById('ui-start-t').textContent = t.title;
  document.getElementById('ui-start-d').textContent = t.desc;
  document.querySelector('#start-screen .btn-p').textContent = t.start;
  document.getElementById('ui-res-t').textContent = t.great;
  document.querySelector('#result-screen .btn-p').textContent = t.again;
}

function playSound() {
  if (!current) return;
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = current.freq;
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
  osc.start(); osc.stop(ctx.currentTime + 0.5);
}

function next() {
  if (qNum >= total) {
    document.getElementById('ui-res-s').textContent = `${T[lang].score}: ${score}`;
    document.getElementById('result-screen').classList.remove('hidden');
    return;
  }
  const pool = [...ANIMALS].sort(() => Math.random() - 0.5);
  current = pool[0];
  const options = pool.slice(0, 4).sort(() => Math.random() - 0.5);

  document.getElementById('animal-display').textContent = current.emoji;
  document.getElementById('animal-sound').textContent = current.sounds[lang];

  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  options.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span>${a.emoji}</span><span class="name">${a.names[lang]}</span>`;
    btn.onclick = () => {
      if (a.id === current.id) {
        btn.classList.add('correct'); score += 20;
        document.getElementById('score').textContent = score;
        setTimeout(next, 800);
      } else {
        btn.classList.add('wrong');
      }
    };
    grid.appendChild(btn);
  });
  qNum++;
}

function start() {
  score = 0; qNum = 0;
  document.getElementById('score').textContent = "0";
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  next();
}

window.onload = () => {
  updateUI();
  // Android integration
  if (window.AndroidAdMob) window.AndroidAdMob.showInterstitial();
};
</script>
</body>
</html>
