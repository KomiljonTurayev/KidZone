<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title id="page-title">Animal World 🐾</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kids-ui.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; min-height:100dvh;
  background: linear-gradient(180deg, #87CEEB 0%, #B0E2FF 55%, #90EE90 55%, #228B22 100%);
  font-family: 'Arial Rounded MT Bold','Nunito',Arial,sans-serif;
  overflow:hidden; user-select:none;
}
#app { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; min-height:100vh; padding-bottom:20px; }
#topbar { width:100%; max-width:480px; display:flex; justify-content:space-between; align-items:center; padding:12px 16px 0; gap:8px; }
.pill { background:rgba(255,255,255,0.92); border-radius:20px; padding:7px 14px; display:flex; align-items:center; gap:5px; box-shadow:0 3px 12px rgba(0,0,0,.13); font-weight:900; color:#5B21B6; font-size:15px; }
.pill-sm { font-size:9px; color:#888; display:block; text-align:center; }
#title-box { background:rgba(255,255,255,.95); border-radius:18px; padding:7px 16px; font-size:16px; font-weight:900; color:#4C1D95; box-shadow:0 3px 12px rgba(0,0,0,.12); }
#q-card { background:rgba(255,255,255,.95); border-radius:28px; padding:18px 16px; box-shadow:0 8px 32px rgba(0,0,0,.13); margin:14px 0; text-align:center; width:92%; max-width:420px; }
#animal-display { font-size:84px; animation:bounce 2s infinite; cursor:pointer; display:inline-block; line-height:1; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
#animal-sound { font-size:18px; font-weight:900; margin-top:6px; color:#5B21B6; }
#ui-hint { font-size:12px; color:#888; margin-top:4px; }
#tools-row { display:flex; align-items:center; gap:10px; width:92%; max-width:420px; margin-bottom:8px; }
#choices { display:grid; gap:11px; width:92%; max-width:420px; }
.choice-btn { background:#fff; border:3px solid transparent; border-radius:22px; padding:13px 8px; font-size:36px; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,.09); display:flex; flex-direction:column; align-items:center; gap:5px; transition:transform .1s; }
.choice-btn:active { transform:scale(.92); }
.choice-btn .name { font-size:12px; font-weight:900; color:#4C1D95; }
.correct { background:#D1FAE5!important; border-color:#10B981!important; }
.wrong   { background:#FEE2E2!important; border-color:#EF4444!important; }
#progress-row { display:flex; gap:4px; margin-top:6px; flex-wrap:wrap; justify-content:center; }
.dot { width:11px; height:11px; border-radius:50%; background:rgba(0,0,0,.12); }
.dot.ok { background:#10B981; }
.dot.no { background:#EF4444; }
.screen { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#7C3AED; color:#fff; padding:24px; text-align:center; }
.hidden { display:none!important; }
.btn-p { background:#fff; color:#7C3AED; border:none; border-radius:50px; padding:16px 40px; font-size:17px; font-weight:900; cursor:pointer; margin-top:18px; font-family:'Arial Rounded MT Bold',Arial,sans-serif; }
.btn-p:active { transform:scale(.95); }
#timer-wrap { position:relative; display:inline-flex; align-items:center; justify-content:center; }
#timer-svg { transform:rotate(-90deg); }
.t-bg { fill:none; stroke:rgba(255,255,255,.25); stroke-width:4; }
.t-fg { fill:none; stroke:#FFD600; stroke-width:4; stroke-linecap:round; transition:stroke-dashoffset .9s linear; }
#timer-txt { position:absolute; font-size:12px; font-weight:900; color:#FFD600; }
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="pill">⭐<span id="score">0</span></div>
    <div id="title-box"><span id="ui-title">Animal World</span></div>
    <div class="pill" style="flex-direction:column;padding:5px 10px;">
      <span class="pill-sm" id="lv-lbl">LEVEL</span>
      <span id="lv-val">1</span>
    </div>
  </div>
  <div id="progress-row"></div>
  <div style="height:10px;"></div>
  <div id="q-card">
    <div id="ui-quest" style="color:#7C3AED;font-weight:900;margin-bottom:8px;font-size:15px;"></div>
    <div id="animal-display" onclick="playAnimalSound()">🐶</div>
    <div id="animal-sound"></div>
    <div id="ui-hint"></div>
  </div>
  <div id="tools-row">
    <div id="timer-wrap" style="display:none;">
      <svg id="timer-svg" width="44" height="44" viewBox="0 0 44 44">
        <circle class="t-bg" cx="22" cy="22" r="18"/>
        <circle class="t-fg" cx="22" cy="22" r="18" id="t-fg" style="stroke-dasharray:113.1;stroke-dashoffset:0;"/>
      </svg>
      <span id="timer-txt">30</span>
    </div>
    <div id="hint-slot"></div>
    <div id="lives-slot"></div>
  </div>
  <div id="choices"></div>
</div>

<div id="start-screen" class="screen">
  <div style="font-size:80px;">🐾</div>
  <h1 id="ui-start-t" style="font-size:28px;margin:12px 0 8px;">Animal World</h1>
  <p id="ui-start-d" style="font-size:15px;opacity:.85;">Learn animal names and sounds!</p>
  <div id="level-info" style="background:rgba(255,255,255,.15);border-radius:16px;padding:10px 20px;margin:14px 0;font-size:14px;font-weight:900;"></div>
  <button class="btn-p" onclick="startGame()">START</button>
  <button class="btn-p" id="btn-levels" style="background:rgba(255,255,255,.2);color:#fff;margin-top:8px;font-size:14px;" onclick="showAllLevels()">📊 Darajalar</button>
</div>

<div id="result-screen" class="screen hidden">
  <div id="res-em" style="font-size:72px;">🏆</div>
  <h1 id="ui-res-t" style="font-size:24px;margin:10px 0 6px;"></h1>
  <div id="res-score" style="font-size:28px;font-weight:900;margin-bottom:6px;"></div>
  <div id="res-stars" style="font-size:32px;margin-bottom:16px;"></div>
  <button class="btn-p" id="btn-next" onclick="onNext()"></button>
  <button class="btn-p" style="background:rgba(255,255,255,.2);color:#fff;margin-top:8px;" onclick="restartLevel()"></button>
</div>

<div id="levels-screen" class="screen hidden">
  <h2 id="ui-all-levels" style="margin-bottom:16px;">📊 Barcha Darajalar</h2>
  <div id="levels-grid" style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%;max-width:360px;"></div>
  <button class="btn-p" id="btn-close-levels" style="margin-top:20px;" onclick="hideLevels()">✕ Yopish</button>
</div>

<script src="kz-ui.js"></script>
<script src="game-engine.js"></script>
<script>
/* ════════════ DATA: 30 animals (easy → expert) ════════════ */

  {id:"dolphin",   em:"🐬", snd:{uz:"Eeee!",    ru:"Эки!",    en:"Squeak!"},  nm:{uz:"Delfin",     ru:"Дельфин",    en:"Dolphin"},   f:1200},
  {id:"snake",     em:"🐍", snd:{uz:"Sss!",     ru:"Шш!",     en:"Hiss!"},    nm:{uz:"Ilon",       ru:"Змея",       en:"Snake"},     f:80},
  {id:"wolf",      em:"🐺", snd:{uz:"Uvv!",     ru:"Ааву!",   en:"Howl!"},    nm:{uz:"Bo'ri",      ru:"Волк",       en:"Wolf"},      f:220},
  {id:"owl",       em:"🦉", snd:{uz:"Hu-hu!",   ru:"Ху-ху!",  en:"Hoot!"},    nm:{uz:"Boyo'g'li", ru:"Сова",        en:"Owl"},       f:650},
  /* 23-30 Expert */
  {id:"tiger",     em:"🐯", snd:{uz:"Rrrrr!",   ru:"Ррр!",    en:"Roar!"},    nm:{uz:"Yo'lbars",   ru:"Тигр",       en:"Tiger"},     f:160},
  {id:"gorilla",   em:"🦍", snd:{uz:"Ugh!",     ru:"Ух!",     en:"Ugh!"},     nm:{uz:"Gorilla",    ru:"Горилла",    en:"Gorilla"},   f:140},
  {id:"flamingo",  em:"🦩", snd:{uz:"Gunk!",    ru:"Гунк!",   en:"Honk!"},    nm:{uz:"Flamingo",   ru:"Фламинго",   en:"Flamingo"},  f:480},
  {id:"kangaroo",  em:"🦘", snd:{uz:"Tss!",     ru:"Тс!",     en:"Tss!"},     nm:{uz:"Kenguru",    ru:"Кенгуру",    en:"Kangaroo"},  f:430},
  {id:"parrot",    em:"🦜", snd:{uz:"Polly!",   ru:"Поли!",   en:"Polly!"},   nm:{uz:"To'tiqush",  ru:"Попугай",    en:"Parrot"},    f:1100},
  {id:"hedgehog",  em:"🦔", snd:{uz:"Sniff!",   ru:"Сниф!",   en:"Sniff!"},   nm:{uz:"Kirpi",      ru:"Ёж",         en:"Hedgehog"},  f:750},
  {id:"camel",     em:"🐪", snd:{uz:"Grrn!",    ru:"Гр-р!",   en:"Groan!"},   nm:{uz:"Tuya",       ru:"Верблюд",    en:"Camel"},     f:190},
  {id:"panda",     em:"🐼", snd:{uz:"Mmmm!",    ru:"Мм!",     en:"Hmm!"},     nm:{uz:"Panda",      ru:"Панда",      en:"Panda"},     f:320},
];

/* ════════════ TRANSLATIONS ════════════ */
const T = {
  uz:{title:"Hayvonlar 🐾", quest:"Bu qaysi hayvon?", hint:"Ovoz eshitish uchun bosing", start:"BOSHLASH", desc:"Hayvon nomlarini va ovozlarini o'rgan!", great:"Zo'r!", good:"Yaxshi!", tryAgain:"Harakat qil!", again:"QAYTA", next:"KEYINGI DARAJA →", lvLbl:"DARAJA", lvInfo:"ta savol • ", levels:"📊 Darajalar", allLevels:"📊 Barcha Darajalar", close:"✕ Yopish"},
  ru:{title:"Животные 🐾",  quest:"Кто это?",          hint:"Нажми, чтобы услышать",     start:"ИГРАТЬ",   desc:"Учи имена и звуки животных!",           great:"Отлично!", good:"Хорошо!", tryAgain:"Ещё раз!",    again:"ЕЩЁ",    next:"СЛЕДУЮЩИЙ УРОВЕНЬ →", lvLbl:"УРОВЕНЬ",lvInfo:"вопросов • ", levels:"📊 Уровни", allLevels:"📊 Все уровни", close:"✕ Закрыть"},
  en:{title:"Animals 🐾",   quest:"Which animal?",     hint:"Tap to hear the sound",      start:"START",    desc:"Learn animal names and sounds!",          great:"Amazing!", good:"Good job!",tryAgain:"Try again!",  again:"AGAIN",  next:"NEXT LEVEL →",       lvLbl:"LEVEL",  lvInfo:"questions • ", levels:"📊 Levels", allLevels:"📊 All Levels", close:"✕ Close"},
};

/* ════════════ STATE ════════════ */
const engine = new KidZoneGame({ id:'animals' });
const lang = engine.lang;
KidUI.init({ title: "Animals", icon: "🐾", color: "#00897B", gameId: "animals", lang: lang });
const t = T[lang] || T.en;
const GAME_ID = 'animals';

let level, cfg, pool, questions, qIdx, score, combo, answered, hintsObj, livesObj, timerObj;

function init() {
  level = KZL.getLevel(GAME_ID);
  cfg   = KZL.cfg(GAME_ID);
  pool  = KZL.slicePool(ANIMALS, level);

  // Apply lang
  document.title = t.title;
  document.getElementById('ui-title').textContent        = t.title;
  document.getElementById('ui-start-t').textContent      = t.title;
  document.getElementById('ui-start-d').textContent      = t.desc;
  document.getElementById('ui-quest').textContent        = t.quest;
  document.getElementById('ui-hint').textContent         = t.hint;
  document.getElementById('lv-val').textContent          = level;
  document.getElementById('lv-lbl').textContent          = t.lvLbl;
  document.getElementById('btn-levels').textContent      = t.levels;
  document.getElementById('ui-all-levels').textContent   = t.allLevels;
  document.getElementById('btn-close-levels').textContent = t.close;

  // Level info on start screen
  const hintsText = cfg.hints > 0 ? `💡${cfg.hints}` : '';
  const timerText = cfg.timer > 0 ? `⏱${cfg.timer}s` : '';
  document.getElementById('level-info').textContent =
    `${cfg.stars}  ${t.lvInfo}${cfg.q}  ${hintsText}  ${timerText}  🐾${pool.length}`;

  // Result buttons
  const btnNext   = document.getElementById('btn-next');
  const btnReplay = btnNext.nextElementSibling;
  btnNext.textContent   = level < 20 ? t.next : t.again;
  btnReplay.textContent = t.again;

  // How-to-play
  KZL.howToPlay({
    id: GAME_ID,
    steps: {
      uz:[
        {icon:'🐾', text:'Hayvon rasmini ko\'ring va ovozini eshiting'},
        {icon:'👆', text:'4 ta variant orasidan to\'g\'risini tanlang'},
        {icon:'💡', text:'Hint — bitta noto\'g\'ri variantni olib tashlaydi'},
        {icon:'❤️', text:'3 ta hayot — hammasi tugasa o\'yin tugaydi'},
        {icon:'⏱',  text:'Yuqori darajalarda vaqt cheklovi paydo bo\'ladi'},
        {icon:'🏆', text:'Barcha savolni to\'g\'ri yechib keyingi darajaga o\'ting!'},
      ],
      ru:[
        {icon:'🐾', text:'Смотри на картинку животного и слушай звук'},
        {icon:'👆', text:'Выбери правильный ответ из 4 вариантов'},
        {icon:'💡', text:'Подсказка убирает один неверный вариант'},
        {icon:'❤️', text:'3 жизни — при потере всех игра заканчивается'},
        {icon:'⏱',  text:'На высоких уровнях появляется таймер'},
        {icon:'🏆', text:'Ответь на все вопросы и перейди на следующий уровень!'},
      ],
      en:[
        {icon:'🐾', text:'Look at the animal and tap to hear its sound'},
        {icon:'👆', text:'Choose the correct answer from 4 options'},
        {icon:'💡', text:'Hint removes one wrong answer option'},
        {icon:'❤️', text:'3 lives — lose all and game over'},
        {icon:'⏱',  text:'Higher levels have a countdown timer'},
        {icon:'🏆', text:'Answer all questions correctly to advance!'},
      ],
    }
  });
  buildLevelsGrid();
}

/* ════════════ GAME LOGIC ════════════ */
function startGame() {
  level = KZL.getLevel(GAME_ID);
  cfg   = KZL.cfg(GAME_ID);
  pool  = KZL.slicePool(ANIMALS, level);

  questions = shuffle(pool).slice(0, cfg.q);
  qIdx = 0; score = 0; combo = 0; answered = false;

  // Grid columns
  document.getElementById('choices').style.gridTemplateColumns =
    cfg.c <= 2 ? '1fr 1fr' : '1fr 1fr';

  // Tools
  const toolsRow = document.getElementById('tools-row');
  const timerWrap = document.getElementById('timer-wrap');
  toolsRow.innerHTML = '';
  toolsRow.appendChild(timerWrap);

  // Timer
  if (cfg.timer > 0) {
    timerWrap.style.display = 'flex';
    if (timerObj) clearInterval(timerObj);
  } else {
    timerWrap.style.display = 'none';
  }

  // Hint
  hintsObj = KZL.createHints(cfg.hints);
  hintsObj.el.onclick = () => {
    if (answered) return;
    hintsObj.use(() => {
      // remove one wrong answer
      const btns = document.querySelectorAll('.choice-btn:not(.correct):not(.wrong)');
      const wrongs = [...btns].filter(b => b.dataset.correct === '0');
      if (wrongs.length > 0) {
        const rm = wrongs[Math.floor(Math.random() * wrongs.length)];
        rm.style.opacity = '0.2';
        rm.style.pointerEvents = 'none';
      }
    });
  };
  toolsRow.appendChild(hintsObj.el);

  // Lives
  livesObj = KZL.createLives(3);
  toolsRow.appendChild(livesObj.el);

  // Progress dots
  buildDots();

  document.getElementById('score').textContent = '0';
  document.getElementById('lv-val').textContent = level;

  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('levels-screen').classList.add('hidden');
  loadQ();
}

function buildDots() {
  const row = document.getElementById('progress-row');
  row.innerHTML = '';
  for (let i = 0; i < cfg.q; i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    d.id = 'dot' + i;
    row.appendChild(d);
  }
}

let currentAnimal = null;

function loadQ() {
  if (qIdx >= questions.length) { showResult(); return; }
  answered = false;
  currentAnimal = questions[qIdx];

  document.getElementById('animal-display').textContent = currentAnimal.em;
  document.getElementById('animal-sound').textContent   = currentAnimal.snd[lang] || '';
  document.getElementById('ui-quest').textContent       = t.quest;

  // reset hint opacity
  document.querySelectorAll('.choice-btn').forEach(b => {
    b.style.opacity = '1';
    b.style.pointerEvents = '';
  });

  // Build choices
  const allWrong = pool.filter(a => a.id !== currentAnimal.id);
  const wrong    = shuffle(allWrong).slice(0, cfg.c - 1);
  const options  = shuffle([currentAnimal, ...wrong]);

  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  options.forEach(a => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.dataset.correct = a.id === currentAnimal.id ? '1' : '0';
    btn.innerHTML = `<span style="font-size:36px;">${a.em}</span><span class="name">${a.nm[lang] || a.nm.en}</span>`;
    btn.onclick = () => pick(btn, a);
    grid.appendChild(btn);
  });

  // Timer
  if (cfg.timer > 0) {
    if (timerObj) timerObj.stop();
    const C = 2 * Math.PI * 18;
    const fg = document.getElementById('t-fg');
    const tx = document.getElementById('timer-txt');
    let rem = cfg.timer;
    if (fg) { fg.style.strokeDasharray = C; fg.style.strokeDashoffset = 0; }
    if (tx) tx.textContent = rem;
    timerObj = setInterval(() => {
      rem--;
      if (fg) fg.style.strokeDashoffset = C * (1 - rem / cfg.timer);
      if (tx) tx.textContent = rem;
      if (rem <= 0) {
        clearInterval(timerObj);
        if (!answered) {
          answered = true;
          combo = 0;
          document.getElementById('dot' + qIdx).classList.add('no');
          const dead = livesObj.lose();
          engine.playSound('mismatch');
          document.querySelectorAll('.choice-btn[data-correct="1"]').forEach(b => b.classList.add('correct'));
          setTimeout(() => {
            qIdx++;
            if (dead) { showResult(); } else { loadQ(); }
          }, 900);
        }
      }
    }, 1000);
  }
}

function pick(btn, animal) {
  if (answered) return;
  answered = true;
  if (timerObj) clearInterval(timerObj);

  if (animal.id === currentAnimal.id) {
    btn.classList.add('correct');
    combo++;
    const pts = 10 + (combo >= 3 ? 5 : 0);
    score += pts;
    document.getElementById('score').textContent = score;
    document.getElementById('dot' + qIdx).classList.add('ok');
    engine.playSound('match');
    engine.vibrate(30);
  } else {
    btn.classList.add('wrong');
    combo = 0;
    document.getElementById('dot' + qIdx).classList.add('no');
    document.querySelectorAll('.choice-btn[data-correct="1"]').forEach(b => b.classList.add('correct'));
    const dead = livesObj.lose();
    engine.playSound('mismatch');
    if (dead) { setTimeout(showResult, 900); return; }
  }
  setTimeout(() => { qIdx++; loadQ(); }, 900);
}

function playAnimalSound() {
  if (!currentAnimal) return;
  engine._ensureAudioCtx();
  const ctx = engine.audioCtx;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain); gain.connect(ctx.destination);
  osc.frequency.value = currentAnimal.f;
  gain.gain.setValueAtTime(0.25, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
  osc.start(); osc.stop(ctx.currentTime + 0.5);
}

/* ════════════ RESULT ════════════ */
function showResult() {
  if (timerObj) clearInterval(timerObj);
  const maxScore = cfg.q * 10;
  const pct = score / maxScore;
  const passed = pct >= 0.6;

  document.getElementById('res-em').textContent    = pct >= 0.8 ? '🏆' : pct >= 0.6 ? '⭐' : '💪';
  document.getElementById('ui-res-t').textContent  = pct >= 0.8 ? t.great : pct >= 0.6 ? t.good : t.tryAgain;
  document.getElementById('res-score').textContent = score + ' / ' + maxScore;
  document.getElementById('res-stars').textContent = cfg.stars;

  const btnNext = document.getElementById('btn-next');
  const showNext = passed && level < 20;
  btnNext.textContent = showNext ? t.next : t.again;
  btnNext.style.display = showNext ? '' : 'none';

  if (passed) {
    engine.spawnConfetti();
    engine.reportScore(Math.round(score / 2));
    const savedLevel = KZL.getLevel(GAME_ID);
    if (savedLevel === level && level < 20) {
      setTimeout(() => {
        const nl = KZL.nextLevel(GAME_ID);
        KZL.showLevelUp(GAME_ID, nl, lang, () => {
          document.getElementById('result-screen').classList.remove('hidden');
        });
      }, 400);
      return;
    }
  }
  document.getElementById('result-screen').classList.remove('hidden');
}

function onNext() {
  if (KZL.getLevel(GAME_ID) > level) {
    level = KZL.getLevel(GAME_ID);
  } else if (KZL.cfg(GAME_ID).q === cfg.q) {
    // didn't pass — restart same level
  }
  document.getElementById('result-screen').classList.add('hidden');
  init();
  startGame();
}

function restartLevel() {
  document.getElementById('result-screen').classList.add('hidden');
  startGame();
}

/* ════════════ LEVELS GRID ════════════ */
function buildLevelsGrid() {
  const grid = document.getElementById('levels-grid');
  grid.innerHTML = '';
  const current = KZL.getLevel(GAME_ID);
  KZL.CONFIGS.forEach(c => {
    const div = document.createElement('div');
    div.style.cssText = `background:${c.n <= current ? 'rgba(255,255,255,.25)' : 'rgba(0,0,0,.2)'};border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;font-size:11px;font-weight:900;color:#fff;`;
    div.innerHTML = `<div style="font-size:18px;">${c.n <= current ? c.stars : '🔒'}</div><div>${c.n}</div>`;
    if (c.n <= current) div.onclick = () => { KZL.setLevel(GAME_ID, c.n); hideLevels(); startGame(); };
    grid.appendChild(div);
  });
}

function showAllLevels() { buildLevelsGrid(); document.getElementById('levels-screen').classList.remove('hidden'); }
function hideLevels()    { document.getElementById('levels-screen').classList.add('hidden'); }
function shuffle(a)       { return [...a].sort(() => Math.random() - 0.5); }

window.onload = () => { init(); };
</script>
