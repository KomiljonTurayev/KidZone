<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Maze 🌀</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height:100vh; background:#2c3e50;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:15px; display:flex; justify-content:space-between; color:white; }
.pill { background:rgba(255,255,255,0.1); border-radius:20px; padding:8px 16px; font-weight:bold; }
#maze-container {
  position:relative; background:#ecf0f1; border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,0.3); margin-top:10px;
}
.cell { position:absolute; border:2px solid #bdc3c7; }
.wall { background:#34495e; border:none; }
#player {
  position:absolute; font-size:24px; display:flex; align-items:center; justify-content:center;
  transition:all 0.1s ease; z-index:5;
}
#goal {
  position:absolute; font-size:24px; display:flex; align-items:center; justify-content:center;
  z-index:4;
}
#controls {
  margin-top:20px; display:grid; grid-template-columns:repeat(3, 70px); gap:10px;
}
.btn {
  width:70px; height:70px; background:white; border:none; border-radius:15px;
  font-size:30px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 0 #ddd; cursor:pointer;
}
.btn:active { transform:translateY(4px); box-shadow:none; }
#btn-up { grid-column:2; }
#btn-left { grid-column:1; }
#btn-down { grid-column:2; }
#btn-right { grid-column:3; }

/* Level-up overlay */
#level-up {
  position:fixed; inset:0; background:rgba(0,0,0,0.65);
  display:flex; align-items:center; justify-content:center; z-index:100;
  backdrop-filter:blur(4px);
}
#level-up.h { display:none; }
#level-up-card {
  background:linear-gradient(135deg,#2c3e50,#3498db);
  border:1px solid rgba(255,255,255,0.25);
  border-radius:28px; padding:36px 28px;
  text-align:center; width:min(280px,85vw); color:white;
}
#level-up-em   { font-size:64px; margin-bottom:10px; }
#level-up-msg  { font-size:22px; font-weight:900; margin-bottom:6px; }
#level-up-sub  { font-size:15px; color:rgba(255,255,255,0.75); margin-bottom:24px; }
#btn-next {
  background:rgba(255,255,255,0.25); border:2px solid rgba(255,255,255,0.4);
  border-radius:20px; padding:14px 32px; color:white;
  font-size:16px; font-weight:900; cursor:pointer; width:100%;
}
#btn-next:active { transform:scale(0.96); }
</style>
</head>
<body>

<div id="topbar">
  <div class="pill" id="lbl-title">🌀 LABIRINT</div>
  <div class="pill"><span id="lbl-level">DARAJA</span>: <span id="lvl">1</span></div>
</div>

<div id="maze-container">
  <div id="goal">🧀</div>
  <div id="player">🐭</div>
</div>

<div id="controls">
  <button class="btn" id="btn-up"    onclick="move(0,-1)">🔼</button>
  <button class="btn" id="btn-left"  onclick="move(-1,0)">◀️</button>
  <button class="btn" id="btn-down"  onclick="move(0,1)">🔽</button>
  <button class="btn" id="btn-right" onclick="move(1,0)">▶️</button>
</div>

<!-- Custom level-up overlay (replaces alert) -->
<div id="level-up" class="h">
  <div id="level-up-card">
    <div id="level-up-em">🏆</div>
    <div id="level-up-msg">Barakalla!</div>
    <div id="level-up-sub">Keyingi daraja: <span id="next-lvl">2</span></div>
    <button id="btn-next" onclick="continueGame()">▶️ Davom</button>
  </div>
</div>

<script src="kz-ui.js"></script>
<script src="game-engine.js"></script>
<script>
const game = new KidZoneGame({ id: 'maze' });
const lang = game.lang;

const T = {
  uz: {
    title:"🌀 LABIRINT", level:"DARAJA",
    congrats:"Barakalla!",  nextLvl:"Keyingi daraja:",  next:"▶️ Davom",
  },
  ru: {
    title:"🌀 ЛАБИРИНТ", level:"УРОВЕНЬ",
    congrats:"Молодец!",    nextLvl:"Следующий уровень:", next:"▶️ Далее",
  },
  en: {
    title:"🌀 MAZE",     level:"LEVEL",
    congrats:"Well done!", nextLvl:"Next level:",        next:"▶️ Continue",
  },
};

const t = T[lang] || T.en;

function applyLang() {
  document.getElementById('lbl-title').textContent   = t.title;
  document.getElementById('lbl-level').textContent   = t.level;
  document.getElementById('level-up-msg').textContent = t.congrats;
  document.getElementById('btn-next').textContent    = t.next;
}

const MAZE_ID = 'maze';
let level = KZL.getLevel(MAZE_ID);
// Maze size grows with level: 8→10→12→14
function mazeSize(lv){ return 8 + Math.min(6, Math.floor((lv-1)/4)*2); }
let size = mazeSize(level);
let cellSize = Math.min(window.innerWidth - 40, 400) / size;
let playerPos = { x: 0, y: 0 };
let goalPos   = { x: size - 1, y: size - 1 };
let walls = [];

function init() {
  const container = document.getElementById('maze-container');
  container.style.width  = (size * cellSize) + 'px';
  container.style.height = (size * cellSize) + 'px';
  goalPos = { x: size-1, y: size-1 };
  document.getElementById('lvl').textContent = level;
  generateMaze();
  draw();
}

function generateMaze() {
  walls = [];
  const density = Math.min(0.50, 0.22 + (level - 1) * 0.015);
  for (let i = 0; i < size * size * density; i++) {
    const wx = Math.floor(Math.random() * size);
    const wy = Math.floor(Math.random() * size);
    if ((wx === 0 && wy === 0) || (wx === size - 1 && wy === size - 1)) continue;
    walls.push({ x: wx, y: wy });
  }
}

function draw() {
  const container = document.getElementById('maze-container');
  container.querySelectorAll('.wall').forEach(w => w.remove());
  walls.forEach(w => {
    const wall = document.createElement('div');
    wall.className = 'cell wall';
    wall.style.cssText = `width:${cellSize}px;height:${cellSize}px;left:${w.x * cellSize}px;top:${w.y * cellSize}px`;
    container.appendChild(wall);
  });
  const p = document.getElementById('player');
  p.style.cssText = `width:${cellSize}px;height:${cellSize}px;left:${playerPos.x * cellSize}px;top:${playerPos.y * cellSize}px;position:absolute;font-size:24px;display:flex;align-items:center;justify-content:center;transition:all 0.1s ease;z-index:5`;
  const g = document.getElementById('goal');
  g.style.cssText = `width:${cellSize}px;height:${cellSize}px;left:${goalPos.x * cellSize}px;top:${goalPos.y * cellSize}px;position:absolute;font-size:24px;display:flex;align-items:center;justify-content:center;z-index:4`;
}

function move(dx, dy) {
  const nx = playerPos.x + dx;
  const ny = playerPos.y + dy;
  if (nx < 0 || nx >= size || ny < 0 || ny >= size) return;
  if (walls.find(w => w.x === nx && w.y === ny)) return;

  playerPos.x = nx;
  playerPos.y = ny;
  draw();

  if (nx === goalPos.x && ny === goalPos.y) {
    level = KZL.nextLevel(MAZE_ID);
    size = mazeSize(level);
    cellSize = Math.min(window.innerWidth - 40, 400) / size;
    document.getElementById('lvl').textContent = level;
    // Resize maze container
    const container = document.getElementById('maze-container');
    container.style.width  = (size * cellSize) + 'px';
    container.style.height = (size * cellSize) + 'px';
    goalPos = { x: size-1, y: size-1 };
    showLevelUp();
  }
}

function showLevelUp() {
  document.getElementById('level-up-em').textContent  = level % 3 === 0 ? "🏆" : "⭐";
  document.getElementById('level-up-msg').textContent = t.congrats;
  document.getElementById('level-up-sub').textContent = `${t.nextLvl} ${level}`;
  document.getElementById('next-lvl').textContent     = level;
  document.getElementById('level-up').classList.remove('h');
}

function continueGame() {
  document.getElementById('level-up').classList.add('h');
  playerPos = { x: 0, y: 0 };
  generateMaze();
  draw();
}

window.addEventListener('keydown', (e) => {
  const map = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
  if (map[e.key]) { e.preventDefault(); move(...map[e.key]); }
});

window.addEventListener('beforeunload', () => {
  const cur = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', cur + (level * 5));
  localStorage.setItem('kz-prog-maze', '100');
});

applyLang();
init();
</script>
<script>
(function(){
  const b=document.createElement('button');
  b.textContent='←';
  Object.assign(b.style,{position:'fixed',top:'10px',left:'10px',zIndex:'50',
    background:'rgba(255,255,255,.3)',border:'none',borderRadius:'50%',
    width:'38px',height:'38px',fontSize:'18px',cursor:'pointer',color:'#333'});
  b.onclick=()=>history.back();
  document.body.appendChild(b);
  const _L=navigator.language.startsWith('ru')?'ru':navigator.language.startsWith('en')?'en':'uz';
  const _H={
    uz:["Labirintdan chiqish yo'lini toping","O'q tugmalar yoki suring harakat qilish","Devorga tegmang — yo'ldan adashmaslik","Tez va kam harakatda chiqsangiz — yaxshiroq","Har daraja qiyinroq labirint! 🌿"],
    ru:["Найдите выход из лабиринта","Стрелки или свайп для движения","Не касайтесь стен — не сбивайтесь с пути","Быстрее и меньше ходов — лучше","Каждый уровень сложнее! 🌿"],
    en:["Find the exit of the maze","Arrow keys or swipe to move","Don't touch walls — stay on path","Faster and fewer moves = better score","Each level has a harder maze! 🌿"],
  };
  KZL.howToPlay({id:'maze',lang:_L,
    title:_L==='ru'?'Как играть?':_L==='en'?'How to play?':'Qanday o\'ynash?',
    steps:_H[_L]||_H['uz'],accentColor:'#27AE60'});
})();
</script>
</body>
</html>
