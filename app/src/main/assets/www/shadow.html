<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Soya Topish 👤</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background:#ECEFF1;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:20px; display:flex; justify-content:space-between; align-items:center; }
.pill { background:white; border-radius:20px; padding:8px 16px; font-weight:900; color:#37474F; }

#game-card {
  background:white; border-radius:32px; padding:30px 20px; width:90%; max-width:400px;
  text-align:center; margin-top:20px; box-shadow:0 15px 35px rgba(0,0,0,0.05);
}
#shadow-viz {
  font-size:120px; filter:brightness(0); opacity:0.8; margin-bottom:20px;
}
#q-text { font-size:24px; font-weight:900; color:#333; }

#choices { display:grid; grid-template-columns:1fr 1fr; gap:15px; width:90%; max-width:400px; margin-top:30px; }
.ans-btn {
  background:white; border:none; border-radius:22px; padding:20px;
  font-size:40px; cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,0.08); transition:transform 0.1s;
}
.ans-btn:active { transform:scale(0.92); }
.correct { background:#10B981 !important; }
.wrong { background:#EF4444 !important; }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">👤 SOYA TOPISH</div>
  <div class="pill">BALL: <span id="score">0</span></div>
</div>

<div id="game-card">
  <div id="shadow-viz">🐱</div>
  <div id="q-text">Bu kimning soyasi?</div>
</div>

<div id="choices"></div>

<script>
const DATA = ["🐱","🐶","🦁","🐘","🐸","🐧","🦒","🐢","🚀","🚗","🚁","🚢"];

let score = 0, current = "";

function next() {
  current = DATA[Math.floor(Math.random() * DATA.length)];
  document.getElementById('shadow-viz').textContent = current;

  const options = [current];
  while(options.length < 4) {
    const r = DATA[Math.floor(Math.random() * DATA.length)];
    if(!options.includes(r)) options.push(r);
  }

  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = opt;
    btn.onclick = () => {
      if(opt === current) {
        btn.classList.add('correct');
        score += 10;
        document.getElementById('score').textContent = score;
        setTimeout(next, 800);
      } else {
        btn.classList.add('wrong');
      }
    };
    grid.appendChild(btn);
  });
}

next();

window.addEventListener('beforeunload', () => {
  localStorage.setItem('kz-prog-shadow', '100');
});
</script>
</body>
</html>
