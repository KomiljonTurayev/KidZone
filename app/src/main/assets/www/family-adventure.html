<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Family Adventure - KidZone</title>
    <link rel="stylesheet" href="kids-theme.css">
    <script src="kz-ui.js"></script>
    <script src="kids-ui.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Fredoka+One&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Nunito', sans-serif; background: #87CEEB; }
        #ui { position: absolute; inset: 0; pointer-events: none; }
        .btn { pointer-events: auto; background: rgba(255,255,255,0.8); border: 4px solid #fff; border-radius: 50%; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; font-size: 32px; box-shadow: 0 4px 0 rgba(0,0,0,0.1); }
        #controls-child { position: absolute; bottom: 20px; left: 20px; display: flex; gap: 20px; }
        #controls-parent { position: absolute; bottom: 20px; right: 20px; }
        #parent-btn { background: #FF6B35; color: white; width: 100px; height: 100px; font-size: 40px; }
        #score-box { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: white; padding: 10px 20px; border-radius: 20px; font-family: 'Fredoka One'; font-size: 24px; color: #FF6B35; }
        canvas { display: block; }
        #msg { position: absolute; top: 100px; width: 100%; text-align: center; color: white; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="ui">
        <div id="score-box"><span id="score-label"></span><span id="score">0</span></div>
        <div id="msg"></div>
        <div id="controls-child">
            <div class="btn" id="btn-left">⬅️</div>
            <div class="btn" id="btn-right">➡️</div>
            <div class="btn" id="btn-jump">🆙</div>
        </div>
        <div id="controls-parent">
            <div class="btn" id="parent-btn">🌉</div>
        </div>
    </div>

    <script src="game-engine.js"></script>
    <script>
        const lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('kz-lang') || 'en';
        KidUI.init({ title: "Family Adventure", icon: "🌈", color: "#FF6D00", gameId: "family_adv", lang: lang });

        const T = {
            uz: {
                title:       'Oilaviy Sarguzasht',
                instruction: 'Bola: Harakat qil & Sakra! | Ota-ona: Ko\'prik qurish uchun ushlab tur! 🌈',
                scoreLabel:  'Yulduzlar: ',
                levelLabel:  ' | Daraja ',
                youWin:      'G\'alabа! 🎉',
                gameOver:    'O\'yin tugadi!',
                levelComplete: 'Daraja tugallandi! ⭐',
            },
            ru: {
                title:       'Семейное приключение',
                instruction: 'Ребенок: Двигайся и прыгай! | Родитель: Держи, чтобы построить мост! 🌈',
                scoreLabel:  'Звёзды: ',
                levelLabel:  ' | Ур. ',
                youWin:      'Победа! 🎉',
                gameOver:    'Игра окончена!',
                levelComplete: 'Уровень пройден! ⭐',
            },
            en: {
                title:       'Family Adventure',
                instruction: 'Child: Move & Jump! | Parent: Hold to Build Bridge! 🌈',
                scoreLabel:  'Stars: ',
                levelLabel:  ' | LV',
                youWin:      'You Win! 🎉',
                gameOver:    'Game Over!',
                levelComplete: 'Level Complete! ⭐',
            },
        };

        const t = T[lang] || T.en;

        document.title = t.title + ' - KidZone';
        document.getElementById('msg').textContent = t.instruction;
        document.getElementById('score-label').textContent = t.scoreLabel;

        const game = new KidZoneGame({ id: 'family-adventure' });
        const FA_ID = 'family-adventure';
        let _faLevel = KZL.getLevel(FA_ID);
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        function starsForLevel(lv){ return 1 + Math.floor((lv-1)/4); }
        function speedForLevel(lv){ return 4 + Math.min(4, Math.floor((lv-1)/3)); }

        function makePlatforms(lv){
          const base=[{x:0,y:0.85,w:0.35},{x:0.4,y:0.72,w:0.2},{x:0.7,y:0.85,w:0.3}];
          if(lv>=5) base.push({x:0.15,y:0.6,w:0.18});
          if(lv>=9) base.push({x:0.55,y:0.55,w:0.15},{x:0.82,y:0.65,w:0.14});
          return base;
        }

        function makeStars(lv){
          const n=starsForLevel(lv);
          const arr=[];
          for(let i=0;i<n;i++) arr.push({x:0.2+i*0.6/n,y:0.45+Math.random()*0.15,collected:false});
          return arr;
        }

        const player = { x: 100, y: 0, vx: 0, vy: 0, r: 25, color: '#FFD700', jumping: false };
        let platforms = makePlatforms(_faLevel);
        let stars = makeStars(_faLevel);
        let bridge = { active: false, x: 0, y: 0, w: 0 };
        let score = 0;

        function updateFaBadge(){
          document.getElementById('score').textContent = score + t.levelLabel + _faLevel;
        }
        updateFaBadge();

        // Input state
        const keys = {};
        document.getElementById('btn-left').ontouchstart = () => keys.left = true;
        document.getElementById('btn-left').ontouchend = () => keys.left = false;
        document.getElementById('btn-right').ontouchstart = () => keys.right = true;
        document.getElementById('btn-right').ontouchend = () => keys.right = false;
        document.getElementById('btn-jump').ontouchstart = () => { if (!player.jumping) { player.vy = -15; player.jumping = true; } };

        document.getElementById('parent-btn').ontouchstart = () => bridge.active = true;
        document.getElementById('parent-btn').ontouchend = () => bridge.active = false;

        function update() {
            // Player movement
            const spd = speedForLevel(_faLevel);
            if (keys.left) player.vx = -spd;
            else if (keys.right) player.vx = spd;
            else player.vx *= 0.8;

            player.vy += 0.8; // Gravity
            player.x += player.vx;
            player.y += player.vy;

            // Collision with platforms
            let onGround = false;
            platforms.forEach(p => {
                const px = p.x * width;
                const py = p.y * height;
                const pw = p.w * width;
                if (player.x > px && player.x < px + pw && player.y + player.r > py && player.y + player.r < py + 20 && player.vy >= 0) {
                    player.y = py - player.r;
                    player.vy = 0;
                    onGround = true;
                }
            });

            // Collision with bridge
            if (bridge.active) {
                const bx = player.x - 50;
                const by = player.y + player.r;
                const bw = 100;
                if (player.y + player.r > by && player.y + player.r < by + 10 && player.vy >= 0) {
                    player.y = by - player.r;
                    player.vy = 0;
                    onGround = true;
                }
            }

            player.jumping = !onGround;

            // Bounds
            if (player.x < player.r) player.x = player.r;
            if (player.x > width - player.r) player.x = width - player.r;
            if (player.y > height) {
                player.x = 100; player.y = 0; player.vy = 0; // Reset
            }

            // Stars
            stars.forEach(s => {
                const sx = s.x * width;
                const sy = s.y * height;
                const dx = player.x - sx;
                const dy = player.y - sy;
                if (!s.collected && Math.sqrt(dx*dx + dy*dy) < 40) {
                    s.collected = true;
                    score += 10;
                    game.reportScore(1);
                    updateFaBadge();
                    if(stars.every(st=>st.collected)){
                      _faLevel = KZL.nextLevel(FA_ID);
                      platforms = makePlatforms(_faLevel);
                      stars = makeStars(_faLevel);
                      player.x=100; player.y=0; player.vy=0;
                      updateFaBadge();
                    }
                }
            });
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);

            // Ground
            ctx.fillStyle = '#4CAF50';
            platforms.forEach(p => {
                ctx.fillRect(p.x * width, p.y * height, p.w * width, height);
            });

            // Bridge
            if (bridge.active) {
                ctx.fillStyle = 'rgba(255, 107, 53, 0.8)';
                ctx.fillRect(player.x - 50, player.y + player.r, 100, 10);
                ctx.strokeStyle = 'white';
                ctx.setLineDash([5, 5]);
                ctx.strokeRect(player.x - 50, player.y + player.r, 100, 10);
                ctx.setLineDash([]);
            }

            // Player
            ctx.fillStyle = player.color;
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = 'black';
            ctx.beginPath(); ctx.arc(player.x - 8, player.y - 5, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(player.x + 8, player.y - 5, 3, 0, Math.PI * 2); ctx.fill();

            // Stars
            stars.forEach(s => {
                if (!s.collected) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = '30px serif';
                    ctx.fillText('⭐', s.x * width - 15, s.y * height + 10);
                }
            });

            requestAnimationFrame(() => { update(); draw(); });
        }
        draw();
    </script>
<script>
(function(){
  const _L=navigator.language.startsWith('ru')?'ru':navigator.language.startsWith('en')?'en':'uz';
  const _H={
    uz:["Qahramonni boshqaring va yulduzlarni yig'ing","O'ng va chapga bosib yuring","To'siqlardan o'ting va g'animlardan qoching","Ko'proq yulduz — ko'proq ball","Barcha yulduzlarni to'plang va g'alaba qiling! ⭐"],
    ru:["Управляйте героем и собирайте звёзды","Нажимайте влево и вправо для движения","Обходите препятствия и врагов","Больше звёзд — больше очков","Собери все звёзды и победи! ⭐"],
    en:["Control the hero and collect stars","Tap left and right to move","Avoid obstacles and enemies","More stars = more points","Collect all stars to win! ⭐"],
  };
  KZL.howToPlay({id:'family-adventure',lang:_L,
    title:_L==='ru'?'Как играть?':_L==='en'?'How to play?':'Qanday o\'ynash?',
    steps:_H[_L]||_H['uz'],accentColor:'#FF6B35'});
})();
</script>
</body>
</html>
