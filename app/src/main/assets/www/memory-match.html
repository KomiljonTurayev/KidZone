<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title id="page-title">Memory Match</title>
    <link rel="stylesheet" href="kids-theme.css">
    <script src="kids-ui.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #87CEEB 0%, #5F9EA0 100%);
            font-family: 'Nunito', sans-serif;
            color: #333;
        }
        #game-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 35px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 90%;
            box-sizing: border-box;
        }
        #game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 4 columns */
            gap: 10px;
            margin-top: 20px;
            perspective: 1000px; /* For 3D flip effect */
        }
        .card {
            width: 80px; /* Adjust size as needed */
            height: 80px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 3em;
            cursor: pointer;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .card.flipped {
            transform: rotateY(180deg);
        }
        .card .front, .card .back {
            position: absolute;
            backface-visibility: hidden;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            border: 2px solid #fff;
        }
        .card .front {
            background: #fff;
            transform: rotateY(180deg);
        }
        .card .back {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #fff;
        }
        .card.matched {
            opacity: 0.5;
            cursor: default;
        }
        #score-display, #timer-display {
            font-size: 1.5em;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #start-button {
            padding: 15px 30px;
            font-size: 1.2em;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: background-color 0.3s;
        }
        #start-button:hover {
            background-color: #45a049;
        }
        #message-display {
            font-size: 1.8em;
            color: #E91E63;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body data-game="memory-match">
    <div id="game-container">
        <h1 id="game-title"></h1>
        <div id="score-display"></div>
        <div id="timer-display"></div>
        <div id="game-board"></div>
        <button id="start-button"></button>
        <div id="message-display"></div>
    </div>

    <script src="kz-ui.js"></script>
    <script src="game-engine.js"></script>
    <script src="memory-match.js"></script>
    <script>
    (function(){
      const lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('kz-lang') || 'en';
      KidUI.init({ title: "Memory Match", icon: "🧩", color: "#E91E63", gameId: "memory_match", lang: lang });
      const T = {
        uz: {
          title:    'Xotira o\'yini',
          howTitle: 'Qanday o\'ynash?',
          how: [
            "Kartalarni qaytarib juft toping",
            "Ikkita bir xil kartani toping",
            "Barcha juftlarni toping — g'alaba!",
            "Xotirangizni rivojlantiring 🧠",
            "Ko'proq juft — qiyinroq daraja"
          ]
        },
        ru: {
          title:    'Найди пару',
          howTitle: 'Как играть?',
          how: [
            "Переворачивайте карты и ищите пары",
            "Найдите две одинаковые карты",
            "Найдите все пары — победа!",
            "Тренируйте память 🧠",
            "Больше пар — сложнее уровень"
          ]
        },
        en: {
          title:    'Memory Match',
          howTitle: 'How to play?',
          how: [
            "Flip cards to find matching pairs",
            "Find two matching cards",
            "Find all pairs to win!",
            "Train your memory 🧠",
            "More pairs = harder level"
          ]
        }
      };
      const t = T[lang] || T.en;

      document.getElementById('page-title').textContent = t.title;
      document.getElementById('game-title').textContent = t.title;

      KZL.howToPlay({
        id: 'memory-match', lang: lang,
        title: t.howTitle,
        steps: t.how,
        accentColor: '#5F9EA0'
      });
    })();
    </script>
</body>
</html>
