<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bubble Pop!</title>
<script src="kz-ui.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #topbar {
    width: 100%;
    max-width: 420px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 8px;
  }
  .stat-box { background: rgba(255,255,255,0.12); border-radius: 16px; padding: 8px 16px; text-align: center; }
  .stat-label { color: #aaa; font-size: 11px; letter-spacing: 1px; }
  .stat-value { color: #fff; font-size: 22px; font-weight: bold; }
  #game-area { position: relative; width: 100%; max-width: 420px; flex: 1; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #timer-wrap { width: 90%; max-width: 380px; height: 10px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 8px auto; overflow: hidden; }
  #timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, #64ffb4, #00cfff); border-radius: 10px; }
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10, 8, 30, 0.95); z-index: 100; gap: 16px; padding: 30px; }
  .hidden { display: none !important; }
  .btn { padding: 16px 40px; border-radius: 50px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: transform 0.1s; width: 220px; }
  .btn-primary { background: linear-gradient(135deg, #64ffb4, #00cfff); color: #0f0c29; }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); margin-top: 10px; }
  #combo-display { position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 50; }
  .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: particleFly 0.5s ease-out forwards; }
  @keyframes particleFly { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
</style>
</head>
<body>

<div id="topbar">
  <button onclick="history.back()" style="background:rgba(255,255,255,.15);border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;color:#fff;flex-shrink:0">←</button>
  <div class="stat-box">
    <div class="stat-label" id="lbl-score">BALL</div>
    <div id="score" class="stat-value">0</div>
  </div>
  <div class="stat-box" id="level-box">
    <div class="stat-label" id="lbl-level">DARAJA</div>
    <div id="level" class="stat-value">1</div>
  </div>
  <div class="stat-box">
    <div class="stat-label" id="lbl-best">REKORD</div>
    <div id="best" class="stat-value">0</div>
  </div>
</div>

<div id="timer-wrap"><div id="timer-bar"></div></div>

<div id="game-area">
  <canvas id="canvas"></canvas>
  <div id="combo-display"></div>

  <div class="screen" id="start-screen">
    <div style="font-size:72px">🫧</div>
    <h1 style="color:white; font-size:32px">Bubble Pop!</h1>
    <p style="color:#aaa; text-align:center" id="lbl-hint">Pufaklarni bosing!</p>
    <button class="btn btn-primary" id="btn-start" onclick="startGame(false)">🚀 BOSHLASH</button>
    <button class="btn btn-secondary" id="btn-zen" onclick="startGame(true)">👶 ZEN REJIMI</button>
  </div>

  <div class="screen hidden" id="gameover-screen">
    <h1 style="color:white" id="lbl-gameover">Tamom!</h1>
    <div style="background:rgba(255,255,255,0.1); padding:20px; border-radius:20px; text-align:center; min-width:150px">
        <div style="color:#aaa" id="lbl-score2">BALL</div>
        <div id="final-score" style="color:white; font-size:48px; font-weight:bold">0</div>
    </div>
    <button class="btn btn-primary" id="btn-again" onclick="showStart()">🔄 QAYTA</button>
  </div>
</div>

<script src="game-engine.js"></script>
<script>
const game = new KidZoneGame({ id: 'bubble-pop' });

const BUBBLE_LANG = {
  uz: { score:"BALL",  level:"DARAJA",  best:"REKORD",  hint:"Pufaklarni bosing!", start:"🚀 BOSHLASH",   zen:"👶 ZEN REJIMI",  gameover:"Tamom!",        scoreLabel:"BALL",  again:"🔄 QAYTA" },
  ru: { score:"ОЧКИ",  level:"УРОВЕНЬ", best:"РЕКОРД",  hint:"Лопай пузыри!",     start:"🚀 СТАРТ",      zen:"👶 ЗЕН РЕЖИМ",   gameover:"Конец игры!",   scoreLabel:"ОЧКИ",  again:"🔄 ЕЩЁ РАЗ" },
  en: { score:"SCORE", level:"LEVEL",   best:"BEST",    hint:"Pop the bubbles!",   start:"🚀 START",      zen:"👶 ZEN MODE",    gameover:"Game Over!",    scoreLabel:"SCORE", again:"🔄 PLAY AGAIN" },
};

function applyLang() {
  const t = BUBBLE_LANG[game.lang] || BUBBLE_LANG.en;
  document.getElementById('lbl-score').textContent    = t.score;
  document.getElementById('lbl-level').textContent    = t.level;
  document.getElementById('lbl-best').textContent     = t.best;
  document.getElementById('lbl-hint').textContent     = t.hint;
  document.getElementById('btn-start').textContent    = t.start;
  document.getElementById('btn-zen').textContent      = t.zen;
  document.getElementById('lbl-gameover').textContent = t.gameover;
  document.getElementById('lbl-score2').textContent   = t.scoreLabel;
  document.getElementById('btn-again').textContent    = t.again;
}
applyLang();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const gameArea = document.getElementById('game-area');

let bubbles = [], score = 0, level = 1, timeLeft = 30, gameRunning = false, isZen = false;
let bestScore = parseInt(localStorage.getItem('bubbleBest') || '0');
const _BP_KZL_ID = 'bubble-pop';
let _bpPersistentLevel = KZL.getLevel(_BP_KZL_ID);
document.getElementById('best').textContent = bestScore;

function resize() { canvas.width = gameArea.clientWidth; canvas.height = gameArea.clientHeight; }
window.addEventListener('resize', resize);
resize();

class Bubble {
    constructor() {
        this.r = 30 + Math.random() * 30;
        this.x = this.r + Math.random() * (canvas.width - this.r * 2);
        this.y = canvas.height + this.r;
        this.speed = 1 + Math.random() * 1.5 + (isZen ? 0 : level * 0.2) + (_bpPersistentLevel - 1) * 0.08;
        this.color = ['#ff6b9d', '#64ffb4', '#00cfff', '#ffd700'][Math.floor(Math.random() * 4)];
        this.alive = true;
        this.popping = false;
        this.popProgress = 0;
    }
    update() {
        if (this.popping) {
            this.popProgress += 0.15;
            if (this.popProgress >= 1) this.alive = false;
        } else {
            this.y -= this.speed;
            if (this.y + this.r < 0) this.alive = false;
        }
    }
    draw() {
        ctx.save();
        if (this.popping) ctx.globalAlpha = 1 - this.popProgress;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r * (this.popping ? 1.5 : 1), 0, Math.PI * 2);
        ctx.fillStyle = this.color + 'aa';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }
}

function spawnBubble() {
    if (gameRunning) {
        bubbles.push(new Bubble());
        setTimeout(spawnBubble, isZen ? 1500 : 1000 - level * 50);
    }
}

function gameLoop() {
    if (!gameRunning) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    bubbles = bubbles.filter(b => b.alive);
    bubbles.forEach(b => { b.update(); b.draw(); });
    requestAnimationFrame(gameLoop);
}

function handleTap(e) {
    if (!gameRunning) return;
    const rect = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const tx = (t.clientX - rect.left) * (canvas.width / rect.width);
    const ty = (t.clientY - rect.top) * (canvas.height / rect.height);
    for (let b of bubbles) {
        if (!b.popping) {
            const dx = tx - b.x, dy = ty - b.y;
            if (Math.sqrt(dx*dx + dy*dy) < b.r) {
                b.popping = true;
                score += 10;
                document.getElementById('score').textContent = score;
                break;
            }
        }
    }
}

const _BP_LANG = navigator.language.startsWith('ru') ? 'ru' : navigator.language.startsWith('en') ? 'en' : 'uz';
const _BP_HOW = {
  uz:["Ekranda pufaklar paydo bo'ladi","Pufaklarni bosib yorting!","Yuqori darajalarda pufaklar tezroq uchadi","Vaqt tugamasdan imkon qadar ko'p pufak yoring","REKORD — eng yaxshi natijangiz"],
  ru:["На экране появляются пузыри","Нажимайте на пузыри, чтобы лопнуть!","На высоких уровнях пузыри летят быстрее","Лопните как можно больше до конца времени","РЕКОРД — ваш лучший результат"],
  en:["Bubbles appear on screen","Tap bubbles to pop them!","At higher levels bubbles move faster","Pop as many as you can before time runs out","BEST — your highest score"],
};

function startGame(zen) {
    isZen = zen;
    gameRunning = true;
    score = 0; level = 1; timeLeft = 30; bubbles = [];
    document.getElementById('start-screen').classList.add('hidden');
    document.getElementById('gameover-screen').classList.add('hidden');
    document.getElementById('timer-wrap').style.display = zen ? 'none' : 'block';
    document.getElementById('level-box').style.display = zen ? 'none' : 'block';
    KZL.howToPlay({
      id:'bubble-pop', lang:_BP_LANG,
      title:_BP_LANG==='ru'?'Как играть?':_BP_LANG==='en'?'How to play?':'Qanday o\'ynash?',
      steps:_BP_HOW[_BP_LANG]||_BP_HOW['uz'],
      accentColor:'#64ffb4',
    });
    if (!zen) startTimer();
    spawnBubble();
    gameLoop();
}

function startTimer() {
    const itv = setInterval(() => {
        if (!gameRunning) { clearInterval(itv); return; }
        timeLeft -= 0.1;
        document.getElementById('timer-bar').style.width = (timeLeft / 30 * 100) + '%';
        level = 1 + Math.floor((30 - timeLeft) / 10);
        document.getElementById('level').textContent = level;
        if (timeLeft <= 0) { clearInterval(itv); endGame(); }
    }, 100);
}

function endGame() {
    gameRunning = false;
    document.getElementById('final-score').textContent = score;
    document.getElementById('gameover-screen').classList.remove('hidden');
    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('bubbleBest', bestScore);
        document.getElementById('best').textContent = bestScore;
    }
    if (score >= 50) { _bpPersistentLevel = KZL.nextLevel(_BP_KZL_ID); }
    game.reportScore(Math.floor(score / 10));
}

function showStart() { document.getElementById('gameover-screen').classList.add('hidden'); document.getElementById('start-screen').classList.remove('hidden'); }

canvas.addEventListener('mousedown', handleTap);
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleTap(e); }, {passive:false});
</script>
</body>
</html>
