<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mini Piano 🎹</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height:100vh; background:#1a1a2e;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:15px; display:flex; justify-content:space-between; color:white; z-index:10; }
.pill { background:rgba(255,255,255,0.1); border-radius:20px; padding:8px 16px; font-weight:bold; }

#piano-container {
  flex:1; width:100%; display:flex; align-items:flex-end; padding:10px; gap:4px;
  background:linear-gradient(to bottom, #1a1a2e, #16213e);
}
.key {
  flex:1; height:70%; background:white; border-radius:0 0 12px 12px;
  box-shadow:0 6px 0 #ddd, 0 10px 15px rgba(0,0,0,0.3);
  position:relative; cursor:pointer; transition:transform 0.1s, background 0.1s;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-end;
  padding-bottom:20px; font-weight:900; color:#333;
}
.key:active, .key.active {
  transform:translateY(6px); background:#f0f0f0; box-shadow:0 0 0 #ddd;
}
/* Key colors */
.key[data-note="C"] { background:#FF6B6B; }
.key[data-note="D"] { background:#FF9F43; }
.key[data-note="E"] { background:#FECA57; }
.key[data-note="F"] { background:#1DD1A1; }
.key[data-note="G"] { background:#48DBFB; }
.key[data-note="A"] { background:#5F27CD; }
.key[data-note="B"] { background:#FD79A8; }
.key[data-note="C2"] { background:#FF6B6B; }

.key-label { font-size:24px; pointer-events:none; }
.note-name { font-size:12px; margin-top:5px; opacity:0.6; }

/* Visualizer */
#viz { position:absolute; inset:0; pointer-events:none; }
.particle {
  position:absolute; bottom:30%; width:20px; height:20px; border-radius:50%;
  animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp {
  0% { transform:translateY(0) scale(1); opacity:1; }
  100% { transform:translateY(-200px) scale(2); opacity:0; }
}

#feedback {
  position:fixed; top:20%; font-size:40px; color:white;
  text-shadow:0 0 15px rgba(255,255,255,0.5); opacity:0;
}
.show-fb { animation:pop 0.5s ease; }
@keyframes pop { 0%{transform:scale(0.5);opacity:0} 50%{transform:scale(1.2);opacity:1} 100%{transform:scale(1);opacity:0} }
</style>
</head>
<body>
<div id="topbar">
  <div class="pill">🎹 Mini Piano</div>
  <div class="pill">BALL: <span id="score">0</span></div>
</div>
<div id="feedback">Yaxshi! 🌟</div>
<div id="viz"></div>
<div id="piano-container">
  <div class="key" data-note="C" data-freq="261.63"><span class="key-label">DO</span><span class="note-name">C</span></div>
  <div class="key" data-note="D" data-freq="293.66"><span class="key-label">RE</span><span class="note-name">D</span></div>
  <div class="key" data-note="E" data-freq="329.63"><span class="key-label">MI</span><span class="note-name">E</span></div>
  <div class="key" data-note="F" data-freq="349.23"><span class="key-label">FA</span><span class="note-name">F</span></div>
  <div class="key" data-note="G" data-freq="392.00"><span class="key-label">SO</span><span class="note-name">G</span></div>
  <div class="key" data-note="A" data-freq="440.00"><span class="key-label">LA</span><span class="note-name">A</span></div>
  <div class="key" data-note="B" data-freq="493.88"><span class="key-label">SI</span><span class="note-name">B</span></div>
  <div class="key" data-note="C2" data-freq="523.25"><span class="key-label">DO</span><span class="note-name">C2</span></div>
</div>

<script>
let audioCtx = null;
let score = 0;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

function playNote(freq, color) {
  initAudio();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.5);

  spawnParticle(color);
  score += 1;
  document.getElementById('score').textContent = score;
  if (score % 10 === 0) showFeedback();
}

function spawnParticle(color) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.background = color;
  p.style.left = (Math.random() * 80 + 10) + 'vw';
  document.getElementById('viz').appendChild(p);
  setTimeout(() => p.remove(), 1000);
}

function showFeedback() {
  const fb = document.getElementById('feedback');
  fb.className = 'show-fb';
  setTimeout(() => fb.className = '', 500);
}

window.onload = () => {
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id');
  if (id === 'rhythm') {
    document.querySelector('.pill').textContent = '🎵 Ritm O\'yini';
    document.getElementById('feedback').textContent = 'Ritmga rioya qiling! 🎵';
  }
};

document.querySelectorAll('.key').forEach(key => {
  const play = () => {
    const color = getComputedStyle(key).backgroundColor;
    key.classList.add('active');
    playNote(parseFloat(key.dataset.freq), color);
    setTimeout(() => key.classList.remove('active'), 100);
  };
  key.addEventListener('touchstart', (e) => { e.preventDefault(); play(); });
  key.addEventListener('mousedown', play);
});

// Update progress in main app
window.addEventListener('beforeunload', () => {
  const currentPts = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentPts + Math.floor(score/5));
  localStorage.setItem('kz-prog-piano', '100');
});
</script>
</body>
</html>
