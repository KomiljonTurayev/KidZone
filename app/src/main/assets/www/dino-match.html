<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Dino Sort & Match 🦖</title>
  <style>
    :root { --primary: #4ECDC4; --bg: #E8F9FF; }
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
    body { background: var(--bg); font-family: 'Arial Rounded MT Bold', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    #header { padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; background:white; box-shadow:0 2px 8px rgba(0,0,0,0.06); gap:8px; }
    #lv-badge { background:#4ECDC4; color:white; padding:6px 14px; border-radius:20px; font-weight:900; font-size:13px; white-space:nowrap; }
    #lives-row { display:flex; gap:3px; align-items:center; font-size:20px; }
    #hint-btn { background:#FF6B35; color:white; border:none; border-radius:16px; padding:7px 12px; font-size:13px; font-weight:900; cursor:pointer; white-space:nowrap; }
    #hint-btn:disabled { opacity:0.4; cursor:default; }
    #back-btn { background:rgba(0,0,0,.08); border:none; border-radius:50%; width:36px; height:36px; font-size:18px; cursor:pointer; flex-shrink:0; }

    #play-area { flex: 1; position: relative; overflow:hidden; }

    .slot { position: absolute; border: 4px dashed rgba(0,0,0,0.12); border-radius: 22px; display: flex; flex-direction:column; align-items: center; justify-content: center; transition:border-color 0.3s, transform 0.15s; }
    .slot.hint-glow { border-color:#FF6B35; border-style:solid; animation:slotPulse 0.5s 3; }
    .slot.correct-flash { background:rgba(76,175,80,0.18); border-color:#4CAF50; border-style:solid; }
    @keyframes slotPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
    .slot-em { opacity:0.28; pointer-events:none; }

    .item { position: absolute; background: white; border-radius: 18px; display: flex; align-items: center; justify-content: center; box-shadow: 0 5px 15px rgba(0,0,0,0.10); cursor: grab; z-index: 10; transition: transform 0.1s; user-select:none; }
    .item:active { cursor: grabbing; transform: scale(1.12) rotate(-3deg) !important; }
    .item.wrong-flash { animation:shake 0.4s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }

    #feedback { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); font-size: 70px; pointer-events: none; display: none; z-index:200; }
    #feedback.show { display: block; animation: fbPop 0.65s ease-out forwards; }
    @keyframes fbPop { 0%{transform:translate(-50%,-50%) scale(0.5);opacity:1} 100%{transform:translate(-50%,-50%) scale(2.2);opacity:0} }

    #round-done { position:fixed; inset:0; background:rgba(0,0,0,0.72); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:300; color:white; text-align:center; }
    #round-done.show { display:flex; animation:kzlPop .4s cubic-bezier(.34,1.56,.64,1); }
    @keyframes kzlPop{from{transform:scale(.65);opacity:0}to{transform:scale(1);opacity:1}}
    .rd-card { background:linear-gradient(135deg,#4ECDC4,#26a69a); border-radius:28px; padding:36px 28px; width:min(290px,88vw); }
    .rd-em { font-size:58px; margin-bottom:6px; }
    .rd-title { font-size:30px; font-weight:900; margin-bottom:6px; }
    .rd-sub { font-size:16px; opacity:0.85; margin-bottom:22px; }
    .rd-btn { background:white; color:#26a69a; border:none; border-radius:20px; padding:14px 36px; font-size:17px; font-weight:900; cursor:pointer; width:100%; }
    .rd-btn:active { transform:scale(0.96); }
  </style>
</head>
<body>
  <div id="header">
    <button id="back-btn" onclick="history.back()">←</button>
    <div id="lv-badge">LV 1</div>
    <div id="lives-row">❤️❤️❤️</div>
    <button id="hint-btn" onclick="useHint()">💡 3</button>
  </div>

  <div id="play-area"></div>
  <div id="feedback">⭐</div>

  <div id="round-done">
    <div class="rd-card">
      <div class="rd-em">🎉</div>
      <div class="rd-title" id="rd-title">Barakalla!</div>
      <div class="rd-sub" id="rd-sub">Level 2!</div>
      <button class="rd-btn" id="rd-btn" onclick="nextRound()">Davom et ▶</button>
    </div>
  </div>

<script src="kz-ui.js"></script>
<script src="game-engine.js"></script>
<script>
const GAME_ID = 'dino-match';
const _L = navigator.language.startsWith('ru')?'ru':navigator.language.startsWith('en')?'en':'uz';

const DM_T = {
  uz:{win:"Barakalla!",next:"Keyingi daraja!",cont:"Davom et ▶",lv:"LV"},
  ru:{win:"Молодец!",next:"Следующий уровень!",cont:"Продолжить ▶",lv:"УР"},
  en:{win:"Great job!",next:"Next level!",cont:"Continue ▶",lv:"LV"},
};
const dt = DM_T[_L]||DM_T.en;

// 20 pairs ordered easy → expert
const ALL_PAIRS = [
  {em:"🦖",slot:"🌋"},{em:"🐟",slot:"🌊"},{em:"🐦",slot:"🌳"},
  {em:"🌸",slot:"🌱"},{em:"🐝",slot:"🍯"},{em:"⚽",slot:"🥅"},
  {em:"🎸",slot:"🎵"},{em:"🍕",slot:"🍽️"},{em:"🦋",slot:"🌺"},
  {em:"🐸",slot:"🪷"},{em:"🐠",slot:"🪸"},{em:"🏖️",slot:"🌴"},
  {em:"🦅",slot:"⛰️"},{em:"🐬",slot:"🌐"},{em:"🦊",slot:"🏔️"},
  {em:"🎭",slot:"🎪"},{em:"🦁",slot:"🌿"},{em:"🐧",slot:"❄️"},
  {em:"🦜",slot:"🏝️"},{em:"🐉",slot:"🏰"},
];

let _level, lives, hints, placed, roundPairs, activeItem, offsetX, offsetY;

function pairsCount(lv){ return Math.min(3 + Math.floor((lv-1)/4), 8); }

function init(){
  _level = KZL.getLevel(GAME_ID);
  startRound();
  KZL.howToPlay({id:GAME_ID,lang:_L,
    title:_L==='ru'?'Как играть?':_L==='en'?'How to play?':'Qanday o\'ynash?',
    steps:({
      uz:["Hayvon/narsani tegishli joyga suring","Har bir emoji o'z juftiga mos keladi","Noto'g'ri joyga qo'ysangiz — yurak kamayadi","💡 Maslahat: to'g'ri joyni ko'rsatadi","Barcha narsalarni joyiga qo'ysangiz — g'alaba!"],
      ru:["Перетащите эмодзи на правильное место","Каждый эмодзи соответствует своей паре","Ошиблись — теряете жизнь","💡 Подсказка покажет правильный слот","Разместите всё правильно — победа!"],
      en:["Drag each emoji to its matching slot","Every emoji has one correct match","Wrong slot costs a life","💡 Hint highlights the correct slot","Place them all correctly to win!"],
    })[_L]||["Drag emojis to matching slots","Find the correct match","Wrong slot = lose a life","Hint shows the right slot","Place all to win!"],
    accentColor:'#4ECDC4',
  });
}

function startRound(){
  lives=3; hints=2; placed=0;
  const pool=KZL.slicePool(ALL_PAIRS,_level);
  const n=pairsCount(_level);
  roundPairs=[];
  const src=[...pool];
  while(roundPairs.length<n && src.length){
    const i=Math.floor(Math.random()*src.length);
    roundPairs.push(...src.splice(i,1));
  }
  updateHeader();
  renderRound();
}

function renderRound(){
  const area=document.getElementById('play-area');
  area.innerHTML='';
  const W=area.clientWidth, H=area.clientHeight;
  const n=roundPairs.length;
  const cols=Math.min(n, Math.ceil(Math.sqrt(n)));
  const rows=Math.ceil(n/cols);
  const cell=Math.min(Math.floor((W-20)/(cols+0.5)), Math.floor((H*0.55)/rows), 90);
  const gap=8;
  const gridW=cols*cell+(cols-1)*gap;
  const gridH=rows*cell+(rows-1)*gap;
  const ox=(W-gridW)/2, oy=12;

  roundPairs.forEach((p,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const slot=document.createElement('div');
    slot.className='slot'; slot.dataset.id=i;
    slot.style.cssText=`left:${ox+col*(cell+gap)}px;top:${oy+row*(cell+gap)}px;width:${cell}px;height:${cell}px;font-size:${Math.floor(cell*0.44)}px;`;
    slot.innerHTML=`<span class="slot-em">${p.slot}</span>`;
    area.appendChild(slot);
  });

  const shuffled=[...roundPairs].map((p,i)=>({p,origIdx:i})).sort(()=>Math.random()-0.5);
  const totalItemW=n*cell+(n-1)*gap;
  const itemOx=Math.max(4,(W-totalItemW)/2);
  const itemY=H-cell-16;
  shuffled.forEach(({p,origIdx},i)=>{
    const item=document.createElement('div');
    item.className='item'; item.dataset.id=origIdx;
    item.style.cssText=`left:${itemOx+i*(cell+gap)}px;top:${itemY}px;width:${cell}px;height:${cell}px;font-size:${Math.floor(cell*0.5)}px;`;
    item.textContent=p.em;
    item.addEventListener('touchstart',dragStart,{passive:false});
    item.addEventListener('mousedown',dragStart);
    area.appendChild(item);
  });
}

function dragStart(e){
  e.preventDefault();
  activeItem=e.target.closest('.item');
  if(!activeItem) return;
  const touch=e.touches?e.touches[0]:e;
  const rect=activeItem.getBoundingClientRect();
  offsetX=touch.clientX-rect.left;
  offsetY=touch.clientY-rect.top;
  activeItem.style.zIndex=1000;
  document.addEventListener('touchmove',dragMove,{passive:false});
  document.addEventListener('mousemove',dragMove);
  document.addEventListener('touchend',dragEnd);
  document.addEventListener('mouseup',dragEnd);
}

function dragMove(e){
  if(!activeItem) return;
  e.preventDefault();
  const touch=e.touches?e.touches[0]:e;
  const area=document.getElementById('play-area');
  const ar=area.getBoundingClientRect();
  activeItem.style.left=(touch.clientX-offsetX-ar.left)+'px';
  activeItem.style.top=(touch.clientY-offsetY-ar.top)+'px';
}

function dragEnd(){
  if(!activeItem) return;
  const area=document.getElementById('play-area');
  const ar=area.getBoundingClientRect();
  const rect=activeItem.getBoundingClientRect();
  const cx=rect.left+rect.width/2, cy=rect.top+rect.height/2;
  let handled=false;

  document.querySelectorAll('.slot').forEach(slot=>{
    if(handled) return;
    const sr=slot.getBoundingClientRect();
    if(cx>sr.left&&cx<sr.right&&cy>sr.top&&cy<sr.bottom){
      handled=true;
      if(slot.dataset.id===activeItem.dataset.id){
        placed++;
        activeItem.style.display='none';
        slot.classList.add('correct-flash');
        setTimeout(()=>slot.classList.remove('correct-flash'),500);
        showFeedback('⭐');
        if(placed>=roundPairs.length) setTimeout(onRoundComplete,750);
      } else {
        lives=Math.max(0,lives-1);
        updateHeader();
        const cur=activeItem;
        cur.classList.add('wrong-flash');
        setTimeout(()=>{
          cur.classList.remove('wrong-flash');
          resetItemPos(cur);
        },420);
        if(lives<=0) setTimeout(()=>{lives=3;updateHeader();},600);
      }
    }
  });

  if(!handled) resetItemPos(activeItem);
  activeItem.style.zIndex=10;
  activeItem=null;
  document.removeEventListener('touchmove',dragMove);
  document.removeEventListener('mousemove',dragMove);
  document.removeEventListener('touchend',dragEnd);
  document.removeEventListener('mouseup',dragEnd);
}

function resetItemPos(item){
  const area=document.getElementById('play-area');
  const cell=parseInt(item.style.width);
  const W=area.clientWidth, H=area.clientHeight;
  const n=roundPairs.length;
  const gap=8;
  const totalW=n*cell+(n-1)*gap;
  const ox=Math.max(4,(W-totalW)/2);
  const idx=Array.from(area.querySelectorAll('.item:not([style*="display:none"])')).indexOf(item);
  item.style.left=(ox+Math.max(0,idx)*(cell+gap))+'px';
  item.style.top=(H-cell-16)+'px';
}

function showFeedback(em){
  const fb=document.getElementById('feedback');
  fb.textContent=em;
  fb.classList.remove('show');
  void fb.offsetWidth;
  fb.classList.add('show');
  setTimeout(()=>fb.classList.remove('show'),650);
}

function onRoundComplete(){
  _level=KZL.nextLevel(GAME_ID);
  document.getElementById('rd-title').textContent=dt.win;
  document.getElementById('rd-sub').textContent=dt.lv+' '+_level+'!';
  document.getElementById('rd-btn').textContent=dt.cont;
  document.getElementById('round-done').classList.add('show');
}

function nextRound(){
  document.getElementById('round-done').classList.remove('show');
  startRound();
  updateHeader();
}

function useHint(){
  if(hints<=0) return;
  hints--;
  updateHeader();
  const item=document.querySelector('.item:not([style*="display:none"])');
  if(!item) return;
  const slot=document.querySelector(`.slot[data-id="${item.dataset.id}"]`);
  if(slot){ slot.classList.add('hint-glow'); setTimeout(()=>slot.classList.remove('hint-glow'),1800); }
}

function updateHeader(){
  document.getElementById('lv-badge').textContent=dt.lv+' '+_level;
  const lv=[];
  for(let i=0;i<3;i++) lv.push(i<lives?'❤️':'🖤');
  document.getElementById('lives-row').innerHTML=lv.join('');
  const hb=document.getElementById('hint-btn');
  hb.disabled=hints<=0;
  hb.textContent='💡 '+(hints>0?hints:'');
}

init();
</script>
</body>
</html>
