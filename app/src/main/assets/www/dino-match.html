<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
  <title>Dino Sort & Match 🦖</title>
  <style>
    :root { --primary: #4ECDC4; --bg: #E8F9FF; }
    * { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
    body { background: var(--bg); font-family: 'Arial Rounded MT Bold', sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

    #header { padding: 15px; display: flex; align-items: center; justify-content: space-between; }
    #score-p { background: white; padding: 8px 15px; border-radius: 20px; font-weight: 900; color: #444; }

    #play-area { flex: 1; position: relative; }
    .slot { position: absolute; width: 100px; height: 100px; border: 4px dashed rgba(0,0,0,0.1); border-radius: 25px; display: flex; align-items: center; justify-content: center; font-size: 50px; }

    .item { position: absolute; width: 85px; height: 85px; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 45px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); cursor: grab; z-index: 10; transition: transform 0.1s; }
    .item:active { cursor: grabbing; transform: scale(1.1); }

    #feedback { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 80px; pointer-events: none; display: none; }
    #feedback.show { display: block; animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; } }
  </style>
</head>
<body>
  <div id="header">
    <div onclick="window.parent.closeGame()" style="font-size: 24px; cursor: pointer;">🔙</div>
    <div id="score-p">🦖 <span id="points">0</span></div>
    <div style="width: 24px;"></div>
  </div>

  <div id="play-area">
    <!-- Slots and Items will be injected here -->
  </div>

  <div id="feedback">⭐</div>

  <script>
    const DATA = [
        { id: 1, em: "🦖", slot: "🌋" },
        { id: 2, em: "🍎", slot: "🧺" },
        { id: 3, em: "🚗", slot: "🏠" },
        { id: 4, em: "🐠", slot: "🌊" }
    ];

    let points = 0;
    let activeItem = null;
    let offset = { x: 0, y: 0 };

    function init() {
        const area = document.getElementById('play-area');
        area.innerHTML = '';

        // Render Slots
        DATA.forEach((d, i) => {
            const slot = document.createElement('div');
            slot.className = 'slot';
            slot.dataset.id = d.id;
            slot.innerHTML = `<span style="opacity: 0.3">${d.slot}</span>`;
            slot.style.left = (20 + (i % 2) * 45) + '%';
            slot.style.top = (10 + Math.floor(i / 2) * 25) + '%';
            area.appendChild(slot);
        });

        // Render Items
        DATA.forEach((d, i) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.dataset.id = d.id;
            item.textContent = d.em;
            item.style.left = (Math.random() * 60 + 10) + '%';
            item.style.top = '70%';

            item.addEventListener('touchstart', dragStart);
            item.addEventListener('mousedown', dragStart);
            area.appendChild(item);
        });
    }

    function dragStart(e) {
        activeItem = e.target.closest('.item');
        const touch = e.touches ? e.touches[0] : e;
        const rect = activeItem.getBoundingClientRect();
        offset.x = touch.clientX - rect.left;
        offset.y = touch.clientY - rect.top;
        activeItem.style.zIndex = 1000;

        document.addEventListener('touchmove', dragMove, { passive: false });
        document.addEventListener('mousemove', dragMove);
        document.addEventListener('touchend', dragEnd);
        document.addEventListener('mouseup', dragEnd);
    }

    function dragMove(e) {
        if (!activeItem) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        activeItem.style.left = (touch.clientX - offset.x) + 'px';
        activeItem.style.top = (touch.clientY - offset.y) + 'px';
    }

    function dragEnd() {
        if (!activeItem) return;

        const rect = activeItem.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        let matched = false;
        document.querySelectorAll('.slot').forEach(slot => {
            const sRect = slot.getBoundingClientRect();
            if (cx > sRect.left && cx < sRect.right && cy > sRect.top && cy < sRect.bottom) {
                if (slot.dataset.id === activeItem.dataset.id) {
                    matched = true;
                    points += 10;
                    document.getElementById('points').textContent = points;
                    activeItem.style.display = 'none';
                    showFeedback();
                    if (points >= 40) {
                        setTimeout(() => {
                            if (window.parent.onRewardGranted) window.parent.onRewardGranted(30);
                            init();
                        }, 1000);
                    }
                }
            }
        });

        if (!matched) {
            activeItem.style.left = (Math.random() * 60 + 10) + '%';
            activeItem.style.top = '70%';
        }

        activeItem = null;
        document.removeEventListener('touchmove', dragMove);
        document.removeEventListener('mousemove', dragMove);
        document.removeEventListener('touchend', dragEnd);
        document.removeEventListener('mouseup', dragEnd);
    }

    function showFeedback() {
        const fb = document.getElementById('feedback');
        fb.classList.add('show');
        setTimeout(() => fb.classList.remove('show'), 600);
    }

    init();
  </script>
</body>
</html>
