<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Catch the Apple</title>
    <link rel="stylesheet" href="kids-theme.css">
    <script src="kz-ui.js"></script>
    <script src="kids-ui.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #A8E6CF 0%, #DCEDC1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }
        h1 {
            color: var(--kz-text-color-dark);
        }
        .kz-game-container { /* Renamed from #game-container */
            /* Inherits most styles from .kz-game-container in kidzone-game-styles.css */
            border: 4px solid rgba(255, 255, 255, 0.8); /* Specific border for this game */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            box-sizing: border-box;
            background: linear-gradient(to bottom, #E0FFFF 0%, #B2FEFA 100%);
            border: 5px solid #FFD3B6;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
        }
        #score-display, #lives-display {
            font-size: 1.5em;
            margin-top: 10px;
            font-weight: bold;
        }
        #message-display {
            font-size: 1.8em;
            color: #E91E63;
            margin-top: 15px;
            font-weight: bold;
        }
        #start-button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(to bottom, #4CAF50, #388E3C);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px #2E7D32;
            transition: all 0.1s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #start-button:hover {
            transform: translateY(2px);
            box-shadow: 0 4px #2E7D32;
        }
        #start-button:active {
            transform: translateY(6px);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="kz-game-container">
        <h1>Catch the Apple</h1>
        <div class="kz-stat-display" id="score-display">Score: 0</div>
        <div class="kz-stat-display" id="lives-display">Lives: ❤️❤️❤️</div>
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        <button class="kz-btn-primary" id="start-button">Start Game</button>
        <div class="kz-message-display" id="message-display"></div>
    </div>

    <script src="game-engine.js"></script>
    <script src="catch-the-apple.js"></script>
    <script>
    /* ── I18N ── */
    const lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('kz-lang') || 'en';
    KidUI.init({ title: "Catch Apple", icon: "🍎", color: "#E53935", gameId: "catch_apple", lang: lang });
    const T = {
      uz: {
        title:       "Olmani uslang",
        score:       "Ball",
        lives:       "Hayot",
        startGame:   "O'yinni boshlash",
        howTitle:    "Qanday o'ynash?",
        how: [
          "Savat soldan o'ngga harakatlanadi",
          "Tushayotgan olmalarni savat bilan ushlang",
          "Bomba tushsa hayot kamayadi! 💣",
          "Ko'proq olma — ko'proq ball",
          "20 daraja davomida tezlik ortib boradi"
        ]
      },
      ru: {
        title:       "Лови яблоко",
        score:       "Очки",
        lives:       "Жизни",
        startGame:   "Начать игру",
        howTitle:    "Как играть?",
        how: [
          "Корзина движется слева направо",
          "Ловите падающие яблоки корзиной",
          "Бомба уменьшает жизнь! 💣",
          "Больше яблок — больше очков",
          "На 20 уровнях скорость нарастает"
        ]
      },
      en: {
        title:       "Catch the Apple",
        score:       "Score",
        lives:       "Lives",
        startGame:   "Start Game",
        howTitle:    "How to play?",
        how: [
          "Basket moves left and right",
          "Catch falling apples with the basket",
          "Bombs cost a life! 💣",
          "More apples = more points",
          "Speed increases across 20 levels"
        ]
      }
    };
    const t = T[lang] || T.en;

    /* Apply translations to static HTML elements */
    document.querySelector('h1').textContent        = t.title;
    document.getElementById('score-display').textContent = t.score + ': 0';
    document.getElementById('lives-display').textContent = t.lives + ': ❤️❤️❤️';
    document.getElementById('start-button').textContent  = t.startGame;

    document.addEventListener('DOMContentLoaded', () => {
      KZL.howToPlay({
        id:'catch-the-apple', lang:lang,
        title: t.howTitle,
        steps: t.how,
        accentColor:'#4CAF50',
      });
    });
    </script>
</body>
</html>
