<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Catch the Apple</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #A8E6CF 0%, #DCEDC1 100%);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #333;
        }
        h1 {
            color: var(--kz-text-color-dark);
        }
        .kz-game-container { /* Renamed from #game-container */
            /* Inherits most styles from .kz-game-container in kidzone-game-styles.css */
            border: 4px solid rgba(255, 255, 255, 0.8); /* Specific border for this game */
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 90%;
            box-sizing: border-box;
            background: linear-gradient(to bottom, #E0FFFF 0%, #B2FEFA 100%);
            border: 5px solid #FFD3B6;
            border-radius: 20px;
            display: block;
            margin: 0 auto;
        }
        #score-display, #lives-display {
            font-size: 1.5em;
            margin-top: 10px;
            font-weight: bold;
        }
        #message-display {
            font-size: 1.8em;
            color: #E91E63;
            margin-top: 15px;
            font-weight: bold;
        }
        #start-button {
            padding: 15px 30px;
            font-size: 1.2em;
            background: linear-gradient(to bottom, #4CAF50, #388E3C);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 6px #2E7D32;
            transition: all 0.1s;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #start-button:hover {
            transform: translateY(2px);
            box-shadow: 0 4px #2E7D32;
        }
        #start-button:active {
            transform: translateY(6px);
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="kz-game-container">
        <h1>Catch the Apple</h1>
        <div class="kz-stat-display" id="score-display">Score: 0</div>
        <div class="kz-stat-display" id="lives-display">Lives: ❤️❤️❤️</div>
        <canvas id="gameCanvas" width="320" height="480"></canvas>
        <button class="kz-btn-primary" id="start-button">Start Game</button>
        <div class="kz-message-display" id="message-display"></div>
    </div>

    <script src="kz-ui.js"></script>
    <script src="game-engine.js"></script>
    <script src="catch-the-apple.js"></script>
    <script>
    /* KZL how-to-play + back button */
    (function() {
      const _CA_LANG = navigator.language.startsWith('ru') ? 'ru'
                     : navigator.language.startsWith('en') ? 'en' : 'uz';
      const _CA_HOW = {
        uz:["Savat soldan o'ngga harakatlanadi","Tushayotgan olmalarni savat bilan ushlang","Bomba tushsa hayot kamayadi! 💣","Ko'proq olma — ko'proq ball","20 daraja davomida tezlik ortib boradi"],
        ru:["Корзина движется слева направо","Ловите падающие яблоки корзиной","Бомба уменьшает жизнь! 💣","Больше яблок — больше очков","На 20 уровнях скорость нарастает"],
        en:["Basket moves left and right","Catch falling apples with the basket","Bombs cost a life! 💣","More apples = more points","Speed increases across 20 levels"],
      };
      /* add back button */
      const backBtn = document.createElement('button');
      backBtn.textContent = '←';
      Object.assign(backBtn.style, {
        position:'fixed',top:'12px',left:'12px',zIndex:'50',
        background:'rgba(0,0,0,.25)',border:'none',borderRadius:'50%',
        width:'38px',height:'38px',fontSize:'18px',cursor:'pointer',color:'#fff',
      });
      backBtn.onclick = () => history.back();
      document.body.appendChild(backBtn);

      document.addEventListener('DOMContentLoaded', () => {
        KZL.howToPlay({
          id:'catch-the-apple', lang:_CA_LANG,
          title:_CA_LANG==='ru'?'Как играть?':_CA_LANG==='en'?'How to play?':'Qanday o\'ynash?',
          steps:_CA_HOW[_CA_LANG]||_CA_HOW['uz'],
          accentColor:'#4CAF50',
        });
      });
    })();
    </script>
</body>
</html>
