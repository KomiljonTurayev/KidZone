<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title id="page-title">Jump Rope! 🪢</title>
<link rel="stylesheet" href="kids-theme.css">
<script src="kids-ui.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Fredoka+One&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:none; }
body {
  min-height:100vh; background:#87CEEB;
  font-family:'Nunito', sans-serif;
  overflow:hidden; display:flex; flex-direction:column; align-items:center;
}
#game-container { position:relative; width:100%; height:100vh; overflow:hidden; }
#character {
  position:absolute; bottom:100px; left:50%; transform:translateX(-50%);
  font-size:80px; transition:bottom 0.4s cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
#rope {
  position:absolute; bottom:100px; left:50%; width:200px; height:100px;
  border:6px solid #5D4037; border-top:none; border-radius:0 0 100px 100px;
  transform-origin:top center; transform:translateX(-50%) rotateX(0deg);
  z-index:5;
}
#score-box { position:absolute; top:40px; width:100%; text-align:center; font-family:'Fredoka One'; font-size:32px; color:white; text-shadow:0 3px 6px rgba(0,0,0,0.2); }
#msg { position:absolute; bottom:150px; width:100%; text-align:center; font-weight:bold; color:white; font-size:20px; }
.particle { position:absolute; font-size:24px; animation:pop 0.6s ease-out forwards; }
@keyframes pop { 0%{transform:translate(0,0) scale(1);opacity:1} 100%{transform:translate(var(--tx), var(--ty)) scale(0);opacity:0} }
</style>
</head>
<body onclick="jump()">
<div id="game-container">
<div id="score-box">⭐ <span id="score">0</span> &nbsp; LV<span id="jr-lv">1</span></div>
    <div id="msg"></div>
    <div id="character">🧒</div>
    <div id="rope"></div>
</div>

<script src="kz-ui.js"></script>
<script src="game-engine.js"></script>
<script>
const lang = new URLSearchParams(location.search).get('lang') || localStorage.getItem('kz-lang') || 'en';
KidUI.init({ title: "Jump Rope", icon: "🪢", color: "#7CB342", gameId: "jump_rope", lang: lang });
const T = {
  uz: {
    title:   'Arqon sakrash! 🪢',
    tapMsg:  'Sakrash uchun bosing! 🚀',
    missMsg: 'Vaqtida sakrang! 😮',
    goodMsg: 'Yaxshi! 🌟',
    howTitle:'Qanday o\'ynash?',
    how: [
      "Ekranni bosib sakrang! 🪢",
      "Arqon pastga kelganda sakrash kerak",
      "Ko'proq sakrasangiz, arqon tezlashadi",
      "Ketma-ket sakrashlar yulduzlar beradi ⭐",
      "Daraja oshgan sari arqon tezroq aylanadi"
    ]
  },
  ru: {
    title:   'Прыжки через скакалку! 🪢',
    tapMsg:  'Нажмите для прыжка! 🚀',
    missMsg: 'Прыгайте вовремя! 😮',
    goodMsg: 'Отлично! 🌟',
    howTitle:'Как играть?',
    how: [
      "Нажимайте на экран для прыжка! 🪢",
      "Прыгайте когда верёвка внизу",
      "Верёвка ускоряется с каждым прыжком",
      "Серия прыжков приносит звёзды ⭐",
      "С уровнем верёвка крутится быстрее"
    ]
  },
  en: {
    title:   'Jump Rope! 🪢',
    tapMsg:  'Tap to jump! 🚀',
    missMsg: 'Jump in time! 😮',
    goodMsg: 'Nice! 🌟',
    howTitle:'How to play?',
    how: [
      "Tap screen to jump! 🪢",
      "Jump when the rope is at the bottom",
      "The rope speeds up as you jump more",
      "Jump streaks earn extra stars ⭐",
      "The rope spins faster each level"
    ]
  }
};
const t = T[lang] || T.en;

document.getElementById('page-title').textContent = t.title;
document.getElementById('msg').textContent = t.tapMsg;

const game = new KidZoneGame({ id: 'jump-rope' });
let jrLevel = KZL.getLevel('jump-rope');
KZL.howToPlay({
  id:'jump-rope', lang:lang,
  title: t.howTitle,
  steps: t.how,
  accentColor:'#5D4037',
});

let score = 0;
let jumping = false;
let ropeAngle = 0;
let ropeSpeed = 0.06 + (jrLevel - 1) * 0.004;
let gameOver = false;

function jump() {
    if (jumping || gameOver) return;
    jumping = true;
    const char = document.getElementById('character');
    char.style.bottom = '280px';
    setTimeout(() => {
        char.style.bottom = '100px';
        setTimeout(() => jumping = false, 300);
    }, 400);
}

function update() {
    if (gameOver) return;

    ropeAngle += ropeSpeed;
    const rope = document.getElementById('rope');
    const y = Math.cos(ropeAngle) * 50;

    // Scale and rotate to simulate 3D rotation
    rope.style.transform = `translateX(-50%) scaleY(${Math.abs(Math.cos(ropeAngle))}) translateY(${y}px)`;
    rope.style.opacity = Math.cos(ropeAngle) > 0 ? 1 : 0.3; // Behind character

    // Collision Check (Simplified)
    // Rope is at bottom when cos(angle) is near 1
    if (Math.cos(ropeAngle) > 0.9) {
        if (!jumping) {
            document.getElementById('msg').textContent = t.missMsg;
            score = Math.max(0, score - 1);
        } else {
            // Successful jump
            score++;
            document.getElementById('score').textContent = score;
            document.getElementById('msg').textContent = t.goodMsg;
            spawnParticles();
            if (score % 5 === 0) { game.reportScore(1); }
            if (score % 10 === 0 && KZL.getLevel('jump-rope') === jrLevel) {
              KZL.nextLevel('jump-rope');
              jrLevel = KZL.getLevel('jump-rope');
            }
            ropeSpeed += 0.001;
        }
        ropeAngle += 0.5; // Prevent multiple hits in one pass
    }

    requestAnimationFrame(update);
}

function spawnParticles() {
    for(let i=0; i<5; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = '✨';
        p.style.left = '50%';
        p.style.bottom = '150px';
        p.style.setProperty('--tx', (Math.random()*200-100)+'px');
        p.style.setProperty('--ty', (Math.random()*-200-50)+'px');
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
    }
}

update();
</script>
</body>
</html>
