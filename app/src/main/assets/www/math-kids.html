<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Math Kids 🔢</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background: #1a1a2e;
  font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
  overflow: hidden; display: flex; flex-direction: column; align-items: center; color: white;
}
#app { width: 100%; max-width: 480px; display: flex; flex-direction: column; align-items: center; padding: 20px; }
#q-card { background: rgba(255,255,255,0.1); border-radius: 28px; padding: 30px; width: 100%; text-align: center; margin: 20px 0; border: 1px solid rgba(255,255,255,0.2); }
#q-text { font-size: 48px; font-weight: 900; margin: 20px 0; }
#answers { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
.ans-btn { background: #4ECDC4; border: none; border-radius: 20px; padding: 25px; font-size: 32px; font-weight: 900; color: white; cursor: pointer; box-shadow: 0 6px 0 #36b3a8; }
.ans-btn:active { transform: translateY(6px); box-shadow: none; }
.correct { background: #10B981 !important; box-shadow: 0 6px 0 #0d8a61 !important; }
.wrong { background: #EF4444 !important; box-shadow: 0 6px 0 #c43333 !important; }
.screen { position: fixed; inset: 0; z-index: 100; background: #1a1a2e; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 30px; text-align: center; }
.hidden { display: none !important; }
.btn-p { background: #4ECDC4; color: white; border: none; border-radius: 50px; padding: 18px 44px; font-size: 18px; font-weight: 900; cursor: pointer; }
</style>
</head>
<body>
<div id="app">
  <div id="score-area" style="font-size: 20px;">⭐ <span id="score">0</span></div>
  <div id="q-card">
    <div id="ui-label" style="opacity: 0.6;">MATH CHALLENGE</div>
    <div id="q-text">2 + 3 = ?</div>
  </div>
  <div id="answers"></div>
</div>

<div id="start-screen" class="screen">
  <h1 id="ui-start-t">Math Kids</h1>
  <p id="ui-start-d">Solve simple math problems!</p>
  <button class="btn-p" onclick="start()">START</button>
</div>

<div id="result-screen" class="screen hidden">
  <h1 id="ui-res-t">Finish!</h1>
  <div id="ui-res-s" style="font-size: 32px; margin: 20px 0;">Score: 100</div>
  <button class="btn-p" onclick="start()">AGAIN</button>
</div>

<script>
const T = {
  en: { title:"Math Kids", desc:"Solve simple math problems!", start:"START", finish:"Finish!", score:"Score", again:"AGAIN", label:"MATH CHALLENGE" },
  uz: { title:"Matematika", desc:"Oddiy misollarni yeching!", start:"BOSHLASH", finish:"Tamom!", score:"Ball", again:"QAYTA", label:"MATEMATIKA" },
  ru: { title:"Математика", desc:"Решай простые примеры!", start:"ИГРАТЬ", finish:"Конец!", score:"Счет", again:"ЕЩЕ РАЗ", label:"МАТЕМАТИКА" }
};

let lang = new URLSearchParams(window.location.search).get('lang') || 'en';
let score = 0, current = 0, qNum = 0, total = 5;

function updateUI() {
  const t = T[lang];
  document.getElementById('ui-start-t').textContent = t.title;
  document.getElementById('ui-start-d').textContent = t.desc;
  document.querySelector('#start-screen .btn-p').textContent = t.start;
  document.getElementById('ui-label').textContent = t.label;
}

function next() {
  if (qNum >= total) {
    document.getElementById('ui-res-s').textContent = `${T[lang].score}: ${score}`;
    document.getElementById('result-screen').classList.remove('hidden');
    return;
  }
  const a = Math.floor(Math.random() * 5) + 1;
  const b = Math.floor(Math.random() * 5) + 1;
  current = a + b;
  document.getElementById('q-text').textContent = `${a} + ${b} = ?`;

  const options = [current];
  while(options.length < 4) {
    const r = Math.floor(Math.random() * 10) + 1;
    if (!options.includes(r)) options.push(r);
  }

  const grid = document.getElementById('answers');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(v => {
    const btn = document.createElement('button');
    btn.className = 'ans-btn';
    btn.textContent = v;
    btn.onclick = () => {
      if (v === current) {
        btn.classList.add('correct'); score += 20;
        document.getElementById('score').textContent = score;
        setTimeout(next, 800);
      } else {
        btn.classList.add('wrong');
      }
    };
    grid.appendChild(btn);
  });
  qNum++;
}

function start() {
  score = 0; qNum = 0;
  document.getElementById('score').textContent = "0";
  document.getElementById('start-screen').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  next();
}

window.onload = () => {
  updateUI();
};
</script>
</body>
</html>
