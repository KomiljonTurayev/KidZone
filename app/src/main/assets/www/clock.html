<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Soatni O'rganish ⏰</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background:#f0f4f8;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:20px; display:flex; justify-content:space-between; }
.badge { background:white; border-radius:20px; padding:10px 20px; box-shadow:0 4px 10px rgba(0,0,0,0.05); }

#clock-card {
  width:90%; max-width:360px; background:white; border-radius:32px;
  padding:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1);
  display:flex; flex-direction:column; align-items:center; margin-top:20px;
}
#instruction { font-size:18px; color:#2c3e50; margin-bottom:20px; text-align:center; font-weight:bold; }
#target-time { font-size:36px; color:#FF6B6B; font-weight:900; margin-bottom:20px; }

#clock-face {
  width:260px; height:260px; border-radius:50%; border:12px solid #2d3436;
  position:relative; background:white; box-shadow:inset 0 0 20px rgba(0,0,0,0.1);
}
.number {
  position:absolute; width:100%; height:100%; text-align:center;
  font-size:24px; font-weight:bold; color:#2d3436; padding:10px;
}
.hand {
  position:absolute; bottom:50%; left:50%; transform-origin:bottom;
  border-radius:10px; transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1);
}
#hour-hand { width:8px; height:60px; background:#2d3436; z-index:2; }
#min-hand  { width:5px; height:90px; background:#FF9F43; z-index:1; }
#center-pin {
  position:absolute; top:50%; left:50%; width:16px; height:16px;
  background:#2d3436; border-radius:50%; transform:translate(-50%,-50%); z-index:3;
}

#choices {
  display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:30px; width:90%; max-width:360px;
}
.choice-btn {
  background:white; border:none; border-radius:20px; padding:15px;
  font-size:22px; font-weight:bold; box-shadow:0 6px 15px rgba(0,0,0,0.08);
  cursor:pointer; transition:all 0.1s;
}
.choice-btn:active { transform:scale(0.95); background:#D1FAE5; }
.correct { background:#10B981 !important; color:white; }
.wrong { background:#EF4444 !important; color:white; }
</style>
</head>
<body>
<div id="topbar">
  <div class="badge">⏰ SOAT: <span id="score">0</span></div>
  <div class="badge">DARAJA: <span id="lvl">1</span></div>
</div>

<div id="clock-card">
  <div id="instruction">Bu soat nechini ko'rsatyapti?</div>
  <div id="clock-face">
    <div id="center-pin"></div>
    <div class="hand" id="hour-hand"></div>
    <div class="hand" id="min-hand"></div>
  </div>
</div>

<div id="choices"></div>

<script>
let score = 0, level = 1, currentH = 0, currentM = 0;

function buildClock() {
  const face = document.getElementById('clock-face');
  for(let i=1; i<=12; i++) {
    const num = document.createElement('div');
    num.className = 'number';
    num.textContent = i;
    num.style.transform = `rotate(${i * 30}deg)`;
    face.appendChild(num);
  }
}

function nextQ() {
  currentH = Math.floor(Math.random() * 12);
  currentM = [0, 15, 30, 45][Math.floor(Math.random() * 4)];

  document.getElementById('hour-hand').style.transform = `translateX(-50%) rotate(${currentH * 30 + currentM * 0.5}deg)`;
  document.getElementById('min-hand').style.transform = `translateX(-50%) rotate(${currentM * 6}deg)`;

  const correct = `${currentH === 0 ? 12 : currentH}:${currentM === 0 ? '00' : currentM}`;
  const options = [correct];
  while(options.length < 4) {
    const h = 1 + Math.floor(Math.random() * 12);
    const m = [0, 15, 30, 45][Math.floor(Math.random() * 4)];
    const time = `${h}:${m === 0 ? '00' : m}`;
    if(!options.includes(time)) options.push(time);
  }

  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => check(opt, btn, correct);
    grid.appendChild(btn);
  });
}

function check(val, btn, correct) {
  if(val === correct) {
    btn.classList.add('correct');
    score += 10;
    document.getElementById('score').textContent = score;
    setTimeout(nextQ, 1000);
  } else {
    btn.classList.add('wrong');
  }
}

window.onload = () => { buildClock(); nextQ(); };

window.addEventListener('beforeunload', () => {
  const currentTotal = parseInt(localStorage.getItem('kz-pts') || '0');
  localStorage.setItem('kz-pts', currentTotal + Math.round(score/3));
  localStorage.setItem('kz-prog-clock', '100');
});
</script>
</body>
</html>
