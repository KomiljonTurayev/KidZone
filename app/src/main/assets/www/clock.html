<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Learn Clock ⏰</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; touch-action:manipulation; }
body {
  min-height:100vh; background:#f0f4f8;
  font-family:'Arial Rounded MT Bold',Arial,sans-serif;
  display:flex; flex-direction:column; align-items:center;
}
#topbar { width:100%; padding:20px; display:flex; justify-content:space-between; }
.badge { background:white; border-radius:20px; padding:10px 20px; box-shadow:0 4px 10px rgba(0,0,0,0.05); font-weight: 800; color: #FF6B35; }

#clock-card {
  width:90%; max-width:360px; background:white; border-radius:32px;
  padding:30px; box-shadow:0 15px 40px rgba(0,0,0,0.1);
  display:flex; flex-direction:column; align-items:center; margin-top:20px;
}
#instruction { font-size:18px; color:#2c3e50; margin-bottom:20px; text-align:center; font-weight:bold; }

#clock-face {
  width:260px; height:260px; border-radius:50%; border:12px solid #2d3436;
  position:relative; background:white; box-shadow:inset 0 0 20px rgba(0,0,0,0.1);
}
.number {
  position:absolute; width:100%; height:100%; text-align:center;
  font-size:24px; font-weight:900; color:#2d3436; padding:12px;
}
/* Center numbers upright */
.number span { display: inline-block; }

.hand {
  position:absolute; bottom:50%; left:50%; transform-origin:bottom;
  border-radius:10px; transition:transform 0.6s cubic-bezier(0.34,1.56,0.64,1);
}
#hour-hand { width:8px; height:65px; background:#2d3436; z-index:2; margin-left: -4px; }
#min-hand  { width:6px; height:95px; background:#FF9F43; z-index:1; margin-left: -3px; }
#center-pin {
  position:absolute; top:50%; left:50%; width:18px; height:16px;
  background:#2d3436; border-radius:50%; transform:translate(-50%,-50%); z-index:3;
}

#choices {
  display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:30px; width:90%; max-width:360px;
}
.choice-btn {
  background:white; border:none; border-radius:20px; padding:15px;
  font-size:24px; font-weight:900; box-shadow:0 6px 15px rgba(0,0,0,0.08);
  cursor:pointer; transition:all 0.15s; color: #2d3436;
}
.choice-btn:active { transform:scale(0.92); }
.correct { background:#10B981 !important; color:white; }
.wrong { background:#EF4444 !important; color:white; }
</style>
</head>
<body>
<div id="topbar">
  <div class="badge"><span id="ui-score-label">⭐ SCORE</span>: <span id="score">0</span></div>
  <div class="badge"><span id="ui-lvl-label">LEVEL</span>: <span id="lvl">1</span></div>
</div>

<div id="clock-card">
  <div id="instruction">What time is it?</div>
  <div id="clock-face">
    <div id="center-pin"></div>
    <div class="hand" id="hour-hand"></div>
    <div class="hand" id="min-hand"></div>
  </div>
</div>

<div id="choices"></div>

<script src="game-engine.js"></script>
<script>
const translations = {
    en: { quest: "What time is it?", score: "SCORE", lvl: "LEVEL" },
    uz: { quest: "Bu soat nechini ko'rsatyapti?", score: "BALL", lvl: "DARAJA" },
    ru: { quest: "Который час?", score: "СЧЕТ", lvl: "УРОВЕНЬ" }
};

let score = 0, level = 1, currentH = 12, currentM = 0;
const engine = new KidZoneGame({ id: 'clock' });
const t = engine.getTranslations(translations);

function updateUI() {
    document.getElementById('instruction').textContent = t.quest;
    document.getElementById('ui-score-label').textContent = t.score;
    document.getElementById('ui-lvl-label').textContent = t.lvl;
}

function buildClock() {
  const face = document.getElementById('clock-face');
  for(let i=1; i<=12; i++) {
    const num = document.createElement('div');
    num.className = 'number';
    const angle = i * 30;
    num.style.transform = `rotate(${angle}deg)`;
    num.innerHTML = `<span style="transform:rotate(-${angle}deg)">${i}</span>`;
    face.appendChild(num);
  }
}

function nextQ() {
  currentH = 1 + Math.floor(Math.random() * 12);
  currentM = [0, 15, 30, 45][Math.floor(Math.random() * 4)];

  // Hour hand moves slightly as minutes progress: (H * 30) + (M / 60 * 30)
  const hourDeg = (currentH * 30) + (currentM * 0.5);
  const minDeg = currentM * 6;

  document.getElementById('hour-hand').style.transform = `rotate(${hourDeg}deg)`;
  document.getElementById('min-hand').style.transform = `rotate(${minDeg}deg)`;

  const correctTime = `${currentH}:${currentM === 0 ? '00' : currentM}`;
  const options = [correctTime];
  while(options.length < 4) {
    const h = 1 + Math.floor(Math.random() * 12);
    const m = [0, 15, 30, 45][Math.floor(Math.random() * 4)];
    const time = `${h}:${m === 0 ? '00' : m}`;
    if(!options.includes(time)) options.push(time);
  }

  const grid = document.getElementById('choices');
  grid.innerHTML = '';
  options.sort(() => Math.random() - 0.5).forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = opt;
    btn.onclick = () => check(opt, btn, correctTime);
    grid.appendChild(btn);
  });
}

function check(val, btn, correct) {
  if(val === correct) {
    btn.classList.add('correct');
    score += 10;
    document.getElementById('score').textContent = score;
    engine.playSound('win');
    if (score % 50 === 0) {
        level++;
        document.getElementById('lvl').textContent = level;
    }
    setTimeout(nextQ, 1000);
  } else {
    btn.classList.add('wrong');
    engine.playSound('lose');
    engine.vibrate(50);
  }
}

window.onload = () => { buildClock(); updateUI(); nextQ(); };

window.addEventListener('beforeunload', () => {
  engine.gameOver(Math.round(score/3));
});
</script>
</body>
</html>
