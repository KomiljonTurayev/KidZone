<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Tic-Tac-Toe Kids</title>
    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #FFDE59 0%, #FFBD59 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        #status {
            font-size: 1.5rem;
            color: #ff5757;
            margin-top: 10px;
            height: 2rem;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
            background-color: rgba(0, 0, 0, 0.05);
            padding: 10px;
            border-radius: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        .cell {
            background: #ffffff;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 0 #ddd;
        }
        .cell:not(.taken):hover {
            transform: scale(1.05);
            background: #f9f9f9;
        }
        .cell:active:not(.taken) {
            transform: scale(0.9);
            box-shadow: 0 0 0 #ddd;
        }
        .cell.taken {
            cursor: default;
        }
        .cell.win {
            background: linear-gradient(135deg, #7ed957 0%, #45a049 100%);
            color: white;
            animation: pulse 0.5s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        .controls {
            margin-top: 30px;
        }
        button {
            padding: 12px 25px;
            font-size: 1.2rem;
            background-color: #5ce1e6;
            border: none;
            border-radius: 50px;
            color: white;
            box-shadow: 0 4px #38b6ff;
            cursor: pointer;
        }
        button:active {
            box-shadow: none;
            transform: translateY(4px);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Tic-Tac-Toe</h1>
        <div id="status">Sizning navbatingiz!</div>
    </div>
    <div class="board" id="board"></div>
    <div class="controls"><button onclick="resetGame()">Qaytadan boshlash</button></div>
    <script src="kz-ui.js"></script>
    <script src="game-engine.js"></script>
    <script src="tic-tac-toe.js"></script>
    <script>
    (function() {
      /* back button */
      const b = document.createElement('button');
      b.textContent = '←';
      Object.assign(b.style, {
        position:'fixed',top:'10px',left:'10px',zIndex:'50',
        background:'rgba(0,0,0,.2)',border:'none',borderRadius:'50%',
        width:'38px',height:'38px',fontSize:'18px',cursor:'pointer',color:'#333',
      });
      b.onclick = () => history.back();
      document.body.appendChild(b);

      const _L = navigator.language.startsWith('ru') ? 'ru' : navigator.language.startsWith('en') ? 'en' : 'uz';
      const _H = {
        uz:["Katakchani bosib belgi qo'ying (✕)","Raqib belgisi (○) qo'yadi","3 ta ketma-ket belgi — g'alaba!","Gorizontal, vertikal yoki diagonal","Barcha katakcha to'lsa — durang"],
        ru:["Нажмите клетку чтобы поставить ✕","Соперник ставит ○","3 в ряд — победа!","Горизонталь, вертикаль или диагональ","Все клетки заполнены — ничья"],
        en:["Tap a cell to place your ✕","The bot plays ○","3 in a row wins!","Horizontal, vertical, or diagonal","All cells filled — draw"],
      };
      KZL.howToPlay({
        id:'tic-tac-toe', lang:_L,
        title:_L==='ru'?'Как играть?':_L==='en'?'How to play?':'Qanday o\'ynash?',
        steps:_H[_L]||_H['uz'],
        accentColor:'#5ce1e6',
      });
    })();
    </script>
</body>
</html>
