plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.multiplatform'
}

kotlin {
    androidTarget {
        compilations.all {
            kotlinOptions {
                jvmTarget = '17'
            }
        }
    }
    
    listOf(
        iosX64(),
        iosArm64(),
        iosSimulatorArm64()
    ).forEach {
        it.binaries.framework {
            baseName = 'shared'
            isStatic = true
        }
    }

    sourceSets {
        commonMain {
            dependencies {
                implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.0"
            }
        }
        androidMain {
            dependsOn(commonMain)
        }
        iosMain {
            dependsOn(commonMain)
        }
    }
}

android {
    namespace 'uz.kidzone.shared'
    compileSdk 35
    defaultConfig {
        minSdk 26
    }
}
