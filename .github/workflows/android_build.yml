name: KidZone CI/CD

on:
  push:
    branches: [master, main]
    tags:     ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.3.0)'
        required: true
      track:
        description: 'Play Store track'
        required: true
        default: 'internal'
        type: choice
        options: [internal, alpha, beta, production]
      rollout_percentage:
        description: 'Rollout % (production track uchun)'
        default: '10'

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=true'

# ─────────────────────────────────────────────
# JOB 1 — Debug build (every push / PR)
# ─────────────────────────────────────────────
jobs:
  debug:
    name: "🔨 Debug APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kidzone-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Comment APK link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Debug APK** tayyor!\n\nArtifact: \`kidzone-debug-${{ github.run_number }}\`\n[Actions saytidan yuklab oling](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`
            })

# ─────────────────────────────────────────────
# JOB 2 — Release build (only on v* tags)
# ─────────────────────────────────────────────
  release:
    name: "🚀 Release AAB + APK"
    runs-on: ubuntu-latest
    needs: debug
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Parse version from tag or input
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version_name }}"
          else
            RAW="${GITHUB_REF#refs/tags/v}"
          fi
          MAJOR=$(echo $RAW | cut -d. -f1)
          MINOR=$(echo $RAW | cut -d. -f2)
          PATCH=$(echo $RAW | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "code=$CODE"  >> $GITHUB_OUTPUT
          echo "name=$RAW"   >> $GITHUB_OUTPUT
          echo "tag=v$RAW"   >> $GITHUB_OUTPUT

      # Decode keystore stored as Base64 GitHub secret
      - name: Decode keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/kidzone-release.jks
          echo "KEYSTORE_FILE=kidzone-release.jks" >> $GITHUB_ENV

      - name: Build release AAB
        run: |
          ./gradlew bundleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build release APK
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version.outputs.code }} \
            -PversionName=${{ steps.version.outputs.name }}
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Find release artifacts
        id: artifacts
        run: |
          AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -1)
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "aab=$AAB" >> $GITHUB_OUTPUT
          echo "apk=$APK" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name:              ${{ steps.version.outputs.tag }}
          name:                  "KidZone v${{ steps.version.outputs.name }}"
          draft:                 false
          prerelease:            false
          generate_release_notes: true
          body: |
            ## KidZone v${{ steps.version.outputs.name }}

            ### Yuklab olish
            | Fayl | Tavsif |
            |------|--------|
            | `app-release.aab` | Google Play uchun App Bundle |
            | `app-release.apk` | To'g'ridan-to'g'ri o'rnatish |

            ### O'zgarishlar
            Quyida avtomatik yaratilgan o'zgarishlar ro'yxati ko'rsatilgan.
          files: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.apk }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: kidzone-release-${{ steps.version.outputs.name }}
          path: |
            ${{ steps.artifacts.outputs.aab }}
            ${{ steps.artifacts.outputs.apk }}
          retention-days: 90
